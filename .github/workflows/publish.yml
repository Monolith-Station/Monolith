name: Publish
concurrency:
  group: publish
  cancel-in-progress: true


on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'

# Forge-Secrets start
    - name: Setup secrets
      env:
        SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
      if: ${{ env.SECRETS_TOKEN != '' }}
      run: |
        git clone https://x-access-token:${SECRETS_TOKEN}@github.com/Forge-Station/MonolithSecrets.git MonolithSecrets
        cp -R MonolithSecrets/Resources/Prototypes Resources/Prototypes/_Forge/MonolithSecrets
        cp -R MonolithSecrets/Resources/Locale Resources/Locale/ru-RU/monolith-secrets
        cp -R MonolithSecrets/Resources/Textures Resources/Textures/_Forge/MonolithSecrets
        cp -R MonolithSecrets/Resources/Audio Resources/Audio/_Forge/MonolithSecrets
# Forge-Secrets end

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Route CDN publish through direct IP
      run: echo "${{ secrets.CDN_DIRECT_IP }} cdn.corvaxforge.ru" | sudo tee -a /etc/hosts > /dev/null

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

