- proto: PaperOffice
  entities:
  - uid: 4494
    components:
    - type: MetaData
      desc: A printed out voice transcript of an anonymous crewmate keeping records on Aurora. It gets weirdly scratchier the further you read.
      name: Recorder Transcript
    - type: Transform
      pos: 8.4371395,-10.277938
      parent: 1
    - type: Paper
      content: >-
        ///LOG--------


        ///(32 DAYS AGO)

        ///Its been about a month since the departure from Rubicon. Aurora is nearing Colossus, and she's all stocked for the journey. Advanced nanoforge, enough guns to hold off pirates, and plenty space and supplies to last her at least years. Once the genie's gone into the bottle, it will be very hard to open again.


        ///(14 DAYS AGO)

        ///Solitary silence drifting amidst the stars. The last tanker vessel gave the rest of its fuel to let Aurora make the rest of the trip to colossus. Its too dangerous regardless to keep going for them, as hostile microships keep attacking the main flagship. Thankfully the damage they do is minimal and easily quickly repaired. Save for the larger aggressive ones that always show out of nowhere... Why do they have to have the same IFF reads as rocks!?


        ///(8 DAYS AGO)

        ///One of the initiates considered moving some of the material in the silo through extracting it from the lathes and reusing it for repairs. We considered, and given the need for repairs due to constant drone raids, we'll approve it. This'll be fine.

        ///Update: It was not. The initiate fatfingered the Fissile button and atomized three carpenters, and themselves. A hole spaced much of the room and anything inside it got absolutely trashed. My day is ruined...


        ///(3 DAYS AGO)

        ///Alright, the survivors fixed everything up. Ship's good as new, but the loss of those industry machines we were going to use was permanent. Emissions have been wearing at our RND too, for some reason it keeps wiping itself periodically for no good reason. We tried keeping hard-drive copies of our tech, but even that lead to nothing. We'll just have to live without the tech.


        ///(1 DAY AGO)

        ///We're here. Colossus seems quite lively, more lively than expected. The old colony vessel at Marzanna is most likely still functional, but it will take some time to relink with that outpost group and get back to monitoring Aerumna. God, what a plague on the sector...


        /////////

        /////////

        ///DO YOU REMEMBER THE TRAGEDY OF AERUMNA?

        ///SWEET, INFECTIOUS DESPAIR. BILLIONS SCREAMED, ONLY TO BE SILENCED.

        /// YOU ARE N E X T

        ///HA HA HA HA.

        ///HA HA HA HA.

        ///HA HA HA HA.

        ///H A H A H A H A.

        ...


        *The words are too difficult to read past this point.*
