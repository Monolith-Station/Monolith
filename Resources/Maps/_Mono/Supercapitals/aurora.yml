        ///Diagnosis: Fabrication room is FUCKED. Impromptu handling of explosive material busted everything up. Walls were fixed but advanced equipment's gone for good.


        ///God... at least the silo's intact. Milfab was replaced, so try not to blow a hole in the ship please?


        ///END
