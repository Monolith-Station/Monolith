        [bold]Z-22 Leopard:[/bold] [form]


        [bold]Preflight Check Items:[/bold]

        - < ✔ > External Inspection

        - < ✔ > Fuel Level Check

        - < ✔ > Hydraulic Systems Check

        - < ✔ > Electrical Systems Check

        - < ✔ > Navigation Systems Check

        - < ✔ > Communication Systems Check

        - < ✔ > Engine Start Procedure

        - < ✔ > Flight Controls Check

        - < ✔ > Weapon Systems Check

        - < ✔ > Safety Equipment Check


        [bold]Notes:[/bold]

        Each of the bay doors have been linked to the shuttle console's relative ports, allowing the pilot to close up the bays after deploying to prevent unwanted boarding actions. In addition, port 5 on the console has been linked with the main access airlocks upto the cockpit in the event of boarding actions, and pressing port 5 will bolt all shuttle doors. Port 6 has been linked to the cockpit shutters.
