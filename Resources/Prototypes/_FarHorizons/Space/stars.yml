# Red Dwarf
- type: starType
  id: TypeMStar
  shader: MainSequenceStar
  solarMass:
    min: 0.08
    max: 0.45
  color: '#E62A10'
  orbits:
    - type: InnerHot
      prob: 0.95
    - type: InnerHabitable
    - type: InnerCold
      prob: 0.75
    - type: Belt
      prob: 0.9
    - type: OuterWarm
    - type: OuterCold
      prob: 0.6
  asteroidBelts: [ StandardAsteroidBelt ]

