# Generic placeholders, plus the named bodies actually used by systems.
# Orbits live on the starSystem entry that lists the planet.

- type: planetType
  id: PlanetTypeVolcanic
  name: Volcanic
  shader: RockyPlanet
  earthMass: 0.8
  palette: PaletteVolcanicMagma
  atmosphere: VolcanicAtmosphere
  liquid: LiquidMagma
  customData:
    floats:
      terrainScale: 1.0
      macroFrequency: 3.75
      macroAmplitude: 0.75
      ridgeFrequency: 1.0
      ridgeAmplitude: 7.5
      detailFrequency: 7.5
      detailAmplitude: 0.25
      polarCapColor: 0.875
      polarCapCoverage: 0.2

