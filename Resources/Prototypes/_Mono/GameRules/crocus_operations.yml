- type: weightedRandom
  id: PDVOperationsCrocus
  weights:
    PDVCrocusNanitesOperation: 1
    PDVCrocusKillsOperation: 1
    PDVCrocusBothOperation: 1

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseFactionalObjectives
  components:
  - type: GameRule
    minPlayers: 0
    cancelPresetOnTooFewPlayers: false

- type: nukieOperation
  id: PDVCrocusBothOperation
  operationObjectives:
  - PDVCrocusObjectivePDAs
  - PDVCrocusObjectiveNanites
  - PDVCrocusObjectiveBeaconDestroy

- type: entity
  parent: BaseFactionalObjectives
  id: PDVObjectivesCrocus
  components:
  - type: RandomMetadata
    nameSegments:
    - operationPrefixPDVCrocus
    - operationSuffixPDVCrocus
  - type: NukieOperation
    operations: PDVOperationsCrocus
    participatingCompany: PDV
  - type: Company
    companyName: PDV

- type: nukieOperation
  id: PDVCrocusNanitesOperation
  operationObjectives:
  - PDVCrocusObjectiveNanites
  - PDVCrocusObjectiveBeaconDestroy

- type: entity
  parent: BaseStealObjective
  id: PDVCrocusObjectiveBase
  abstract: true
  components:
  - type: Objective
    difficulty: 1.0
    unique: false
    issuer: objective-issuer-pdv
  - type: StealCondition
    owner: objective-condition-steal-tsf
    verifyMapExistence: false
    checkStealAreas: true
    stealAreaTagProto: PDVStealArea
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    objectiveNoOwnerText: objective-condition-steal-title-faction-no-owner
    descriptionText: objective-condition-steal-description-faction-beacon-crocus
    descriptionMultiplyText: objective-condition-steal-multiply-description-faction-crocus
  - type: Company
    companyName: PDV

- type: entity
  parent: PDVCrocusObjectiveBase
  id: PDVCrocusObjectiveNanites
  components:
  - type: Objective
    icon:
      sprite: _Mono/Objects/TradeGoods/factiongoods.rsi
      state: nanitecanister
  - type: StealCondition
    minCollectionSize: 50
    maxCollectionSize: 110
    stealGroup: FederalNanites

- type: stealTargetGroup
  id: FederalNanites
  name: steal-target-groups-federal-nanites
  sprite:
    sprite: _Mono/Objects/TradeGoods/factiongoods.rsi
    state: nanitecanister

- type: stealTargetGroup
  id: BeaconDestroys
  name: steal-target-groups-beacon-repairs
  sprite:
    sprite: _Mono/Structures/Machines/beacon.rsi
    state: beacon

- type: entity
  parent: PDVCrocusObjectiveBase
  id: PDVCrocusObjectiveBeaconDestroy
  components:
  - type: Objective
    icon:
      sprite: _Mono/Structures/Machines/beacon.rsi
      state: beacon
  - type: StealCondition
    minCollectionSize: 2
    maxCollectionSize: 6
    objectiveText: objective-condition-steal-title-destroy
    objectiveNoOwnerText: objective-condition-steal-title-destroy
    descriptionText: objective-condition-steal-description-faction-beacon-crocus-destroy
    descriptionMultiplyText: objective-condition-steal-multiply-description-faction-beacon-crocus-destroy
    stealGroup: BeaconDestroys

