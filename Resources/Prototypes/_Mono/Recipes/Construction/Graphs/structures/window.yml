- type: constructionGraph
  id: WindowFrame
  start: start
  graph:
    - node: start
      edges:
        - to: windowFrame
          completed:
            - !type:SnapToGrid
              southRotation: false
          steps:
            - material: Plasteel
              amount: 1
              doAfter: 1

    - node: windowFrame
      entity: WindowFrame
