- type: entity
  parent: ClothingBackpackDroneLootT1
  id: ClothingBackpackDroneLootT22
  name: blackbox data recorder (T2-2)
  description: Data recorder from a drone. Contains valuable components.
  suffix: Drone Loot
  components:
  - type: SpawnItemsOnUse
    items:
    # Money - 200k # removed
    # Scrap chunks
    - id: ScrapOre100
      amount: 3 # Forge-change
#      maxAmount: 5 # Forge-change
    # Material
    - id: SheetPlastitanium10
      amount: 3 # Forge-change
 #     maxAmount: 6 # Forge-change
    # Parts
#    - id: SuperCapacitorStockPart   Forge-Change
#      amount: 3 
#    - id: SuperMatterBinStockPart   Forge-Change
#      amount: 3 
#    - id: PicoManipulatorStockPart   Forge-Change
#      amount: 3 
    # rare t4 parts
    - id: QuadraticCapacitorStockPart
      amount: 1 # Forge-Change
      maxAmount: 5 # Forge-Change ## +1 to the value, since the upper bound is not included in the range.
    - id: FemtoManipulatorStockPart
      amount: 1 # Forge-Change
      maxAmount: 3 # Forge-Change ## +1 to the value, since the upper bound is not included in the range.
    - id: BluespaceMatterBinStockPart
      amount: 1 # Forge-Change
      maxAmount: 3 # Forge-Change ## +1 to the value, since the upper bound is not included in the range.
    - id: SpawnDungeonLootPowerCell
      prob: 0.6 # Forge-Change
    - id: PowerCellMicroreactor
    # free guns
    - id: WeaponTurretShardFlatpack
      prob: 0.75 # Forge-Change
    - id: WeaponTurretPinholeFlatpack
      prob: 0.5 # Forge-Change
    # no flatpacks or boards, just gamble scrap
    # Research disk, expected value 200k/drone
    - id: RogueSiliconResearchDisk50000
      amount: 2 # Forge-change
      maxAmount: 4 # Forge-change ## +1 to the value, since the upper bound is not included in the range.
    # Tech disk
    - id: SpawnLootTechDisksT3Mech
      prob: 0.6
    - id: SpawnLootTechDisksT3Fracture
      prob: 0.2
    - id: TechDiskOmegaGunnery # Forge-Change
      prob: 0.03 # Forge-Change: 3%
    # Tier-4 bluespace boarding teleport (0.005%)
    - id: DisciplinesDiskBoardingTeleportTier4
      prob: 0.05
    sound:
      path: /Audio/Machines/windoor_open.ogg
