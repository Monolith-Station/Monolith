- type: weightedRandom
  id: TSFOperations
  weights:
    TSFOperationMonolithSurvey: 0.2
    TSFOperationPDVDisarming: 0.2
    TSFOperationIndustrial: 0.2
    TSFOperationTechnology: 0.2
    TSFOperationWhatever: 0.1
    TSFOperationMMCGear: 0.05
    TSFOperationIHateEveryone: 0.02

# Mixed

- type: nukieOperation
  id: TSFOperationTechnology
  operationObjectives:
  - TSFTechDisksObjective
  - TSFPDVCyberneticsObjective
  - TSFMMCAutosurgeonFlatpacksObjective

- type: nukieOperation
  id: TSFOperationIndustrial
  operationObjectives:
  - TSFLPCsObjective
  - TSFComponentsObjectiveBulk

- type: nukieOperation
  id: TSFOperationWhatever
  operationObjectives:
  - TSFPDVWeaponsObjective
  - TSFComponentsObjectiveBulk
  - TSFCrystalsObjective

- type: nukieOperation
  id: TSFOperationIHateEveryone
  operationObjectives:
  - TSFPDVWeaponsObjective
  - TSFPDVCyberneticsObjective
  - TSFMMCAutosurgeonFlatpacksObjective
  - TSFMMCToolsObjective
  - TSFBlackBoxesObjective

# Mono survey (environmental and technology data)

- type: nukieOperation
  id: TSFOperationMonolithSurvey
  operationObjectives:
  - TSFBlackBoxesObjective
  - TSFCrystalsObjective
  - TSFTechDisksObjective

- type: entity
  parent: BaseStealObjective
  id: TSFBlackBoxesObjective
  components:
  - type: Objective
    difficulty: 1.0
    issuer: objective-issuer-tsf
    icon:
      sprite: _NF/Objects/Tools/bundles.rsi
      state: engi-base
  - type: StealCondition
    minCollectionSize: 2
    maxCollectionSize: 4
    stealGroup: BlackBoxes
    owner: objective-condition-steal-drone
    verifyMapExistence: false
    checkStealAreas: true
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    objectiveNoOwnerText: objective-condition-steal-title-faction-no-owner
    descriptionText: objective-condition-steal-description-faction
    descriptionMultiplyText: objective-condition-steal-multiply-description-faction

- type: entity
  parent: BaseStealObjective
  id: TSFCrystalsObjective
  components:
  - type: Objective
    difficulty: 1.0
    issuer: objective-issuer-tsf
    icon:
      sprite: _Mono/Objects/Materials/monolith_crystal.rsi
      state: crystal_medium
  - type: StealCondition
    minCollectionSize: 2
    maxCollectionSize: 12
    stealGroup: MonolithCrystals
    owner: objective-condition-steal-monolith
    verifyMapExistence: false
    checkStealAreas: true
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    objectiveNoOwnerText: objective-condition-steal-title-faction-no-owner
    descriptionText: objective-condition-steal-description-faction
    descriptionMultiplyText: objective-condition-steal-multiply-description-faction

- type: entity
  parent: BaseStealObjective
  id: TSFTechDisksObjective
  components:
  - type: Objective
    difficulty: 1.0
    issuer: objective-issuer-tsf
    icon:
      sprite: _Mono/Objects/Specific/Research/researchdisk.rsi
      state: icon
  - type: StealCondition
    minCollectionSize: 1
    maxCollectionSize: 10
    stealGroup: MonoTechDisks
    owner: objective-condition-steal-sevas
    verifyMapExistence: false
    checkStealAreas: true
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    objectiveNoOwnerText: objective-condition-steal-title-faction-no-owner
    descriptionText: objective-condition-steal-description-faction
    descriptionMultiplyText: objective-condition-steal-multiply-description-faction

