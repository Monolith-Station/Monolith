  - type: ConditionalSpawner
    prototypes:
    - PlayerBorgRedactedGhostRolePlaytime
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Mobs/Silicon/chassis.rsi
      state: derelict_icon

