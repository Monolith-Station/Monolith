- type: entity
  name: ADS tender spawner
  id: SpawnRedactedBorg
  parent: MarkerBase
  components:
  - type: ConditionalSpawner
    prototypes:
    - PlayerBorgRedactedGhostRole
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Mobs/Silicon/chassis.rsi
      state: derelict_icon

