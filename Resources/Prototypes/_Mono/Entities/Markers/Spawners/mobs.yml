# TSFMC Mobs

- type: entity
  name: TSFMC marine
  parent: MobTSFMCBase
  id: MobTSFMCBaseA
  description: A typical TSFMC marine grunt on guard duty. He looks to be armed with a lecter.
  categories: [ HideSpawnMenu ]
  components:
    - type: Loadout
      prototypes:
        - TSFMCMobGearA
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.25
      rechargeSound:
        path: /Audio/_NF/Effects/silence.ogg
    - type: BasicEntityAmmoProvider
      proto: Bullet68x52mmCaseless
      capacity: 1
      count: 1
    - type: Gun
      showExamineText: false
      fireRate: 8
      selectedMode: FullAuto
      availableModes:
      - SemiAuto
      soundGunshot: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/light_rifle_1.ogg

# PDV Mobs
- type: entity
  name: PDV guardsman
  parent: MobPDVBase
  id: MobPDVBaseA
  description: A guardsman of the Sultan's illustrious Vanguard. He looks to be armed with a C-20r.
  categories: [ HideSpawnMenu ]
  components:
    - type: Loadout
      prototypes:
        - PDVMobGearA
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.25
      rechargeSound:
        path: /Audio/_NF/Effects/silence.ogg
    - type: BasicEntityAmmoProvider
      proto: Bullet9x19mmFMJ
      capacity: 1
      count: 1
    - type: Gun
      showExamineText: false
      fireRate: 8
      selectedMode: FullAuto
      availableModes:
      - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/c-20r.ogg

# Spawners

- type: entity
  name: TSFMC Mob spawner
  id: SpawnMobTSFMC
  parent: MarkerBase
  suffix: AI, Hostile, TSFMC
  components:
  - type: Sprite
    layers:
      - state: blue
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
  - type: ConditionalSpawner
    prototypes:
    - MobTSFMCBaseA

- type: entity
  name: PDV Mob spawner
  id: SpawnMobPDV
  parent: MarkerBase
  suffix: AI, Hostile, PDV
  components:
  - type: Sprite
    layers:
      - state: red
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
  - type: ConditionalSpawner
    prototypes:
    - MobPDVBaseA

