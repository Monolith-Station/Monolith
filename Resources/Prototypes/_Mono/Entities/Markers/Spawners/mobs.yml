# Mono Mobs

# TSFMC Base Mob - in case we do more loadouts

- type: entity
  name: TSFMC marine
  description: A marine belonging to the TSFMC on guard duty.
  abstract: true
  categories: [ HideSpawnMenu ]
  parent:
  - MobHumanoidInvetory
  - MobHumanoidHostileAISimpleRanged
  - NFMobRestrictions
  - MobHumanoidHostileBase
  id: MobTSFMCBase
  components:
  - type: Body
    prototype: HumanSyntheticOrgans # New set of synthetic organs grants faster removal of toxins from bloodstream
    requiredLegs: 2
  - type: NpcFactionMember
    factions:
    - TSFMC
  #- type: AutoImplant
  #  implants:
  #  - TrackingImplant
  #  - DeathAcidifierImplantNF
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: Advertise
    pack: tsfmchumanoidchatter
    minimumWait: 30
    maximumWait: 120
    nextAdvertisementTime: 0
  - type: AutoWakeUp
  - type: TriggerOnBeingGibbed
  - type: GibOnTrigger
    deleteItems: true
    deleteOrgans: false
    gib: false
    useArgumentEntity: true
  - type: MovementSpeedModifier
    baseWalkSpeed : 4.5
    baseSprintSpeed : 4.5

