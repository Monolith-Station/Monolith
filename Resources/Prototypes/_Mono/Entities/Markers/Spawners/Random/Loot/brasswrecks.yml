
- type: entity
  name: random ship weapon
  id: SpawnBrassLootShipGunFlatpacks
  parent: MarkerBasePlaceFree
  suffix: "Brass Wrecks, Shipguns, Superlight - Heavy"
  components:
  - type: Sprite
    layers:
    - state: green
      scale: 0.7, 0.7
    - sprite: Objects/Weapons/Bombs/seismic.rsi
      state: icon
    - sprite: _NF/Markers/general.rsi
      state: questionmark
      color: red
  - type: RandomSpawner
    prototypes:
    - SpawnBrassLootFlatpackShipGunsLight
    chance: 1.0
    offset: 0.0
    rarePrototypes:
    - SpawnBrassLootFlatpackShipGunsHeavy
    rareChance: 0.1

