# Spawners

- type: entity
  name: wayward TSFMC Mob spawner
  id: SpawnMobVoidTSFMC
  parent: MarkerBase
  suffix: AI, Hostile
  components:
  - type: Sprite
    layers:
      - state: blue
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
      - sprite: _NF/Clothing/Head/Helmets/mercenary_black.rsi
        state: equipped-HELMET
      - sprite: _Mono/Clothing/Uniforms/Jumpsuit/tsfmc.rsi
        state: equipped-INNERCLOTHING
      - sprite: Clothing/Shoes/Boots/combatboots.rsi
        state: equipped-FEET
      - sprite: _Mono/Objects/Weapons/Guns/Rifles/lecter_inhands_32x.rsi
        state: wielded-inhand-right
  - type: RandomSpawner
    prototypes:
    - MobVoidBaseTSF
    - MobVoidBaseTSFB
    - MobVoidBaseTSFC
    - MobVoidBaseTSFD

- type: entity
  name: wayward PDV Mob spawner
  id: SpawnMobVoidPDV
  parent: MarkerBase
  suffix: AI, Hostile
  components:
  - type: Sprite
    layers:
      - state: red
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
      - sprite: _NF/Clothing/Head/Hats/nfsd_beret_brown.rsi
        state: equipped-HELMET
      - sprite: _NF/Clothing/Uniforms/Jumpsuit/nfsd_tac_cream.rsi
        state: equipped-INNERCLOTHING
      - sprite: Clothing/Shoes/Boots/combatboots.rsi
        state: equipped-FEET
      - sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
        state: wielded-inhand-right
  - type: RandomSpawner
    prototypes:
    - MobVoidBasePDV
    - MobVoidBasePDVB
    - MobVoidBasePDVC
    - MobVoidBasePDVD
