# Mono Mobs

# Void Base Mob - in case we do more loadouts

- type: entity
  name: wayward shade
  description: Something great has been lost.
  abstract: true
  categories: [ HideSpawnMenu ]
  parent:
  - MobHumanoidInvetory
  - MobHumanoidHostileAISimpleRanged
  - NFMobRestrictions
  - MobHumanoidHostileBaseShade
  id: MobVoidBase
  components:
  - type: NpcFactionMember
    factions:
    - Monolithic
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: PointLight
    enabled: true
    radius: 0.5
    energy: 1
    color: "#AA00FF"
  - type: AutoWakeUp
  - type: TriggerOnBeingGibbed
  - type: GibOnTrigger
    deleteItems: true
    deleteOrgans: false
    gib: false
    useArgumentEntity: true
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 2.5

# Base TSFMC Void Mob

- type: entity
  name: wayward marine
  parent: MobVoidBase
  id: MobVoidBaseTSF
  description: Long gone from home, hollowed out from emissions. Expect a fight.
  categories: [ HideSpawnMenu ]
  components:
    - type: Advertise
      pack: WaywardComments
      minimumWait: 30
      maximumWait: 120
      nextAdvertisementTime: 0
    - type: Loadout
      prototypes:
        - TSFMCMobGearAWayward
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.25
      rechargeSound:
        path: /Audio/_NF/Effects/silence.ogg
    - type: BasicEntityAmmoProvider
      proto: Bullet68x52mmCaseless
      capacity: 1
      count: 1
    - type: Gun
      damageModifier: 0.8
      minAngle: 5
      maxAngle: 20
      showExamineText: false
      fireRate: 8
      selectedMode: FullAuto
      availableModes:
      - FullAuto
      soundGunshot: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/light_rifle_1.ogg

