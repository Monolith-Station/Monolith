# Spawners

- type: entity
  name: void TSFMC Mob spawner
  id: SpawnMobVoidTSFMC
  parent: MarkerBase
  suffix: AI, Hostile, Voidsman
  components:
  - type: Sprite
    layers:
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
  - type: RandomSpawner
    prototypes:
    - MobVoidBaseTSF
    - MobVoidBaseTSFB
    - MobVoidBaseTSFC
    - MobVoidBaseTSFD

