  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: ShieldGeneratorMedium
    stackRequirements:
      Glass: 10
      Steel: 10
      Plasma: 30
      Plasteel: 20
      Gold: 10
      Silver: 10
      UraniumFissile: 1
  
