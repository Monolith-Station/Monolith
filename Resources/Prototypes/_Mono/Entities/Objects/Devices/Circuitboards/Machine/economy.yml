- type: entity
  id: CentrifugeLatheMiniCircuitboard
  parent: BaseMachineCircuitboard
  name: miniature economy centrifuge machine board
  description: A machine printed circuit board for a miniature centrifuge.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: CentrifugeLatheMini
    requirements:
      MatterBin: 2
      Manipulator: 2
      Capacitor: 2
    stackRequirements:
      Glass: 5
      CableHV: 5
    tagRequirements:
      GlassBeaker:
        amount: 4
        defaultPrototype: Beaker

- type: entity
  id: IndustrialPressEconomyPlatesMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: industrial press (plates) machine board
  description: A machine printed circuit board for an industrial press, calibrated for plating. Screwdrive it to switch between variants.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: IndustrialPressEconomyPlates
    requirements:
      Capacitor: 2
    stackRequirements:
      Glass: 5
      Lithium: 5
      Plasteel: 20
      CableHV: 10
    #tagRequirements: # todo: make it take a press plate component
    #  GlassBeaker:
    #    amount: 1
    #    defaultPrototype: Beaker
  - type: Construction
    deconstructionTarget: null
    graph: IndustrialPress
    node: plates

