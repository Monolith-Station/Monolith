- type: entity
  id: CentrifugeLatheMiniCircuitboard
  parent: BaseMachineCircuitboard
  name: miniature economy centrifuge machine board
  description: A machine printed circuit board for a miniature centrifuge.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    flatpackable: false
    prototype: CentrifugeLatheMini
    requirements:
      MatterBin: 2
      Manipulator: 2
      Capacitor: 2
    stackRequirements:
      Glass: 5
      CableHV: 5
    tagRequirements:
      ArmorPlateEconomy1: # Reinforcement. Things that spin very heavy things very fast are very dangerous.
        amount: 2
        defaultPrototype: ArmorPlateEconomy1
      ComponentBrickEconomy1:
        amount: 1
        defaultPrototype: ComponentBrickEconomy1

