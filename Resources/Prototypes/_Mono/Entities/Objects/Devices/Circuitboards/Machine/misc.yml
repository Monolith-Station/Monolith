  name: containment field generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ContainmentFieldGenerator
    requirements:
      Capacitor: 4
    stackRequirements:
      Plasteel: 4

- type: entity
  parent: BaseMachineCircuitboard
  id: SmartfridgeCircuitboard
