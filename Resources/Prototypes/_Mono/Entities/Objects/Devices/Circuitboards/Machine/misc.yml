- type: entity
  parent: BaseMachineCircuitboard
  id: CarpCallerMachineCircuitboard
  name: carp caller machine board
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: MachineCarpCaller
    requirements:
      Capacitor: 2
      Manipulator: 2
    stackRequirements:
      Plasma: 2

- type: entity
