- type: entity
  parent: BasePDA
  id: BaseMAWCPDA
  abstract: true
  description: A hardlight PDA developed by MAWC for their employees.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _Mono/Objects/Devices/pda.rsi
    state: initiate-off
  - type: Item
    sprite: _NF/Objects/Devices/pda.rsi
  - type: Clothing
    sprite: _NF/Objects/Devices/pda.rsi
    clothingVisuals:
      idcard:
      - sprite: _Mono/Objects/Devices/pda.rsi
        state: equipped
        shader: unshaded
      belt:
      - sprite: _Mono/Objects/Devices/pda.rsi
        state: equipped
        shader: unshaded
  - type: PdaBorderColor
    borderColor: "#ffc759"
  - type: GenericVisualizer
    visuals:
      enum.PdaVisuals.InUse:
        in-use-overlay:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: BaseMAWCPDA
  id: MAWCInitiatePDA
  name: MAWC Initiate PDA
  components:
  - type: Pda
    id: MAWCInitiateIDCard
  - type: PdaVisuals
    stateWithIdCard: initiate-on
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType: !type:String initiate-off
  - type: Sprite
    layers:
    - state: initiate-off
      map: [enum.PdaVisualLayers.Base]
    - state: light_overlay
      sprite: _NF/Objects/Devices/pda.rsi
      map: [enum.PdaVisualLayers.Flashlight]
      shader: unshaded
      visible: false
    - state: id_overlay
      sprite: _NF/Objects/Devices/pda.rsi
      map: [enum.PdaVisualLayers.IdLight]
      shader: unshaded
      visible: false
    - state: pda-overlay
      map: [in-use-overlay]
      shader: unshaded
      visible: false

