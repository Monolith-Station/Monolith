- type: entity
  parent: BaseItem
  id: FactionCash
  name: faction credits
  description: Faction credits, available for bank deposit even for faction members.
  components:
  - type: Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Currency
    price:
      Speso: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      FactionCredit: 1
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: FactionCredit
    count: 1
    baseLayer: base
    layerStates:
    - cash
    - cash_10
    - cash_100
    - cash_500
    - cash_1000
    - cash_5000
    - cash_10000
    - cash_25000
    - cash_50000
    - cash_100000
    - cash_250000
    layerFunction: Threshold
  - type: UserInterface
    interfaces:
      enum.StackCustomSplitUiKey.Key:
        type: StackCustomSplitBoundUserInterface
  - type: StackLayerThreshold
    thresholds: [10, 100, 500, 1000, 5000, 10000, 25000, 50000, 100000, 250000]
  - type: Sprite
    sprite: _NF/Objects/Economy/cash.rsi
    state: cash
    layers:
    - state: cash
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance
  - type: CargoSellBlacklist
  - type: ShipyardSellCondition
    preserveOnSale: true

- type: material
  id: FactionCredit
  name: faction credit
  unit: materials-unit-bill
  stackEntity: FactionCash
  icon: { sprite: _NF/Objects/Economy/cash.rsi, state: cash }
  price: 1

- type: stack
  id: FactionCredit
