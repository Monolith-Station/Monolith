    size: Small
    sprite: _Mono/Objects/Devices/caelestinus_activator.rsi
  - type: Sprite
    sprite: _Mono/Objects/Devices/caelestinus_activator.rsi
    layers: 
    - state: activator

- type: entity
  parent: BaseCaelestinusArchonActivator
