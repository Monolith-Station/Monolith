  - type: Sprite
    layers: 
    - state: activator
    - state: alpha
      shader: unshaded

- type: entity
  parent: BaseCaelestinusArchonActivator
  id: CaelestinusArchonActivatorOmega
  name: caelestinus flagship "Archon" activation chip OMEGA
  suffix: Reverse-Engineered # clarity
  description: A small chip containing the culmination of Caelestinus' reverse-engineering efforts, containing the data necessary to construct a blueprint of the Archon-class flagship.
  components:
  - type: Sprite
    layers: 
    - state: activator
    - state: omega
      shader: unshaded

