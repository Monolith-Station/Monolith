- type: entity
  parent: IDCardStandard
  id: BaseMAWCIDCard
  abstract: true
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/id_cards.rsi
  - type: Item
    sprite: Objects/Misc/id_cards.rsi
  - type: Clothing
    clothingVisuals:
      idcard:
      - sprite: _Mono/Objects/Misc/id_cards.rsi
        state: equipped
        shader: unshaded

- type: entity
  parent: BaseMAWCIDCard
  id: MAWCInitiateIDCard
  name: MAWC Initiate ID card
  components:
  - type: PresetIdCard
    job: MAWCInitiate
  - type: Sprite
    layers:
    - state: initiate
    - state: card-overlay
      shader: unshaded

