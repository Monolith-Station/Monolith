- type: entity
  parent: [ BaseMachinePowered, StorePresetSecurityUplink ]
  id: SecurityUplinkVendor
  name: TSFMC Uplink Vendor
  description: An anchored, stationary TSFMC Uplink.
  suffix: POI, Empty
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/tsfuplinkvendor.rsi
    layers:
    - state: base
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Tag
    tags:
    - SecurityUplink
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: DisableToolUse
    anchoring: true

