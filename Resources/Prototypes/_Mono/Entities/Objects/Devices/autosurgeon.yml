    state: icon-mmc

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonAdvHeartMMC
  name: MMC autosurgeon (EVT-001 replacement heart)
  description: Replaces the heart with a more strange one. The exact manner of how is unknown, but it allows the user to channel a form of latent energy into a single hit.
