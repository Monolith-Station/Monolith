- type: entity
  name: M-WC CQC-4 'Claw'
  parent: BaseMeleeWeaponEnergy
  id: WeaponMawcClaw
  description: 'A bog standard combat knife ergonomics wise, with an unusual energy blade of hardlight. A compact hook of solidified, searing hardlight makes up the blade, creating a slashing knife that is capable of some really nasty injuries the ERs will hate you for inflicting. The unique shape of the knife even lets it work like a bottle opener! A thousand degree bottle opener. Standard issue melee for all MAWC operatives.'
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
      params:
        volume: -6
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
      params:
        volume: -6
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/ebladehum.ogg
      params:
        volume: -6
  - type: ItemToggleMeleeWeapon
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        volume: -3
        variation: 0.250
    activatedDamage:
      types:
        Slash: 20
        Heat: 10
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: DisarmMalus
      malus: 0.4
    - type: Execution
      doAfterDuration: 4.0
    - type: Tool
      qualities:
      - Prying
      useSound:
        path: /Audio/Items/crowbar.ogg
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Melee/clawjack.rsi
    layers:
    - state: e_sword
    - state: e_sword_blade
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    size: Small
    sprite: _Mono/Objects/Weapons/Melee/clawjack.rsi
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1.5
    color: white
    netsync: false
  - type: MeleeWeapon
    heavyStaminaCost: 1
    wideAnimationRotation: 145
    attackRate: 1.3
    hidden: true
    damage:
      types:
        Blunt: 1
  - type: EnergySword
    colorOptions:
    - "#FFFFFF85"
    activatedColor: "#FFFFFF85"
    blockHacking: true
  - type: Tag
    tags:
    - Knife
