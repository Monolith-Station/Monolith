- type: entity
  parent: BaseGunAttachmentGrip
  id: GunAttachmentGripErebusVFG
  name: vertical foregrip (Erebus-HI railmount)
  description: Makes it easier to control recoil, but harder to recover from it. Also helps with first-shot spread control.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Attachments/Grips/erebus_railmount.rsi
    state: vfg
  - type: ESGunRecoilAttachment # It's a handgrip. You hold onto it. Why would it ever help one-handed.
    recoilRecoveryModifier: 1.2
    recoilIncreaseModifier: 1.0
    minSpreadModifier: 1.05
    maxSpreadModifier: 1.05
  - type: ESGunWieldRecoilAttachment
    wieldRecoilRecoveryModifier: 1.55
    wieldRecoilIncreaseModifier: 2.8
    wieldMinSpreadModifier: 1.25
    wieldMaxSpreadModifier: 1.05
  - type: Tag
    tags:
    - MonoGrip
    - MonoGripErebusRailmount
    - MonoGripVFG

- type: entity
  parent: BaseGunAttachmentGrip
  id: GunAttachmentGripErebusLAM
  name: Zenit PRL laser-aiming module (Erebus-HI railmount)
  description: A visual-spectrum red laser for aiming. Looks awesome, and helps a lot with first shot accuracy!
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Attachments/Grips/erebus_railmount.rsi
    layers:
    - state: lam
    - state: lam_unshaded
      shader: unshaded
  - type: Item
    size: Small
    storedRotation: -90
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 1.2
    recoilIncreaseModifier: 1.1
    minSpreadModifier: 0.7
    maxSpreadModifier: 1.0
  - type: ESGunWieldRecoilAttachment
    wieldRecoilRecoveryModifier: 0.83 # rounded from the inverse
    wieldRecoilIncreaseModifier: 0.9 # rounded from the inverse
    wieldMinSpreadModifier: 20
    wieldMaxSpreadModifier: 1
  - type: ESGunComponentAttachment
    component:
    - type: LaserPointer
      targetedColor: "#FF0040"
      defaultColor: "#FF0040"
  - type: Tag
    tags:
    - MonoGrip
    - MonoGripErebusRailmount
    - MonoGripLAM

- type: entity
  parent: BaseGunAttachmentGrip
  id: GunAttachmentGripPistolLAM
  name: Soyuz PGL laser-aiming module (handgun mount)
  description: A visual-spectrum green laser for aiming. Looks awesome, and helps a lot with first shot accuracy!
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Attachments/Grips/pistol_mount.rsi
    layers:
    - state: lam
    - state: lam_unshaded
      shader: unshaded
  - type: Item
    size: Small
    storedRotation: -90
  - type: ESGunRecoilAttachment # Near same values for both of these because most pistols can't be wielded.
    recoilRecoveryModifier: 1.2
    recoilIncreaseModifier: 1.1
    minSpreadModifier: 0.05
    maxSpreadModifier: 1
  - type: ESGunWieldRecoilAttachment
    wieldRecoilRecoveryModifier: 0.83 # rounded from the inverse
    wieldRecoilIncreaseModifier: 0.9 # rounded from the inverse
    wieldMinSpreadModifier: 20
    wieldMaxSpreadModifier: 1
  - type: ESGunComponentAttachment
    component:
    - type: LaserPointer
      targetedColor: "#00FF22"
      defaultColor: "#00FF22"
  - type: Tag
    tags:
    - MonoGrip
    - MonoGripPistolMount
    - MonoGripLAM

- type: entity
  parent: BaseGunAttachmentGrip
  id: GunAttachmentGripErebusLight
  name: LM-300 weapon light (Erebus-HI railmount)
  description: It's a flashlight for your gun.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Attachments/Grips/erebus_railmount.rsi
    layers:
    - state: light
  - type: Item
    size: Small
    storedRotation: -90
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 1.0
    recoilIncreaseModifier: 1.0
    minSpreadModifier: 1.0
    maxSpreadModifier: 1.0
  - type: ESGunWieldRecoilAttachment
    wieldRecoilRecoveryModifier: 1.0
    wieldRecoilIncreaseModifier: 1.0
    wieldMinSpreadModifier: 1.0
    wieldMaxSpreadModifier: 1.0
  - type: ESGunComponentAttachment
    component:
    - type: ItemTogglePointLight
    - type: PointLight
      enabled: false
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      radius: 7
      netsync: true
    - type: ItemToggle # No sfx because its annoying (it triggers it when u wield)
      predictable: true
      onUse: false
      onAltUse: false
  - type: Tag
    tags:
    - MonoGrip
    - MonoGripErebusRailmount
    - MonoGripLight

- type: entity
  parent: BaseGunAttachmentGrip
  id: GunAttachmentQLG20
  name: TCA QLG-20 under-barrel grenade launcher (TSF UBGL mount)
  description: A UBGL designed to be mounted to TSF longarms to provide a lightweight option for fire-support and utility.
  suffix: Grip, TSF mount
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Attachments/Grips/erebus_railmount.rsi
    state: ubgl_qlg
  - type: ESGunTemporaryItemSlotAttachment
    slotName: launcher_mag
    itemSlot:
      name: UBGL Chamber
      priority: 3
      insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m203_insertgrenade.ogg
      ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m203_openbarrel.ogg
      whitelist:
        tags:
        - Grenade
        - LessLethalGrenade
  - type: ESGunComponentAttachment
    component:
    - type: AlternateGun
      slot: attachment_grip
      switchSound:
        path: /Audio/_FinalHorizon/Weapons/Guns/Deploy/m203_select.ogg
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 0.4
    recoilIncreaseModifier: 1.05
    minSpreadModifier: 1.05
    maxSpreadModifier: 1.1
  - type: ESGunWieldRecoilAttachment
    wieldRecoilRecoveryModifier: 0.95
    wieldRecoilIncreaseModifier: 1.05
    wieldMinSpreadModifier: 0.95
    wieldMaxSpreadModifier: 0.9
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/m203.ogg
  - type: AlternateGunAmmoProvider
  - type: Tag
    tags:
    - MonoGrip
    - MonoGrip40mmUBGL
    - MonoGrip40mmUBGLTSF

