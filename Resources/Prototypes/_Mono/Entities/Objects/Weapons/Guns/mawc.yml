- type: entity
  id: MAWCSiriusBeam
  parent: BasicHitscan
  categories: [HideSpawnMenu]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 8
        Structural: 45
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_omni
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_omni
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_omni
  - type: HitscanBasicRaycast
    maxDistance: 7
  - type: HitscanGathering

- type: entity
  id: BulletMAWCStonehenge
  name: anti-material charge
  parent: PiercingBallisticHitscan
  categories: [HideSpawnMenu]
  components:
  - type: Tracer
    color: "#ffc759"
    length: 3
  - type: HitscanBasicDamage
    damage:
      types:
        Piercing: 60
        Heat: 20
        Structural: 500
    armorPenetration: 0.9
  - type: HitscanStaminaDamage
    staminaDamage: 250
  - type: HitscanMultiRaycast
    maxPierce: 10 # This is going to be so fucking funny
    maxDistance: 200
    collisionMask:
    - Impassable
    - Opaque
    - HighImpassable

