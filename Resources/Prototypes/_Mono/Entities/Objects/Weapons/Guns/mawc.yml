  - type: Sprite
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius.rsi
    state: base
  - type: Item
    size: Ginormous
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius_inhands.rsi
  - type: Clothing
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius_inhands.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable

