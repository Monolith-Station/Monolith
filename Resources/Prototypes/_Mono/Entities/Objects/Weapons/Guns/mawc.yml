  id: WeaponMAWCSirius
  name: M-WC Type-55 "Sirius" reclaiming laser
  description: A privatized version of the popular civilian industrial mining laser, this special tool is specially attuned for turning walls into usable refined scrap that can be used in specialized machines. Quite heavy and unwieldy, but it makes for a decent emergency weapon in a pinch.
