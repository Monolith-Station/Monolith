- type: entity
  name: VFD PSW "Ratel" (7.62x51mm)
  parent: BaseWeaponLightMachineGun
  id: WeaponLMGRatel
  description: The precision support weapon chambered in 7.62x51mm and fits simple ammo box and all kind of magazines. Based on the Vulcan and made with higher quality materials, A label on the side that seems to have been tampered with reads "FOR MILI-CENARY USE ONLY". An Erebus railmount is present on the reciever for optics.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/LMGs/ratel/Ratel-icon.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
      - map: ["opticAttachment"]
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/LMGs/ratel/Ratel-inhands.rsi
    shape:
    - 0,0,5,2
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/LMGs/ratel/Ratel-inhands.rsi
  - type: GunWieldBonus
    minAngle: -25
    maxAngle: -35
  - type: Gun
    minAngle: 25
    maxAngle: 40
    angleIncrease: 7
    angleDecay: 28
    fireRate: 6 # 360 rpm
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/heavy_rifle_1.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: AmmoBox762x51mmFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/lmg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/lmg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine762x51mmBoxSmall
          - Magazine762x51mmFMJ
          - Magazine762x51mmLowCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x51mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge762x51mmFMJ
      attachment_optic:
        startingItem: GunAttachmentOpticErebus8x
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - MonoOpticErebusRailmount
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      attachment_optic: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 2500
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.5 # lower firerate than grizzly but more accurate and bit more damage
  - type: WieldDelay
    baseDelay: 0.8
    modifiedDelay: 0.8
    preventFiring: true
  # Attachment slop
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-optic
      containerId: attachment_optic
      whitelist:
        tags:
        - MonoOpticErebusRailmount
  - type: ActivatableUI
    key: enum.ESAttachableGunUiKey.Key
    verbOnly: true
    verbText: es-gun-attachments-verb-text
  - type: UserInterface
    interfaces:
      enum.ESAttachableGunUiKey.Key:
        type: ESGunAttachmentBui
  - type: ESItemMapper
    mappings:
      opticAttachment:
      - containerId: attachment_optic
        state: optic2x
        whitelist:
          tags:
          - MonoOptic2x
      - containerId: attachment_optic
        state: optic4x
        whitelist:
          tags:
          - MonoOptic4x
      - containerId: attachment_optic
        state: optic8x
        whitelist:
          tags:
          - MonoOptic8x

- type: entity
  name: Cyborg minigun
  id: CyborgWeaponMinigun
  parent: BaseWeaponHeavyMachineGun
  description: Old highly-inaccurate rotary mini-gun chambered in a small caliber.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
    layers:
    - state: icon
  - type: Item
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
  - type: Gun
    minAngle: 4
    maxAngle: 25
    angleIncrease: 3
    angleDecay: 20
    fireRate: 16
    projectileSpeed: 45
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/minigun.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: CartridgeMinigun
    fireCost: 20
  - type: Battery
    maxCharge: 4000
    startingCharge: 4000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 40
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

#USSP Minigun

- type: entity
  name: "GSh-7.62 rotary machine gun"
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponMinigunUSSP
  description: "An enormous multi-barreled rotating gatling gun. A gas-operated rotary machine gun whose enormous volume of fire and ammunition capacity allows the suppression of large concentrations of enemy forces. Loads from a backpack fed ammo drum."
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Minigun/minigun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    sprite: _Mono/Objects/Weapons/Guns/Minigun/minigun_inhands_32x.rsi
    shape:
    - 0,0,4,3
  - type: Wieldable
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 2
    modifiedDelay: 2
    preventFiring: true
  - type: Gun
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 18
    maxAngle: 45
    angleIncrease: 5
    angleDecay: 18
    projectileSpeed: 55
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: GunWieldBonus
    minAngle: -15
    maxAngle: -30
  - type: GunSpreadModifier
    spread: 2
  - type: AmmoCounter
  - type: StaticPrice
    price: 5000
  - type: ItemTax
    taxAccounts:
      nfsd: 0.2
  - type: Appearance
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Minigun/minigun_inhands_32x.rsi
    slots:
    - Back
    - suitStorage
  - type: ClothingSlotAmmoProvider
    targetSlot: BACK
    providerWhitelist:
      tags:
      - MinigunUSSPBackpack
  - type: Tag
    tags:
    - WeaponMinigunUSSP
  - type: SpeedModifiedOnWield
    walkModifier: 0.5
    sprintModifier: 0.4
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
