- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWeaponMAWC
  components:
  - type: BasicEntityAmmoProvider # define the actual bullet in your prototype.
    capacity: 20
    count: 20
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Blunt: 10
    angle: 0
    wideAnimationRotation: 135
    animation: WeaponArcThrust
    soundHit:
      collection: MetalThud
  - type: AltFireMelee
    attackType: Light
