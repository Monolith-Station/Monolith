- type: entity
  id: WeaponHeavyMiningLaser
  parent: [ BaseWeaponBattery ]
  name: industrial heavy mining laser
  description: A giant heavy handheld laser. Capable of excavating metric tons of rock, and self-recharging after a long delay. # Has a high-power short-range mode for shipbreaking work as a pseudo plasma cutter, and a low-power long-range mode for normal mining.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Battery/hml.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Battery/hml_inhands_32x.rsi
    size: Ginormous
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Battery/hml_inhands_32x.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    fireRate: 8
    minAngle: 0
    maxAngle: 2
    recoil: 0
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/e-fire.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Battery
    maxCharge: 4000
    startingCharge: 4000
  - type: BatterySelfRecharger
    autoRechargePause: true
    autoRechargePauseTime: 60
    autoRecharge: true
    autoRechargeRate: 200
  - type: HitscanBatteryAmmoProvider
    proto: HMLLaser
    fireCost: 50
  # Commented out since firemodes aren't existent yet for hitscans.
  #- type: BatteryWeaponFireModes
  #  fireModes:
  #  - proto: HMLLaser
  #    fireCost: 50
  #  - proto: HMLLaserSalvage
  #    fireCost: 200
  - type: HeldSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: MultiHandedItem
  - type: StaticPrice
    price: 1500
    vendPrice: 20000

# I didn't feel like making a new file. Really sorry.

- type: entity
  parent: BasicHitscan
  id: HMLLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_omni
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_omni
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_omni
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 8
        Structural: 15
  - type: HitscanBasicRaycast
    maxDistance: 8
  - type: HitscanGathering

# For when hitscan firemodes are finished. I could've done it now, but naz said they're working on it already.

