
- type: entity
  name: QBZ-Z9 Tactical Energy Gun
  parent: [BaseWeaponBatterySmall]
  id: WeaponEnergyGunTSFMCEnergyGun
  description: Exceptional peace require exceptional firepower. The Z9 tactical energy gun features a shock and lethal mode intended for usage in policing, crowd control and everyday servicemen needs. The cell is swappable for convenience and ease of ammo procurment. And with this weapon, peace is an option.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Battery/tac_e_gun.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
    - state: mode
      shader: unshaded
      map: [ "Firemode" ]
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
    - belt
    sprite: _Mono/Objects/Weapons/Guns/Battery/tac_e_gun.rsi

  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -25
  - type: Gun
    minAngle: 21
    maxAngle: 34
    fireRate: 3
    burstCooldown: 0.65
    burstFireRate: 12
    shotsPerBurst: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    - Burst
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 5250
    startingCharge: 5250
  - type: HitscanBatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 75
  - type: HitscanBatteryAmmoProvider
    fireModes:
    - proto: BulletDisabler
      fireCost: 75
      name: disable
    - proto: RifleTacLethal
      fireCost: 150
      name: lethal
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: Tag
    tags:
    - HighRiskItem
  - type: StaticPrice
    price: 2500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 200
    autoRechargePause: true
    autoRechargePauseTime: 30
  - type: PirateBountyItem
    id: ExperimentalFactionWeapon

