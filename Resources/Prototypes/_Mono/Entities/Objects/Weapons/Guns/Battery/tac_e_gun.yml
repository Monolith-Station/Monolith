
- type: entity
  name: QBZ-Z9 Tactical Energy Gun
  parent: [BaseWeaponBatterySmall]
  id: WeaponEnergyGunTSFMCEnergyGun
  description: Exceptional peace require exceptional firepower. The Z9 tactical energy gun features a shock and lethal mode intended for usage in policing, crowd control and everyday servicemen needs, fitted with a laser pointer for additional accuracy when properly wielded. And with this weapon, peace is an option.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Battery/tac_e_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mode-lethal
      shader: unshaded
      map: [ "Firemode" ]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
    - Back
    sprite: _Mono/Objects/Weapons/Guns/Battery/tac_e_gun_inhands_32x.rsi

  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: Gun
    minAngle: 21
    maxAngle: 34
    fireRate: 4
    burstCooldown: 0.65
    burstFireRate: 13
    shotsPerBurst: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    - Burst
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 5250
    startingCharge: 5250
  - type: HitscanBatteryAmmoProvider
    proto: RifleTacLethal
    fireCost: 150
  - type: EnergyGun
    fireModes:
    - proto: RifleTacShock
      fireCost: 75
      name: Shock
    - proto: RifleTacLethal
      fireCost: 150
      name: Lethal
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EnergyGunFireModeVisuals.State:
        Firemode:
          Shock: { state: mode-shock }
          Lethal: { state: mode-lethal }
  - type: Appearance
  - type: Tag
    tags:
    - HighRiskItem
  - type: StaticPrice
    price: 2500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 250
    autoRechargePause: true
    autoRechargePauseTime: 30
  - type: PirateBountyItem
    id: ExperimentalFactionWeapon
  - type: LaserPointer
    targetedColor: "#03c2fc"
    defaultColor: "#03c2fc"
