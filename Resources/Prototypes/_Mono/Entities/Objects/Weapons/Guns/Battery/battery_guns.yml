- type: entity
  name: energy shotgun "Dignity"
  parent: BaseWeaponBattery
  id: WeaponEnergyShotgunOverseer
  description: A weapon that has been the last thing seen by many pirates, "Dignity" is a 1-handed energy shotgun often used by pirate hunting overseers.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
    state: icon
  - type: Appearance
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
    slots:
    - Back
    - SuitStorage
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletLaserSpreadMono
    fireCost: 150
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletLaserSpreadMono
      fireCost: 120
    - proto: BulletLaserSlug
      fireCost: 200
  - type: Item
    size: Large
    shape:
    - 0,0,3,0
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 24
  - type: GunSpreadModifier
    spread: 0.8

- type: entity # Weapon based off ID: laser_pistol and then given buffed stats, uses AntiqueLaser for stats currently
  id: WeaponLaserPistolVICT
  parent: WeaponLaserGun
  name: type-b laser pistol
  suffix: CBURN/VICT
  description: An improved version of the type-a laser pistol, built on the chassis of an older Juliette type laser pistol, kills Chimera quickly!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/antiquelasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/antiquelasergun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: HitscanBatteryAmmoProvider
    proto: RedMediumLaserVICTAlt
    fireCost: 50
  - type: BatterySelfRecharger
    autoRecharge: false
    autoRechargeRate: 40
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: StaticPrice # Mono
    price: 150

- type: entity # Weapon based off ID: laser_pistol and then given buffed stats, uses AntiqueLaser for stats currently
  id: WeaponLaserPistolVICTAdv
  parent: WeaponLaserGun
  name: Advanced type-b laser pistol
  suffix: CBURN/VICT
  description: An advanced version of the type-b laser pistol, featuring a built in recharger to kill Chimera even faster@
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/antiquelasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/antiquelasergun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: HitscanBatteryAmmoProvider
    proto: RedMediumLaserVICTAdvAlt
    fireCost: 25
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: StaticPrice # Mono
    price: 150
