- type: entity
  name: energy shotgun "Dignity"
  parent: BaseWeaponBattery
  id: WeaponEnergyShotgunOverseer
  description: A weapon that has been the last thing seen by many pirates, "Dignity" is a 1-handed energy shotgun often used by pirate hunting overseers.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
    state: icon
  - type: Appearance
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
    slots:
    - Back
    - SuitStorage
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletLaserSpreadMono
    fireCost: 150
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletLaserSpreadMono
      fireCost: 120
    - proto: BulletLaserSlug
      fireCost: 200
  - type: Item
    size: Large
    shape:
    - 0,0,3,0
    sprite: _Mono/Objects/Weapons/Guns/Battery/dignity_shotgun.rsi
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 24
  - type: GunSpreadModifier
    spread: 0.8

- type: entity # Weapon based off ID: laser_pistol and then given buffed stats, uses AntiqueLaser for stats currently
  id: WeaponLaserPistolVICT
  parent: BaseWeaponBatterySmall
  name: type-b laser pistol
  suffix: CBURN/VICT
  description: An improved version of the type-a laser pistol, built on the chassis of an older Juliette type laser pistol, kills Chimera quickly!
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Battery/multiphase_energygun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mode-disabler
      shader: unshaded
      map: [ "Firemode" ]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    quickEquip: false # Frontier
    slots: # Frontier
    - Back # Frontier
    - suitStorage # Frontier
    sprite: _DV/Objects/Weapons/Guns/Battery/multiphase_energygun.rsi
  - type: Gun
    fireRate: 2.5
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 1000 # Mono 2000->3750
    startingCharge: 1000 # Mono 2000->3750
  - type: ProjectileBatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 25
  - type: EnergyGun
    fireModes:
    - proto: BulletDisabler
      fireCost: 25
      name: disable
      state: disabler
    - proto: RedMediumLaserVICTAlt
      fireCost: 50
      name: lethal
      state: lethal
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EnergyGunFireModeVisuals.State:
        Firemode:
          Disabler: { state: mode-disabler }
          Lethal: { state: mode-lethal }
          Special: { state: mode-ion }
  - type: Tag
    tags:
    - HighRiskItem
    - Sidearm
  - type: StaticPrice # Mono
    price: 15000

- type: entity # Weapon based off ID: laser_pistol and then given buffed stats, uses AntiqueLaser for stats currently
  id: WeaponLaserPistolVICTAdv
  parent: BaseWeaponBatterySmall
