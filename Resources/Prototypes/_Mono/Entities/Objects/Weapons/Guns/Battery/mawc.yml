- type: entity
  parent: [BaseWeaponBattery, BaseGunWieldable]
  id: WeaponMAWCSirius
  name: M-WC Type-55 "Sirius" reclaiming laser
  description: A privatized version of the popular civilian industrial mining laser, this special tool is specially attuned for turning walls into usable refined scrap that can be used in specialized machines. Quite heavy and unwieldy, but it makes for a decent emergency weapon in a pinch.
  components:
  - type: Sprite
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: charge-5
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    size: Ginormous
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius_inhands.rsi
  - type: Clothing
    sprite: _Mono/MAWC/Objects/Weapons/Guns/sirius_inhands.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 3
    minAngle: 12
    maxAngle: 22
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/e-fire.ogg
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -18
  - type: HitscanBatteryAmmoProvider
    proto: MAWCSiriusBeam
    fireCost: 100
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 100
    autoRechargePause: true
    autoRechargePauseTime: 10
  - type: MagazineVisuals
    magState: charge
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.7
