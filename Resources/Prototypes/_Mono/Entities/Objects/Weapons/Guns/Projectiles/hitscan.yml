- type: entity
  id: BasicBallisticHitscan
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 200
    collisionMask:
    - Impassable
    - Opaque
    - HighImpassable
  - type: HitscanReflect
    reflectiveType: None

- type: entity
  id: PiercingBallisticHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanMultiRaycast
    maxPierce: 1
    maxDistance: 200
    collisionMask:
    - Impassable
    - Opaque
    - HighImpassable
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_muzzle
    travelFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_trail
    impactFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_impact
  - type: HitscanReflect
    reflectiveType: None
  - type: HitscanBasicEffects


- type: entity
  id: PulsedPlasma
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 95
        Blunt: 5
        Shock: 10
        Radiation: 65
        Structural: 700
  - type: HitscanBasicRaycast
    maxDistance: 120.0
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: muzzle_beam_light_pulse
    travelFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: beam_light_pulse
    impactFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: impact_beam_light_pulse

