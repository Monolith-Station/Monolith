- type: entity
  id: BasicBallisticHitscan
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 200
    collisionMask:
    - Impassable
    - Opaque
    - HighImpassable
  - type: HitscanReflect
    reflectiveType: None

- type: entity
  id: PiercingBallisticHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanMultiRaycast
    maxPierce: 1
    maxDistance: 200
    collisionMask:
    - Impassable
    - Opaque
    - HighImpassable
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_muzzle
    travelFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_trail
    impactFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: ballistic_impact
  - type: HitscanReflect
    reflectiveType: None
  - type: HitscanBasicEffects


- type: entity
