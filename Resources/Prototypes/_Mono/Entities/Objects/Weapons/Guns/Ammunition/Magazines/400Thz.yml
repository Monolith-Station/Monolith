
- type: entity
  id: BaseMagazine400Thz
  name: DEW magazine (400Thz DEW)
  parent: [BaseItem, RecyclableItemSteelTiny]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine400Thz
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge400Thz
    capacity: 20
  - type: Item
    size: Small
    storedRotation: 45
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/400Thz/400Thzmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine400ThzEmpty
  name: DEW magazine (400Thz any)
  suffix: empty
  parent: BaseMagazine400Thz
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: Magazine400Thz
  name: DEW magazine (400Thz DEW)
  parent: BaseMagazine400Thz
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge400Thz
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]


