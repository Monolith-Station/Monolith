- type: entity
  id: BaseCartridge357_magnum
  name: cartridge (.357 magnum)
  parent: BaseCartridge
  description: Heavy magnum round, usually only seen in magnums or manually-cycled rifles.
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - Cartridge357_magnumFMJ
  - type: CartridgeAmmo
    proto: Bullet357_magnumFMJ
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/pistol_ammo_casing_steel.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

