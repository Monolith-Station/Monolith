  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: EmpOnTrigger
    range: 5
    energyConsumption: 2700000
    disableDuration: 10

- type: entity
  id: Bullet35mmGrenadeHEDP
  name: HEDP grenade
