- type: entity
  id: Bullet35mmGrenadeBaton
  name: baton grenade
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Blunt: 30
    soundHit:
      path: /Audio/Effects/gen_hit.ogg
  - type: StaminaDamageOnCollide
    damage: 200

- type: entity
  id: Bullet35mmGrenadeEMP
  name: EMP grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
