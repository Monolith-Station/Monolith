- type: entity
  name: U.I Smart Pistol MK5 (.55 SAM)
  parent: [BaseWeaponPistol]
  id: WeaponPistolUllmanSmartMagnumMK5
  description: A prototype smart pistol developed by Ullman Industries that uses .55 Smart Action Magnum, designed for precision and adaptability in combat situations. It features advanced targeting systems and a sleek design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5_inhands_32x.rsi
  - type: Gun
    fireRate: 3.5
    selectedMode: SemiAuto
    availableModes:
    - Burst
    - SemiAuto
    burstCooldown: 0.8
    burstFireRate: 10
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine55_SAMPistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine55_SAMPistol
            - Magazine55_SAMPistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge55_SAM
        priority: 1
        whitelist:
          tags:
            - Cartridge55_SAM
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 350
  - type: SmartGun
    requiresWield: false
  - type: LaserPointer
    targetedColor: "#FF5C00"
    defaultColor: "#008080"
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/smartgun_mouse.rsi
      state: all

- type: entity
  name: MMC VMK "Kuosame" (5.7x28mm)
  parent: BaseWeaponPistol
  id: WeaponPistolKuosame
  description: A basic and simple handgun for MMC employees. Only issued in high-risk zones.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
  - type: Gun
    fireRate: 6
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/viper_fire.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine57x28mmPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine57x28mmPistolFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge57x28mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge57x28mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 200


- type: entity
  name: UGR Damocles (9x19mm)
  parent: BaseWeaponPistol
  id: WeaponPistolDamocles
  description: The Damocles holds a fearsome level of firepower, giving its holder an unwritten position as the ringleader of the underworld of the Perseus Arm. However, its reliance on the officially discontinued machine pistol magazine makes it unsustainable in prolonged firefights. Looking at it now, you can't tell if the blood is real or simply painted on in order to look more intimidating. 
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/damocles.rsi
    layers: # Mono
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmPistolHighCapacityFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
      # Mono
      attachment_grip:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - MonoGripPistolMount
      # Mono
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun # Mono change - Sound for viper
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/viper_fire.ogg
    fireRate: 7
    damageModifier: 1.4
