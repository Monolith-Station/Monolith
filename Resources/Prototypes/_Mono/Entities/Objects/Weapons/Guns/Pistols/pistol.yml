- type: entity
  name: U.I Smart Pistol MK5 (.55 SAM)
  parent: [BaseWeaponPistol, BaseGunWieldable]
  id: WeaponPistolUllmanSmartMagnumMK5
  description: A prototype smart pistol developed by Ullman Industries that uses .55 Smart Action Magnum, designed for precision and adaptability in combat situations. It features advanced targeting systems and a sleek design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/UllmanSmartMagnumMK5_inhands_32x.rsi
  - type: Gun
    fireRate: 3.5
    selectedMode: SemiAuto
    availableModes:
    - Burst
    - SemiAuto
    burstCooldown: 0.8
    burstFireRate: 10
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine55_SAMPistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine55_SAMPistol
            - Magazine55_SAMPistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge55_SAM
        priority: 1
        whitelist:
          tags:
            - Cartridge55_SAM
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 350
  - type: SmartGun
    requiresWield: true
  - type: LaserPointer
    targetedColor: "#FF5C00"
    defaultColor: "#008080"
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/smartgun_mouse.rsi
      state: all

# Militia Ironworks
- type: entity
  name: MI Jetfire 950 (4.6x30mm)
  parent: BaseWeaponShotgun # Uses shotgun because reload not using catridges rather than putting it one by one
  id: WeaponPistolMIJetfire950
  description: A revived ultra-compact pocket pistol design from a renowned Terran Italian manufacturer, returned to production by Militia Ironworks. Intended as a last-ditch defensive weapon, easily concealed in a vest, boot, or belt, or issued to covert operatives. Holds 10 rounds of 4.6mm, with a modified feed allowing single-round loading through the ejection port to reduce reliance on spare magazines.
  components:
  - type: Sprite
    scale: 0.75 , 0.75
    sprite: _Mono/Objects/Weapons/Guns/Pistols/mi_jetfire_950.rsi
  - type: Item
    size: Small
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/mk_fire.ogg
  - type: StaticPrice
    price: 350
    vendPrice: 5000
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Cartridge46x30mmFMJ
    capacity: 10
    proto: Cartridge46x30mmFMJ

- type: entity
  name: MI Jetfire 950 MM (9x19mm)
  parent: BaseWeaponPistol
  id: WeaponPistolMIJetfire950MM
  description: A compact pocket pistol upgraded with bluespace compression technology, allowing it to accept full-size 9mm magazines despite its small frame. Retains its role as a discreet last-ditch or covert sidearm, now with greatly improved ammunition capacity and availability.
  components:
  - type: Sprite
    scale: 0.75 , 0.75
    sprite: _Mono/Objects/Weapons/Guns/Pistols/mi_jetfire_950_mm.rsi
  - type: Item
    size: Small
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/mk_fire.ogg
  - type: StaticPrice
    price: 750
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmPistolFMJ
            - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot