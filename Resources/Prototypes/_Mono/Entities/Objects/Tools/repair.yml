- type: entity
  name: ship repair device
  parent: BaseItem
  id: MonoShipyardRCDBase
  description: A repair device that can restore destroyed sections of ships.
  abstract: true
  components:
  - type: ShipRepairTool
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Mono/Objects/Tools/repair_device_item.rsi
    state: item
  - type: Item
    sprite: _Mono/Objects/Tools/repair_device.rsi
    size: Normal
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: PhysicalComposition
    materialComposition:
      Steel: 800
      Plastic: 400
      Plasma: 200
      Gold: 200
  - type: StaticPrice
    price: 10000
    vendPrice: 15000
  - type: Tag
    tags:
    - ShipRepairTool

- type: entity
  id: MonoShipyardRCD
  description: A repair device that can restore destroyed sections of ships. Holds 300 charges.
  parent: MonoShipyardRCDBase
  components:
  - type: LimitedCharges
    maxCharges: 300
    charges: 100

- type: entity
  id: MonoShipyardRCDEmpty
  parent: MonoShipyardRCD
  suffix: Empty
  components:
  - type: LimitedCharges
    charges: 0

- type: entity
  id: MonoShipyardRCDRecharging
  description: A repair device that can restore destroyed sections of ships. Holds 300 charges and slowly recharges.
  parent: MonoShipyardRCDBase
  suffix: Recharging
  components:
  - type: LimitedCharges
    maxCharges: 300
    charges: 50
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  id: MonoShipyardRCDAdmin
  parent: MonoShipyardRCDBase
  suffix: Admin
  components:
  - type: ShipRepairTool
    repairTimeMultiplier: 0

- type: entity
  name: ship repair matter
  parent: BaseItem
  id: MonoShipyardRCDAmmo
  description: Ammo cartridge for a ship repair device.
  components:
  - type: LimitedChargesAmmo
    charges: 100
    whitelist:
      tags:
      - ShipRepairTool
  - type: Sprite
    sprite: _NF/Objects/Tools/rcd.rsi
    state: ammo-shipyard
  - type: Item
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 2000
    vendPrice: 8000
