        stalkybush_1: ""
        stalkybush_2: ""
        stalkybush_3: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/plant_rustle.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodPilumaStalk:
            min: 1
            max: 3

# Different tree variant. Because I don't want logs.
- type: entity
  id: BaseTreeCrocus
  name: crocus tree
  description: Yep, it's a tree.
  abstract: true
  components:
  - type: SpriteFade
  - type: RangedDamageSound # WOLFGATE - material bullet impacts
    soundGroups:
      Brute:
        collection: WolfgateBulletImpactWood
  - type: Flammable
    fireSpread: true
    firestackFade: 0.5
    alwaysCombustible: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Generic_mob_burning
  - type: Animateable
  - type: Appearance
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _Mono/Objects/Flora/flora_trees_crocus.rsi
    drawdepth: Overdoors
    offset: 0,0.9
  - type: BarricadeBlock
    bidirectional: true
    omnidirectional: true
    passthroughdistance: 0.4
    blocking: 40
  - type: ExtendDescription
    descriptionList:
    - description: You can fire over this if you stand near it.
      color: "#4f94ad"
      requireDetailRange: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.4,0.35,0.4"
        density: 1000
        layer:
        - WallLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 2
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          CrocusStump:
            min: 1
            max: 1
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          CrocusStrippedTree:
            min: 1
            max: 1

