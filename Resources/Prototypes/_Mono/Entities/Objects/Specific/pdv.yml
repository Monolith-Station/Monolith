# 1 old DC = 5 DC, renamed to Data Chits.

- type: entity
  name: data chit
  parent: BaseItem
  id: DataChit
  suffix: 100 DC
  description: A rugged, shielded disk containing encrypted intelligence.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Rogue/rogue_chits.rsi
    state: chits
  - type: Item
    sprite: _Mono/Objects/Specific/Rogue/rogue_chits.rsi
    size: Tiny
  - type: Stack
    count: 100
    stackType: DataChit
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 40
  - type: Currency
    price:
      DataChit: 1

- type: entity
  parent: DataChit
  id: DataChit1
  suffix: 1 DC
  components:
  - type: Stack
    count: 1

- type: entity
  parent: DataChit
  id: DataChit5
  suffix: 5 DC
  components:
  - type: Stack
    count: 5

- type: entity
  parent: DataChit
  id: DataChit25
  suffix: 25 DC
  components:
  - type: Stack
    count: 25

- type: entity
  parent: DataChit
  id: DataChit50
  suffix: 50 DC
  components:
  - type: Stack
    count: 50

# Uplinks
- type: entity
  parent: [ BaseItem, StorePresetPDVUplink ]
  id: BasePDVUplink
  name: PDV Uplink
  description: A scarred tablet encased in heat-resistant composite with slot for chits on the side.
  suffix: Empty
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Objects/Devices/rogue_uplink.rsi
    layers:
    - state: icon
      scale: 0.7, 0.7
    - state: icon-overlay
      scale: 0.7, 0.7
      shader: unshaded
  - type: Item
    sprite: _Mono/Objects/Devices/rogue_uplink.rsi
    heldPrefix: icon
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Tag
    tags:
    - PDVUplink

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkDebug
  suffix: Pirate, DEBUG
  components:
  - type: Store
    balance:
      DataChit: 99999

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkVizier
  suffix: Commander 125
  components:
  - type: Store
    balance:
      DataChit: 125

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkRahkshan
  suffix: Agent 75
  components:
  - type: Store
    balance:
      DataChit: 75

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkAsvaran
  suffix: Asvaran 100
  components:
  - type: Store
    balance:
      DataChit: 100
