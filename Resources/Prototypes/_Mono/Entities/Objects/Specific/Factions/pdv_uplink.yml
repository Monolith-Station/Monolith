# 1 old DC = 5 DC, renamed to Data Chits.

- type: entity
  name: data chit
  parent: BaseItem
  id: Doubloon #yes they are not doubloons but i found it very funny so it's staying that way, rare frontier codebase W
  suffix: 100 DC
  description: A rugged, shielded disk containing encrypted intelligence. It can serve as a measure of how effective your service of the Dynasty is, and can be exchanged for equipment.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Rogue/rogue_chits.rsi
    state: chits
  - type: Item
    sprite: _Mono/Objects/Specific/Rogue/rogue_chits.rsi
    size: Tiny
  - type: Stack
    count: 100
    stackType: Doubloon
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 40
  - type: Currency
    price:
      Doubloon: 1

- type: entity
  parent: Doubloon
  id: Doubloon1
  suffix: 1 DC
  components:
  - type: Stack
    count: 1

- type: entity
  parent: Doubloon
  id: Doubloon5
  suffix: 5 DC
  components:
  - type: Stack
    count: 5

- type: entity
  parent: Doubloon
  id: Doubloon25
  suffix: 25 DC
  components:
  - type: Stack
    count: 25

- type: entity
  parent: Doubloon
  id: Doubloon50
  suffix: 50 DC
  components:
  - type: Stack
    count: 50

# Uplinks
- type: entity
  parent: [ BaseItem, StorePresetPDVUplink ]
  id: BasePDVUplink
  name: PDV Uplink
  description: A scarred tablet encased in heat-resistant composite with slot for chits on the side.
  suffix: Empty
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Objects/Devices/rogue_uplink.rsi
    layers:
    - state: icon
      scale: 0.7, 0.7
    - state: icon-overlay
      scale: 0.7, 0.7
      shader: unshaded
  - type: Item
    sprite: _Mono/Objects/Devices/rogue_uplink.rsi
    heldPrefix: icon
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Tag
    tags:
    - PDVUplink

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkRadioDebug
  suffix: Pirate, DEBUG
  components:
  - type: Store
    balance:
      Doubloon: 99999

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkRadioPDVGrandVizier
  suffix: Commander 125
  components:
  - type: Store
    balance:
      Doubloon: 125
  - type: Tag
    tags:
    - PDVUplink
    - FactionStaticUplinkPdv

- type: entity
  parent: BasePDVUplink
  id: BasePDVUplinkRahkshan
  suffix: Agent 75
  components:
  - type: Store
    balance:
