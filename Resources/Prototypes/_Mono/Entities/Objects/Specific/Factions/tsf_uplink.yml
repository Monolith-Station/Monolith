# FUCs->FMCs, value 5x normal frontier value

- type: entity
  name: Federation Military Credit # Mono - Renamed from FUCs
  parent: BaseItem
  id: FederationMilitaryCredit # Mono - Renamed from FUCs
  suffix: 100 FMC # Mono
  description: A token awarded to TSF personnel for turning in enemy equipment and valuable assets. It can be exchanged in a TSF uplink device for a variety of tools and equipment.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Security/frontieruplinkcoin.rsi
    state: frontieruplinkcoin
  - type: Item
    sprite: _NF/Objects/Specific/Security/frontieruplinkcoin.rsi
    size: Tiny
  - type: Stack
    count: 100 # Mono
    stackType: FederationMilitaryCredit
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 40 # Mono
  - type: Currency
    price:
      FederationMilitaryCredit: 1

- type: entity
  parent: FederationMilitaryCredit
  id: FederationMilitaryCredit1
  suffix: 1 FMC
  components:
  - type: Stack
    count: 1

- type: entity
  parent: FederationMilitaryCredit
  id: FederationMilitaryCredit5
  suffix: 5 FMC
  components:
  - type: Stack
    count: 5

- type: entity
  parent: FederationMilitaryCredit
  id: FederationMilitaryCredit25
  suffix: 25 FMC
  components:
  - type: Stack
    count: 25

- type: entity
  parent: FederationMilitaryCredit
  id: FederationMilitaryCredit50
  suffix: 50 FMC
  components:
  - type: Stack
    count: 50

# Uplinks
- type: entity
  parent: [ BaseItem, StorePresetTSFUplink ]
  id: BaseTSFUplinkRadio
  name: TSFMC uplink
  description: Retro looking old radio...
  suffix: Empty
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Tag
    tags:
    - TSFUplink

- type: entity
  parent: BaseTSFUplinkRadio
  id: BaseTSFUplinkRadioDebug
  suffix: TSF, DEBUG
  components:
  - type: Store
    balance:
      FederationMilitaryCredit: 99999

- type: entity
  parent: BaseTSFUplinkRadio
  id: BaseTSFUplinkRadioCommander
  suffix: Commander 125
  components:
  - type: Store
    balance:
      FederationMilitaryCredit: 125
  - type: Tag
    tags:
      - TSFUplink
      - FactionStaticUplinkTsf

- type: entity
  parent: BaseTSFUplinkRadio
  id: BaseTSFUplinkRadioOfficer
  suffix: Officer 100
  components:
  - type: Store
    balance:
      FederationMilitaryCredit: 100

- type: entity
  parent: BaseTSFUplinkRadio
  id: BaseTSFUplinkRadioTeamleader
  suffix: Teamleader 75
  components:
  - type: Store
    balance:
      FederationMilitaryCredit: 75

#Mono

- type: entity
  parent: BaseTSFUplinkRadio
  id: BaseTSFUplinkRadioMarine
  suffix: Marine 75
  components:
  - type: Store
    balance:
      FederationMilitaryCredit: 75

#Mono End
