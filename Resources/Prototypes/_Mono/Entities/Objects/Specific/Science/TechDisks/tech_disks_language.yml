# CIV TECH DISKS - #395933
# FRACTURE TECH DISKS - #d4d4d4

- type: entity
  parent: TechDiskBase
  id: TechDiskCivTranslationBasic
  name: civilian species translation technology disk
  description: A disk capable of adding species-specific translators to a server's recipes.
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#395933"
    - state: label
    - state: protect
    - state: civilian
  - type: TechnologyDisk
    recipes:
    - BasicGalaticCommonTranslatorImplanter
    - CanilunztTranslator # Vulps
    - BubblishTranslator # Slimes
    # - NekomimeticTranslator # Oni/Felinids # faction language now
    - DraconicTranslator # Lizards
    - RootSpeakTranslator # Dionae
    - MofficTranslator # Moths
    - ValyrianStandardTranslator # Harpies
    - ChittinTranslator # Chitinids and arachnids
    # - GaryTranslator # Trait language ## LOUD INCORRECT BUZZER
    # - NovaCygniTranslator # Trait language ## LOUD INCORRECT BUZZER
    - SiikMaasTranslator # No tajara here ## LOUD INCORRECT BUZZER
    #- MarishTranslator # No shadowkin here
    - NewKinPidginTranslator # Vox
    - AzazibaTranslator # Fuck your lore. It ain't ours.
    - HydraspeakTranslator # Mono start
    - ScratchTranslator
    - SqueakishTranslator
    - NovaCygniClassicalTranslator
    - FelyaicTranslator # Mono end

