- type: entity
  id: HydraspeakTranslator
  parent: [ TranslatorPoweredBase ]
  name: hydraspeak translator
  description: Translates speech between Hydraspeak and Andromeda Standard.
  components:
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Hydraspeak
    understood:
    - TauCetiBasic
    - Hydraspeak
    requires:
    - TauCetiBasic
    - Hydraspeak

