- type: entity
  parent: BaseItem
  id: PDVStampedGold
  name: dynasty stamped gold
  description: A heavy crate stacked full of lab synthesized superconductive gold stamped with the Dynasty's logo and an identifying code. As an unapproved form of legal tender, the Federation would love to confiscate this.
  suffix: 75 FMC
  components:
  - type: Sprite
    sprite: _Mono/Objects/TradeGoods/factiongoods.rsi #Anyone is 100% free to make better sprites for these.
    layers:
    - state: dynastygold
      map: ["base"]
  - type: Item
    size: Huge
  - type: Appearance
  - type: Contraband
    severity: FactionGear2
    turnInValues:
      FederationMilitaryCredit: 75
    allowedDepartments: [ Antag ]
  - type: StaticPrice
    price: 125000 #Slightly higher value than FMC turn-in
  - type: HeldSpeedModifier #This intentionally ignores just throwing the item. Payday gameplay.
    walkModifier: 0.7
    sprintModifier: 0.7


- type: entity
  parent: BaseItem
  id: TSFNaniteCanister
  name: federation nanite canister
  description: A reinforced silvered-glass cylinder specially made to contain inert recombinative programmable nanites used for micro-scale advanced manufacturing outside the sector. The Dynasty's factories would love to get their hands on this.
  suffix: 75 DC
  components:
  - type: Material
  - type: Sprite
    sprite: _Mono/Objects/TradeGoods/factiongoods.rsi #Feel free to make better sprites.
    layers:
    - state: nanitecanister
      map: ["base"]
  - type: Item
    size: Normal
  - type: Appearance
  - type: Contraband
    severity: FactionGear2
    turnInValues:
      Doubloon: 75
    allowedDepartments: [ Security ]
  - type: StaticPrice
    price: 150000 #Slightly higher value value than DC turn-in
