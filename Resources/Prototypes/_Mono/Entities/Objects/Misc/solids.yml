- type: entity
  name: fentanyl crystal
  parent: BaseItem
  id: FentanylSolidified
  description: 25u of Fentanyl solidified with Tricordrazine. Worth a lot.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/fentanyl.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 3000 # worth a lot but expensive to make # Andromeda: 10k > 3k
  - type: Food
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Fentanyl
          Quantity: 25
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PirateBountyItem
    id: FentanylCrystal
  - type: ItemTax # Mono
    taxAccounts:
      # Medical: -0.05 # Andromeda: não temos pop pra ter TSF todo turno, foder com a conta bancaria médica é foda
      nfsd: -0.05 # Andromeda: TSF pode se foder tho. caguei. -0.1 -> -0.05
      BlackMarket: 0.1 # Andromeda: mas PDV tava ganhando muito disso. 0.25 -> 0.1
  - type: ExtendDescription
    descriptionList:
    - description: Vender isso financiará a PDV. # Andromeda: cade a localização :wilted:
      color: "#4f94ad"
      requireDetailRange: true
  - type: SoldAlert
    threshold: 3
    channels:
    - Command
    - Security
