- type: entity
  name: fentanyl crystal
  parent: BaseItem
  id: FentanylSolidified
  description: 25u of Fentanyl solidified with Tricordrazine. Worth a lot.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/fentanyl.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 10000 # worth a lot but expensive to make
  - type: Food
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Fentanyl
          Quantity: 25
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PirateBountyItem
    id: FentanylCrystal
  - type: ItemTax # Mono
    taxAccounts:
      Medical: -0.05
      nfsd: -0.1
      BlackMarket: 0.25
  - type: CurrencyInjectionOnSell # Mono: smuggling directly funds the PDV
    company: PDV
    amount:
      Doubloon: 1
  - type: ExtendDescription
    descriptionList:
    - description: Selling this item will fund the PDV.
      color: "#4f94ad"
      requireDetailRange: true
