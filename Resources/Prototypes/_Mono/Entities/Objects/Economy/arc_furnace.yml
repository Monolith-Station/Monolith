# T1

- type: entity
  name: basic armor plate
  description: A simple, refined "armor" alloy plate useful for things that need structural stability. Can be layered to start creating a heavy armor plate.
  parent: ArmorPlateEconomy1Broken
  id: ArmorPlateEconomy1
  components:
  - type: Tag
    tags:
    - EconomyGood
    - ArmorPlateEconomy1
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor1"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ArmorPlateEconomy1Broken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 1000

- type: entity
  name: heavy armor plate (unfinished)
  description: A work-in-progress heap of metal, in the process of being refined into a strong protective plate. Needs screwing to start processing.
  categories: [ HideSpawnMenu ]
  id: ArmorPlateEconomy2UnfinishedSpawner
  components:
  - type: TimedDespawn
    lifetime: 0.1
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor2_unfinished"
  - type: SpawnOnDespawn
    count: 1
    prototype: ArmorPlateEconomy2Start

- type: entity
  name: broken basic armor plate
  description: Wreckage from a simple armor plate. Not very surprising.
  parent: BaseEconomyGoodTier1
  id: ArmorPlateEconomy1Broken
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor1_broken"
  - type: StaticPrice
    price: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Item
    size: Huge
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plasteel: 500
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.8
  - type: HeldSpeedModifier

# silicon

- type: entity
  name: silicon wafer
  description: A clean slice of pure monocrystalline silicon. Essential for advanced electronics!
  parent: BaseEconomyGoodTier1
  id: SiliconWaferEconomy
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "wafer"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SiliconWaferScrapEconomy:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    chemicalComposition:
      Silicon: 20

- type: entity
  name: silicon wafer (x8)
  description: A clean slice of pure monocrystalline silicon. Essential for advanced electronics!
  categories: [ HideSpawnMenu ]
  id: SiliconWaferEconomySliceSpawner8
  components:
  - type: TimedDespawn
    lifetime: 0.1
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "cuticon"
  - type: SpawnOnDespawn
    count: 7
    prototype: SiliconWaferEconomy

- type: entity
  name: silicon wafer scrap
  description: A broken, contaminated mess of silicon that used to be useful for computers. What a waste.
  parent: SiliconWaferEconomy
  id: SiliconWaferScrapEconomy
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "waferscrap"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 25

