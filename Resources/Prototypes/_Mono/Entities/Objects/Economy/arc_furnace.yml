- type: entity
  name: composite armor plate fragment
  description: A fragment from a ceramic/carbide armor plate. Useful for smaller-scale applications.
  parent: BaseEconomyGoodTier2
  id: ArmorPlateEconomy3Fragment
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Item
    size: Normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor3_fragment"
  - type: ClothingSpeedModifier
    sprintModifier: 0.95
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plasteel: 1000
      Silver: 500
    chemicalComposition:
      Carbon: 15
      Silicon: 15

# silicon

- type: entity
  name: silicon boule
  description: A hefty but fragile chunk of refined silicon, ready for slicing into processor-grade wafers. Don't touch it without gloves!
  parent: BaseEconomyGoodTier2
  id: SiliconBouleEconomy
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "boule"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SiliconWaferScrapEconomy:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: SiliconWaferEconomy
      amount: 4
  - type: PhysicalComposition
    chemicalComposition:
      Silicon: 100

- type: entity
  name: silicon boule scrap
  description: A broken, contaminated mess of silicon that used to be useful for computers. What a waste.
