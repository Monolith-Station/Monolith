# Preset component packages.
# This is so we have a way to use materials in lathes thats easy playerwise (stacking and silos), and easy devwise (not needing to make construction graphs for everything)
# productbrick.rsi has modular layers like techdisks but you should Only Use Them for making new ones

# electronics T1

- type: entity
  parent: MaterialBase
  id: MaterialIndustryElectronics
  name: electronic parts package
  description: A compressed crate of electronic parts such as capacitors, resistors, transistors, and even some processors. Categorized and organized for use in a lathe.
  suffix: 1
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/productbrick.rsi
    state: preset-electronics
  - type: Item
    size: Normal
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      MaterialIndustryElectronics: 5
  - type: GuideHelp
    guides:
    - Economy
    - EconomyRecipes
    - Introduction
    - ArcFurnace
    - PrecisionAssembler
  - type: Stack
    stackType: MaterialIndustryElectronics
    count: 1

- type: stack
  id: MaterialIndustryElectronics
  name: electronic parts package
  icon: { sprite: /Textures/_Mono/Objects/Materials/productbrick.rsi, state: preset-electronics }
  spawn: MaterialIndustryElectronics
  maxCount: 5

- type: material
  id: MaterialIndustryElectronics
  stackEntity: MaterialIndustryElectronics
  name: materials-components-electronics
  unit: materials-unit-piece # I dont really know what to use for this.
  icon: { sprite: /Textures/_Mono/Objects/Materials/productbrick.rsi, state: preset-electronics }
  color: "#363740"
  price: 2.5 # 250/comp

