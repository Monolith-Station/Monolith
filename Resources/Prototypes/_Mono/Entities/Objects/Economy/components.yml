# start camera

- type: entity
  name: photonic flash camera
  description: An optical sensor adapted to both emit and recieve high-energy photons. Useful.
  parent: BaseEconomyGoodTier2
  id: CameraEconomy1
  components:
  - type: Tag
    tags:
    - EconomyGood
    - CameraEconomy1
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "camera"
  # flash stuff
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Weapons/flash.ogg
  - type: FlashOnTrigger
    range: 3
  - type: TriggerOnProximity
    enabled: true
    cooldown: 5
    shape:
      !type:PhysShapeCircle
      radius: 2
    repeating: true
  - type: StaticPrice
    price: 1200

# end camera

