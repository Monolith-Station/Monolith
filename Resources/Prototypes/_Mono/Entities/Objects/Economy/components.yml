  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister3
      map: ["enum.OpenableVisuals.Layer"]
    - state: canister2fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 250
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plastic: 1000
      Glass: 500
  - type: StaticPrice
    price: 2000

