# microprocessors

- type: entity
  name: microprocessor
  description: A fairly common field programmable microcontroller. Useful in everything that needs even a smidge of brain.
  parent: BaseEconomyGoodTier1
  id: MicroprocessorEconomy1
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MicroprocessorEconomy1
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "microprocessor1"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 300

- type: entity
  name: nanoprocessor
  description: A more advanced, miniaturized computation system, capable of handling a basic operating system!
  parent: BaseEconomyGoodTier2
  id: MicroprocessorEconomy2
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MicroprocessorEconomy2
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "microprocessor2"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 600

- type: entity
  name: quantum processor
  description: A state-of-the-art quantum computing system with in-built cooling, memory, and back-up power supply, capable of handling everything from persona level A.I to FTL piloting.
  parent: BaseEconomyGoodTier3
  id: MicroprocessorEconomy3
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MicroprocessorEconomy3
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "microprocessor3"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 2500

