# matter bins

- type: entity
  id: MatterBinEconomy1
  name: component bin
  description: Used for storing chemicals and other substances needed for industrial processes. Can be opened and closed. Don't use as a component while it has reagents inside!
  parent: BaseEconomyGood
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MatterBinEconomy1
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "canister_open"}
          False: {state: "canister"}
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: canisterfill
    inHandsFillBaseName: -fill-
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister
      map: ["enum.OpenableVisuals.Layer"]
    - state: canisterfill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 100
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
  - type: MixableSolution
    solution: capsule
  - type: RefillableSolution
    solution: capsule
  - type: DrainableSolution
    solution: capsule
  - type: ExaminableSolution
    solution: capsule
  - type: DrawableSolution
    solution: capsule
  - type: InjectableSolution
    solution: capsule
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: SolutionItemStatus
    solution: capsule
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Drink
    solution: capsule
  - type: Spillable
    solution: capsule
  - type: StaticPrice
    price: 200

- type: entity
  id: MatterBinEconomy2
  name: large component bin
  description: Used for storing chemicals and other substances needed for industrial processes. Much larger than its predecessor. Can be opened and closed. Don't use as a component while it has reagents inside!
  parent: [ MatterBinEconomy1, BaseEconomyGoodTier2 ]
  components:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "canister2_open"}
          False: {state: "canister2"}
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: canister2fill
    inHandsFillBaseName: -fill-
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister2
      map: ["enum.OpenableVisuals.Layer"]
    - state: canister2fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 250
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plastic: 1000
      Glass: 500
  - type: StaticPrice
    price: 600

- type: entity
  name: basic components
  description: A casing of mechanical-electrical interfacing systems, like gears, stepper motors, cabling and more.
  parent: BaseEconomyGoodTier2
  categories: [ HideSpawnMenu ]
  id: MatterBinEconomy2Spawner
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "canister2"
  - type: TimedDespawn
    lifetime: 0.1
  - type: SpawnOnDespawn
    count: 0
    prototype: MatterBinEconomy2

- type: entity
  id: MatterBinEconomy3
  name: supercomponent bin
  description: Used for storing chemicals and other substances needed for industrial processes. Much larger than its predecessor. Can be opened and closed. Don't use as a component while it has reagents inside!
  parent: [ MatterBinEconomy1, BaseEconomyGoodTier3 ]
  components:
  - type: GenericVisualizer
