- type: entity
  parent: BaseBlueprintPrototypeVoucher
  id: BlueprintVoucherHammerhead
  name: wayward "hammerhead" blueprint
  description: A tattered and distorted blueprint of unknown origin. It seems to be the blueprint for a heavy military vessel, but you don't think even an autolathe could make out what it's trying to depict anymore. The only thing you can clearly identify is the label "HAMMERHEAD".
  components:
  - type: Blueprint
    providedRecipes:
    - ShipVoucherHammerheadRecipe
