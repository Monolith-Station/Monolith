- type: entity
  parent: BaseBlueprintPrototypeVoucher
  id: BlueprintVoucherBalor
  name: balor blueprint
  description: A blueprint depicting an extremely unusual vessel in a circular shape, as well as a few small drones. It is labelled "Balor" and is clearly marked as "denied".
