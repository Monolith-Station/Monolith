# TODO - new sprites

- type: entity
  parent: MonoBaseMobLetoferolHumanoid
  id: MobLetoferolHorror
  name: chimera fleshbeast
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.7
    baseSprintSpeed : 4.85
    weightlessAcceleration: 1.5 # Slightly more manueverable in space.
  - type: Sprite
    sprite: _Mono/Mobs/Chimera/rook.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: icon
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Critical
      600: Dead
    allowRevives: false
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      250: 0.85
      325: 0.75
      400: 0.3
  - type: MeleeWeapon
    altDisarm: false
    autoAttack: true
    attackRate: 1.2
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 60
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 16
        Structural: 90
  - type: Clumsy
    clumsyDefaultCheck: 1
    gunShootFailDamage:
      types:
        Heat: 35
    clumsyVaulting: false
  - type: ActionGrant
    actions:
    - ActionSpawnBiomassTile
    - ActionSpawnBiomassWall
    - ActionSpawnLetoferolBeast
  #- type: ActionGun
  #  action: ActionLetoferolSpike
  #  gunProto: LetoferolSpikeGun

- type: entity
  parent: MobLetoferolHorror
  id: MobLetoferolHorrorGhostrole
  suffix: Ghostrole
  name: chimera fleshbeast
  components:
  - type: GhostRole
    name: ghost-role-information-chimera-name
    description: ghost-role-information-chimera-description
    rules: ghost-role-information-chimera-rules
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 180000 # 50 hrs
  - type: GhostTakeoverAvailable

- type: entity
  parent:
  - MonoBaseMobLetoferol
  - BaseMobFlesh
  id: MobLetoferolBeast
  name: chimera fleshbeast
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/flesh.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: jared
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        jared: ""
        golem: ""
        clamp: ""
        lover: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeat:
            min: 1
            max: 1
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
    allowRevives: false
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      30: 0.75
      40: 0.5
      50: 0.25
  - type: MeleeWeapon
    attackRate: 1.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Structural: 50
