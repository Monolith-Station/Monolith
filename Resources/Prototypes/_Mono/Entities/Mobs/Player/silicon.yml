- type: entity
  id: BorgChassisRedacted
  parent: BaseBorgChassisRedacted
  name: remnant automated defense system tender
  description: A tender to an automated drone ship, to keep its internal mechanisms intact.
  components:
  - type: Sprite
    layers:
    - state: synd_engi
    - state: synd_engi_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: synd_engi_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    - Azaziba
    understands:
    - TauCetiBasic
    - RobotTalk
    - Azaziba
  - type: BorgChassis
    maxModules: 10
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleEngineering
      - BorgModuleSyndicate
      - BorgModuleSyndicateAssault
    hasMindState: derelict_e
    noMindState: derelict_e_r
  - type: Construction
    node: derelictcyborg
  - type: InteractionPopup
    interactSuccessString: petting-success-derelict-cyborg
    interactFailureString: petting-failure-derelict-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Scrammer
    actionProto: ActionScrammerScramADM
    specifier:
      teleportRadius: 40
      teleportAttempts: 5 # will only slightly aim for grids
      forceSafe: false
      minRadiusFraction: 0.75 # force teleport 30-40 tiles
  # lower HP to compensate for scram
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Critical # has innate armor so this is actually more
      250: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      140: 0.7
      160: 0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
         damage: 350
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

