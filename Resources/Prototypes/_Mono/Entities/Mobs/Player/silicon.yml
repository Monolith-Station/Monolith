    - Mothership
  - type: Access
    tags:
    - Xenoborg
    - Mothership
  - type: MothershipCore
  - type: Xenoborg
  - type: AccessReader
    access: [["Xenoborg"], ["Mothership"]]
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
