    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: ResearchClient
  - type: AutomationSlots # Goobstation
    slots:
    - !type:AutomatedMaterialStorage
      input: AutomationSlotMaterials
      output: null
  - type: MaterialStorageMagnetPickup # Frontier
    range: 1.50 # Mono
  - type: SpamEmitSound # Goobstation - random lathe sounds
    minInterval: 300
    maxInterval: 900
    sound:
      collection: RandomLatheSounds
      params:
        volume: -12 # Ambient
        maxDistance: 10
        variation: 0.05
  - type: SpamEmitSoundRequirePower # Goobstation
  - type: Sprite
    sprite: Mobs/Silicon/mothership_core.rsi
    layers:
    - state: base
    - state: ai
      shader: unshaded
    - state: inserting
