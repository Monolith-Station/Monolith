# Start base CBURN (Rifleman)
- type: entity
  id: RandomHumanoidSpawnerVICTunit
  name: VICT Assaulter
  suffix: (CBURN) Viral Infection Control Team - 2
  components:
    - type: Sprite
      sprite: Markers/jobs.rsi
      state: cburn
    - type: RandomHumanoidSpawner
      settings: VICTAgent

- type: randomHumanoidSettings
  id: VICTAgent
  parent: EventHumanoidMindShielded
  components:
    - type: Loadout
      prototypes: [CBURNGear]
      roleLoadout: [ RoleSurvivalExtended ]
    - type: GhostRole
      name: ghost-role-information-cburn-agent-name
      description: ghost-role-information-cburn-agent-description
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: short
    - type: RandomMetadata
      nameSegments:
      - NamesFirstMilitary
      - NamesLastMilitary

# End base CBURN (Rifleman)

