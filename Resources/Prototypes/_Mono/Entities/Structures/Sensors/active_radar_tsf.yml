- type: entity
  parent: BaseSensor
  id: SensorRadarTsfXiaoDou
  name: Type-860 XiaoDou
  description: A basic radar kit outfitted on most TSF vessels. Provides a combined FCR & search capability, with decent resistance to chaff, but poor range.
  suffix: TSF/CSec, search & FCR
  placement:
    mode: SnapgridCenter
  components:
  - type: ShipSensor
    activeThermalSignature: 20000
    sensorType: ActiveRadar
    sensitivity: 118
    arcDegrees: 360
    powerDraw: 600
    powerDrawActive: 4000
    arcConfigurable: true
    gridRelativeArc: true
    requireLineOfSight: false
    chaffResistance: 0.8
    canProvideLock: true
    canProvideGuidance: true
  - type: ShipRepairable
    repairTime: 15
    repairCost: 60
  - type: ApcPowerReceiver
    powerLoad: 600
  - type: Sprite
    rotation: -180
    offset: 0, -1
    sprite: _Mono/Structures/Sensors/active_radar_1x1.rsi
    layers:
    - state: tsf_t1

- type: entity
  parent: BaseSensor
  id: SensorRadarTsfRenHai
  name: Type-890 RenHai
  description: A more advanced radar kit outfitted on most TSF vessels. Developed from the Type-860 - provides more sensitivity, but has a higher power draw & chaff resistance.
  suffix: TSF/CSec, search & FCR
  placement:
    mode: SnapgridCenter
  components:
  - type: ShipSensor
    activeThermalSignature: 80000
    sensorType: ActiveRadar
    sensitivity: 307
    arcDegrees: 360
    powerDraw: 900
    powerDrawActive: 10000
    arcConfigurable: true
    gridRelativeArc: true
    requireLineOfSight: false
    chaffResistance: 0.4
    canProvideLock: true
    canProvideGuidance: true
  - type: ApcPowerReceiver
    powerLoad: 900
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: ShipRepairable
    repairTime: 15
    repairCost: 100
  - type: Sprite
    rotation: -180
    offset: 0, -1
    sprite: _Mono/Structures/Sensors/active_radar_1x1.rsi
    layers:
    - state: tsf_t2

