# T1
# Make sure these all have a little different outputs for the sake of identification.

- type: entity
  parent: BaseSensor
  id: SensorRadarTSF
  name: Type-860 XiaoDou
  description: A basic AESA kit outfitted on most TSF vessels. Used for both navigation and detection purposes.
  suffix: TSF, T1, active radar
  placement:
    mode: SnapgridCenter
  components:
  - type: ShipSensor
    sensorType: ActiveRadar
    sensitivity: 107
    arcDegrees: 360
    powerDraw: 800
    powerDrawActive: 5000
  - type: ApcPowerReceiver
    powerLoad: 800
  - type: Sprite
    offset: 0,1
    sprite: _Mono/Structures/Sensors/active_radar_t1.rsi
    layers:
    - state: tsf

- type: entity
  parent: SensorRadarTSF
  id: SensorRadarPDV
  name: KOLS-4 Orekh
  description: A simple AESA design for light ships manufactured in the USSP. Designed for ease of maintenance and addition onto preexisting hulls.
  suffix: PDV/USSP, T1, active radar
  placement:
    mode: SnapgridCenter
  components:
  - type: ShipSensor
    sensitivity: 96
    powerDrawActive: 4700
  - type: Sprite
    layers:
    - state: pdv

- type: entity
  parent: SensorRadarTSF
  id: SensorRadarCiv
  name: AN/SP-300
  description: A generic radar for civilian ships. These are usually more for navigation than finding other ships.
  suffix: Generic/Civ, T1, active radar
  placement:
    mode: SnapgridCenter
  components:
  - type: ShipSensor
    sensitivity: 40
    powerDraw: 400
    powerDrawActive: 2000
  - type: ApcPowerReceiver
    powerLoad: 400
  - type: Sprite
    layers:
    - state: civ

