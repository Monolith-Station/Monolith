- type: entity
  abstract: true
  id: BaseGreeble
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Animateable
  - type: RequiresGrid
  - type: InteractionOutline
  - type: Tag
    tags:
    - Structure
  - type: Repairable #Mono: Nanite applicator
    qualities:
    - Applicating
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: ShipRepairable
    repairTime: 1
    repairCost: 0
  - type: Sprite
    drawDepth: Overdoors

