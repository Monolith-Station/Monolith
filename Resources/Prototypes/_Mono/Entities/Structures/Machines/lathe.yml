- type: entity
  id: FactionLathe
  parent: BaseLatheLube
  name: military multi-purpose assembler
  description: Capable of producing a wide variety of things. Compatible with all kinds of fabrication template encryptions.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: [ "enum.LatheVisualLayers.IsRunning" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MilitaryTechfabMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: icon
    staticPacks:
    - StaticAmmoRecipePack
    - NFMercenaryTechfabDeprecatedStatic
    - RoundstartShipgunAmmo
    - StaticGrenades
    - MonoAttachmentsStatic
    dynamicPacks:
    # rogue start
    - MonoRogueWeaponsDynamicMelee
    - MonoRogueWeaponsDynamicRanged
    - MonoRogueVouchersDynamic
    - MonoRogueMiscDynamic
    - MonoRogueGearDynamic
    - MonoRogueGearProDynamic
    # TSF start
    - MonoTSFWeaponsDynamicMelee
    - MonoTSFWeaponsDynamicRanged
    - MonoTSFVouchersDynamic
    - MonoTSFMiscDynamic
    - MonoTSFGearDynamic
    # USSP start
    # - MonoUSSPArmorDynamic
    # - MonoUSSPMiscDynamic
    # - MonoUSSPWeaponsDynamicRanged
    # Viper Group start
    # - MonoViperGroupDynamic
    # Universal shit (stuff like shipgun ammo)
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
    - DynamicAmmoRecipePack
    - NFMercenaryTechfabDeprecated
    # Civ military tech
    - ResearchedExplosives
    - SecurityEquipment
    - SmartGun
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget

- type: entity
  id: FactionLatheImmmovable
  parent: [FactionLathe, BaseStructureDisableToolUse]
  suffix: IMMOVABLE

- type: entity
  id: BaseLatheAssembler
  parent: BaseLathe
  abstract: true
  name: lathe
  components:
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - DrainableSolution
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board
    - entity_storage
  - type: EntityStorage
    capacity: 75
  - type: ExtendDescription
    descriptionList:
    - description: Insert components for recipes by placing them on top of the lathe, then "open / close" inside its right-click menu.
      color: "#4f94ad"
      requireDetailRange: true

