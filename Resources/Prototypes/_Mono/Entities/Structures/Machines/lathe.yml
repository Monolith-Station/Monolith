- type: entity
  id: IndustrialFurnaceEconomy
  parent: [ BaseMachinePowered, BaseStructureDisableToolUse ]
  name: industrial arc furnace
  description: An advanced arc furnace capable of melting ore and refining material through heat. Essential for creating advanced alloys.
  components:
  - type: Appearance
  - type: Animateable
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Sprite
    offset: 0.5,0
    sprite: _Mono/Structures/Machines/2x1arcfurnace.rsi
    layers:
    - state: icon
      map: [ "enum.MicrowaveVisualizerLayers.Base" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.MicrowaveVisualizerLayers.BaseUnlit" ]
  - type: RequireProjectileTarget
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "1.4,0.4,-0.4,-0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  # microwave comps
  - type: GuideHelp
    guides:
    - ArcFurnace
  - type: Microwave
    capacity: 15
    explosionChance: 0
    lightningChance: 0
    baseHeatMultiplier: 300
    temperatureUpperThreshold: 3300
    maxItemSize: Ginormous
    validRecipeTypes: ArcFurnace
    beginCookingSound: /Audio/Machines/machine_switch.ogg
    foodDoneSound: /Audio/Effects/Shuttle/radar_ping.ogg
    loopingSound: /Audio/_Mono/Structures/Economy/furnace.ogg
    key: ArcFurnaceKey
    menuTitle: "assembler-menu-arc-furnace-title"
    flavorText: "assembler-menu-arc-furnace-footer-flavor-left"
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.ArcFurnaceKey
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.ArcFurnaceKey:
        type: AssemblerBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "icon" }
          Cooking: { state: "icon" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "unlit" }
          Broken: { state: "panel" }
          Cooking: { state: "building" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
  - type: AutomationSlots # Goobstation
    slots:
    - !type:AutomatedContainer
      input: AutomationSlotInput
      output: AutomationSlotInput
      containerId: microwave_entity_container
      maxItems: 15

