    foodDoneSound: /Audio/Effects/Shuttle/radar_ping.ogg
    loopingSound: /Audio/_Mono/Structures/Economy/furnace.ogg
    key: PrecisionAssemblerKey
    menuTitle: "assembler-menu-precision-assembler-title"
    flavorText: "assembler-menu-precision-assembler-footer-flavor-left"
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.PrecisionAssemblerKey
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.PrecisionAssemblerKey:
        type: AssemblerBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "icon" }
          Broken: { state: "panel" }
          Cooking: { state: "building" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "unlit" }
          Cooking: { state: "unlit-building" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
  - type: AutomationSlots # Goobstation
    slots:
    - !type:AutomatedContainer
      input: AutomationSlotInput
      output: AutomationSlotInput
      containerId: microwave_entity_container
      maxItems: 15

- type: entity
  id: CentrifugeLathe
  parent: [BaseStructureDisableToolUse, BaseLatheLube]
  name: industrial uranium processing centrifuge
  description: A large sized industrial gas centrifuge for bulk processing isotopes, materials and generally making things go spinny. Much more efficient at producing fissile uranium than the miniature ones. Not equipped to reprocess nuclear fuel.
  components:
  - type: Sprite
    snapCardinals: false
    offset: 0.5, 0.5
    noRot: false
    sprite: _Mono/Structures/Machines/2x2centrifuge.rsi
    layers:
    - state: icon
      map: [ "enum.LatheVisualLayers.IsRunning" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    producingSound: /Audio/Ambience/Objects/crushing.ogg
    idleState: icon
    runningState: building
    staticPacks:
    - MonoCentrifugeProcessingFullSizeStatic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,1.5,1.2,-0.5"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Ore
  - type: RequireProjectileTarget
  - type: GuideHelp
    guides:
    - Economy
  - type: Transform
    anchored: true
    noRot: false
  - type: OreSiloClient
