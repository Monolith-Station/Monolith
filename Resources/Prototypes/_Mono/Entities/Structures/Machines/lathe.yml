        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Machine
    board: IndustrialFurnaceEconomyCompactCircuitboard
  - type: Lathe
    timeMultiplier: 1
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: building
    staticPacks:
