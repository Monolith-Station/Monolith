- type: entity
  id: IndustrialFurnaceEconomy
  parent: BaseLatheAssembler
  name: industrial arc furnace
  description: An advanced arc furnace capable of melting ore and refining material through heat. Essential for creating advanced alloys.
  components:
  - type: Animateable
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Sprite
    offset: 0.5,0
    sprite: _Mono/Structures/Machines/2x1arcfurnace.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    #- state: panel
    #  map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: RequireProjectileTarget
  - type: DisableToolUse
    screwing: true
    anchoring: true
  - type: EntityStorage
    capacity: 100
    isCollidableWhenOpen: true
    enteringOffset: 0.5,0
    enteringRange: 0.35
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "1.4,0.4,-0.4,-0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Lathe
    timeMultiplier: 0.2
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: building
    staticPacks:
    - ArcFurnaceStatic

- type: entity
  id: IndustrialFurnaceEconomyCompact
  parent: IndustrialFurnaceEconomy
  name: compact arc furnace
  description: A compact version advanced arc furnace capable of melting ore and refining material through heat. Essential for creating advanced alloys. Slower and less capacity.
  components:
  - type: DisableToolUse
    screwing: false
    anchoring: false
  - type: Sprite
    offset: 0,0
    sprite: _Mono/Structures/Machines/1x1arcfurnace.rsi
