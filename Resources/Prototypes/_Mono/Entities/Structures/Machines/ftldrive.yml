- type: entity
  id: MachineFTLDrive750
  parent: BaseMachinePowered
  name: CTLA-750 bluespace drive
  description: An FTL drive that extends a ship's FTL range to 750 meters. Does not stack.
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Sprite
      sprite: _Mono/Structures/ShuttleComponents/drive.rsi
      snapCardinals: true
      layers:
      - state: control
      - state: control_on
        map: ["enum.PowerDeviceVisualLayers.Powered"]
        visible: false
        shader: unshaded
        color: "#349BEB"
    - type: FTLDrive
      range: 750
      thermalSignature: 2000000 # ~1414m range after detection scaling
    - type: ThermalSignature
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1500
        behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:ExplodeBehavior
        - !type:SpawnGasBehavior
          gasMixture:
            volume: 1000
            moles:
            - 194 # oxygen
            - 0 # nitrogen
            - 0 # carbon dioxide
            - 6 # plasma
            temperature: 752.48
      - trigger:
          !type:DamageTrigger
          damage: 500
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 1
              max: 2
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: Explosive
      explosionType: Default
      maxIntensity: 4000
      intensitySlope: 4
      totalIntensity: 300
    - type: ApcPowerReceiver
      powerLoad: 2000
    - type: PointLight
      enabled: false
      color: "#349BEB" # beb color
      radius: 2.0
      energy: 1.5
    - type: LitOnPowered
    - type: ExtensionCableReceiver
    - type: Appearance
    - type: AmbientOnPowered
    - type: AmbientSound
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/anomaly_generator.ogg
    - type: GenericVisualizer
      visuals:
        enum.PowerDeviceVisuals.Powered:
          enum.PowerDeviceVisualLayers.Powered:
            True: { visible: true }
            False: { visible: false }
    - type: Machine
      board: MachineDriveCTLA750Circuitboard
    - type: Construction # Mono
      graph: Machine
      node: machine
      containers:
      - machine_board
      - machine_parts
    - type: ContainerContainer # Mono
      containers:
        machine_board: !type:Container
        machine_parts: !type:Container
    - type: PirateBountyItem
      id: FTLDrive
    # can repair it without pre-fracture SRD but expensive
    - type: ShipRepairable
      repairTime: 20
      repairCost: 150
    - type: ESSparkOnHit
      prob: 0.25
      tileFireChance: 0.5
      count: 3
    - type: Flammable
      fireSpread: true
      firestackFade: -0.1
      alwaysCombustible: true
      damage:
        types:
          Heat: 1
          Structural: 2
    - type: FireVisuals
      sprite: Mobs/Effects/onfire.rsi
      normalState: Generic_mob_burning

- type: entity
  parent: MachineFTLDrive750
  id: MachineFTLDrive1500
  name: CTLA-1500 bluespace drive
  description: An FTL drive that extends a ship's FTL range to 1.5 kilometers. Does not stack.
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
      color: "#E6173E"
  - type: FTLDrive
    range: 1500
    thermalSignature: 4000000 # ~2000m range after detection scaling
  - type: ThermalSignature
  - type: ApcPowerReceiver
    powerLoad: 4000
  - type: PointLight
    enabled: false
    color: "#E6173E" # beb color
    radius: 2.0
    energy: 1.5
  - type: Machine
    board: MachineDriveCTLA1500Circuitboard
  - type: ShipRepairable
    repairTime: 30
    repairCost: 220
  - type: ShipRepairableRestrict
    toolWhitelist:
      tags:
      - ADSRepairTool

- type: entity
  parent: MachineFTLDrive750
  id: MachineFTLDrive750S
  name: CTLA-750s bluespace drive
  description: An advanced FTL drive that extends a ship's FTL range to 750 meters, with faster recharge and flight times. Does not stack.
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
      color: "#7E16F7"
  - type: FTLDrive
    range: 750
    cooldown: 7.5
    hyperSpaceTime: 15
    startupTime: 4.2
    thermalSignature: 4000000 # ~2000m range after detection scaling but for smaller ships it might not have time to get to full heat signature
  - type: ThermalSignature
  - type: ApcPowerReceiver
    powerLoad: 4000
  - type: PointLight
    enabled: false
    color: "#7E16F7" # beb color
    radius: 2.0
    energy: 1.5
  - type: Machine
    board: MachineDriveCTLA750sCircuitboard
  - type: ShipRepairable
    repairTime: 25
    repairCost: 180
  - type: ShipRepairableRestrict
    toolWhitelist:
      tags:
      - ADSRepairTool
