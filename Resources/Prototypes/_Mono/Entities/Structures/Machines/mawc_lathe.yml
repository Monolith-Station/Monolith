- type: entity
  id: MAWCLathe
  parent: BaseLatheLube
  name: MAWC fabricator
  description: PLACEHOLDER (write this later me)
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MAWCLatheMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: icon
    staticPacks:
    - MAWCWeaponsStatic
    - MAWCHardsuitsStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot

- type: entity
  id: MAWCLatheImmovable
  parent: [MAWCLathe, BaseStructureDisableToolUse]
  suffix: IMMOVABLE

- type: entity
  id: MAWCLatheMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: MAWC fabricator machine board
  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: MAWCLathe
    requirements:
      MatterBin: 2
      Manipulator: 2
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
