- type: entity
  id: StationAiUploadComputerUnlocked
  parent: StationAiUploadComputer
  name: AI upload console
  description: Used to update the laws of the vessel AI.
  suffix: Unlocked
  components:
  - type: Computer
    board: StationAiUploadCircuitboardUnlocked
  - type: AccessReader
    enabled: false

# Xenoborg
- type: entity
  parent: BaseComputerAiAccess
  id: ComputerXenoborgsControl
  name: xenoborgs control console
  description: Used to remotely monitor all xenoborgs.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: xenorobot
    - map: ["computerLayerKeys"]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "Mothership" ]]
  - type: ActivatableUIRequiresAccess
  - type: ShipNpcTarget
    needPower: true
  - type: ActivatableUI
    key: enum.RoboticsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.RoboticsConsoleUiKey.Key:
        type: RoboticsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: RoboticsConsole
    allowBorgControl: true
    radioChannel: Xenoborg
  - type: ActiveRadio
    channels:
    - Xenoborg
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Mothership
    transmitFrequencyId: Xenoborgs
  - type: Computer
    board: ComputerXenoborgsControlCircuitboard

- type: entity
  parent: [ ComputerSurveillanceWirelessCameraMonitor, BaseComputerAiAccess ]
  id: ComputerSurveillanceWirelessXenoborgCameraMonitor
  name: xenoborg camera monitor
  description: A wireless xenoborg camera monitor. You're watching them. Maybe.
  components:
  - type: Computer
    board: XenoborgCameraMonitorCircuitboard
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Mothership
    transmitFrequencyId: Mothership
  - type: WirelessNetworkConnection
    range: 2000