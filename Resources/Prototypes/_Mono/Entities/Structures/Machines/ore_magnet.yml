- type: entity
  parent: BaseMachinePowered #TODO machine component 
  id: MachineOreMagnet
  name: ore magnet # TODO cool name
  description: TODO cool description
  components:
  - type: Sprite
    sprite: _NF/Structures/Specific/Explorers/salvageradar.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: PointLight # TODO?
    radius: 1.5
    energy: 1.6
    color: "#3db83b"
    castShadows: false
  - type: AmbientSound # TODO 
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/hdd_buzz.ogg
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 6000 # TODO more?
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Storage
    grid:
    - 0,0,19,9
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
    whitelist:
      tags:
      - Ore
      - ArtifactFragment
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: Dumpable
    multiplier: 0.15
  - type: MagnetPickup
    range: 30

- type: entity
  name: ore magnet flatpack #TODO 
  id: OreMagnetFlatpack
  parent: BaseNFFlatpack
  description: A flatpack used for constructing an ore magnet.
  components:
  - type: Flatpack
    entity: MachineSalvageRadar
  - type: StaticPrice
    price: 6500
    vendPrice: 10000
