- type: entity
  parent: [ BaseStructureDisableToolUse, BaseStructureIndestructible, BaseMachine ]
  id: CaelestinusReverseEngineeringStation
  name: caelestinus reverse engineering station
  description: A machine which is capable of deconstructing several notable military items to investigate their inner workings. Eventually spits out tech disks of new and improved blueprints created as a result.
  components:
  - type: Sprite
    sprite: Structures/Machines/rndpointsource.rsi
    layers:
    - state: rndpointsource-off
    - state: rndpointsource
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: PointLight
    radius: 1.5
    energy: 1.3
    color: "#1b8b2a"
  - type: GuideHelp
    guides:
    - Caelestinus_ReverseEngineering
  - type: ReverseEngineeringStation
    progressTree: 
      BallisticWeapon:
        1: TechDiskCaelestinusIroh
        4: TechDiskCaelestinusJackdaw
        5: TechDiskCaelestinusJackdawBoxMagazine
      EnergyWeapon:
        3: TechDiskCaelestinusLawbringer
      MeleeWeapon:
        2: TechDiskEnergyWeapons
        4: TechDiskCaelestinusLondon
      CombatHardsuit:
        1: TechDiskCaelestinusThaumaturge
        3: TechDiskCaelestinusAdjudicator
      FactionTool:
        2: TechDiskCaelestinusBootsTrauma
    totalProgressTree: 
      750: CaelestinusArchonActivatorOmega