- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterWirelessPDV
  suffix: PDV
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraVanguardPDV #this is PDV
    - type: WirelessNetworkConnection
      range: 40000 # Modify this to change the range, make sure to change the range of the respective camera to be the same

- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterWirelessTSF
  suffix: TSF
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraSolarianTSF #this is tsf 
    - type: WirelessNetworkConnection
      range: 40000

- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterWirelessMMC
  suffix: MMC
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraMMC
    - type: WirelessNetworkConnection
      range: 40000
