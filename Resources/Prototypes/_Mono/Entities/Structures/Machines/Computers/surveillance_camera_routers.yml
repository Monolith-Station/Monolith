- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterImperialDSM
  suffix: DSM
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraImperialDSM #this is PDV
    - type: WirelessNetworkConnection
      range: 40000 # Modify this to change the range, make sure to change the range of the respective camera to be the same

- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterCommunardNCWL
  suffix: NCWL
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraCommunardNCWL #this is tsf 
    - type: WirelessNetworkConnection
      range: 40000

- type: entity
  parent: SurveillanceCameraWirelessRouterBase
  id: SurveillanceCameraRouterInterdyneIPM
  suffix: IPM
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraInterdyneIPM #not used possibly mmc etc.
    - type: WirelessNetworkConnection
      range: 40000
