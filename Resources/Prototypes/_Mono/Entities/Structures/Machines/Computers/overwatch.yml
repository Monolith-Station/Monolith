# Handheld
- type: entity
  parent: [BaseHandheldComputer, BaseItem]
  id: BaseHandheldOverwatchConsole
  name: handheld overwatch console
  description: Displays a readout of faction squad members.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: overwatch
      shader: unshaded
  - type: OverwatchConsole
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.OverwatchUiKey.Key
  - type: UserInterface
    interfaces:
      enum.OverwatchUiKey.Key:
        type: OverwatchBoundUserInterface

