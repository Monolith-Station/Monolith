- type: entity
  parent: Interactor
  id: InteractorCCTC
  name: proprietary interactor
  description: A proprietary, more efficient design of a robotic actuator specialized in interacting with objects using various other objects.
  components:
  # Visuals
  - type: Sprite
    sprite: _Mono/Structures/Machines/cctcinteractor.rsi
    layers:
    - state: base
    - state: empty
      map: [ enum.InteractorLayers.Hand ]
    - state: empty-powered
      shader: unshaded
      visible: false
      map: [ enum.InteractorLayers.Powered ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.InteractorLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.InteractorVisuals.State:
        enum.InteractorLayers.Hand:
          Empty: { state: empty }
          Inactive: { state: inactive }
          Active: { state: active }
        enum.InteractorLayers.Powered:
          Empty: { state: empty-powered }
          Inactive: { state: inactive-powered }
          Active: { state: active-powered }
  # Construction
  - type: Machine
    board: InteractorCCTCCircuitboard

- type: entity
  parent: RoboticArm
  id: RoboticArmCCTC
  name: proprietary robotic arm
  description: A proprietary, more efficient design of a high-tech robotic arm capable of moving items to and from machines that have automation upgrades.
  components:
  # Visuals
  - type: Sprite
    sprite: _Mono/Structures/Machines/cctcrobotic_arm.rsi
    layers:
    - state: base
    - state: arm-long
      map: [ "enum.RoboticArmLayers.Arm" ]
    - state: powered
      shader: unshaded
      visible: false
      map: [ "enum.RoboticArmLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RoboticArmVisuals.HasItem:
        enum.RoboticArmLayers.Arm:
          # extended when waiting for items like factorio
          True: { state: arm-short }
          False: { state: arm-long }
      enum.PowerDeviceVisuals.Powered:
        enum.RoboticArmLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # Construction
  - type: Machine
    board: RoboticArmCCTCCircuitboard
