# region ROCK

- type: entity
  id: WallRockThorium
  parent: NFWallRockOre
  description: An ore vein rich with thorium.
  suffix: Thorium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreThorium
  - type: Sprite
    layers:
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west
    - state: rock_thorium
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  id: WallRockTitanium
  parent: NFWallRockOre
  description: An ore vein rich with titanium.
  suffix: Titanium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreTitanium 
  - type: Sprite
    layers:
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west
    - state: rock_rutile
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]


