# region ASTEROID

- type: entity
  id: WallRockSnowThorium
  parent: NFWallRockSnowOre
  description: An ore vein rich with thorium.
  suffix: Thorium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreThorium # Frontier: NF prefix
  - type: Sprite
    layers:
    - state: rock_thorium
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  id: WallRockSnowTitanium
  parent: NFWallRockSnowOre
  description: An ore vein rich with titanium.
  suffix: Titanium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreTitanium # Frontier: NF prefix
  - type: Sprite
    layers:
    - state: rock_titanium
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

