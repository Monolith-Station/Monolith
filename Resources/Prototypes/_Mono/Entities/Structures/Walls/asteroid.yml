# Ore veins
- type: entity
  id: WallRockSnowThorium
  parent: NFWallRockSnowOre # Frontier: AsteroidRock<NFAsteroidRockOre
  description: An ore vein rich with thorium.
  suffix: Thorium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreThorium # Frontier: NF prefix
  - type: Sprite
    layers:
    - state: rock_asteroid
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_asteroid_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_asteroid_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_asteroid_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_asteroid_west
    - state: rock_coal
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  id: WallRockSnowTitanium
