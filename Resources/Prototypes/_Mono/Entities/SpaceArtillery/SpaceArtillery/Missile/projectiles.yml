# Pre-Fracture
# Entropy electron Torpedo

- type: entity
  id: ShipMissileEntropy
  name: electron torpedo
  parent: BaseTorpedo
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Shock: 5000
        Heat: 5000
        Structural: 10000
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Projectiles/ship_projectiles.rsi
    layers:
    - state: electron-torpedo
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#f5ee1b"
    scale: 4
    requireNoGrid: true
    shape: triangle
  - type: TimedDespawn
    lifetime: 15
  - type: PointLight
    radius: 5
    color: orange
    energy: 2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: HardBombShipGun
    maxIntensity: 350
    intensitySlope: 5
    totalIntensity: 550
  - type: MiningGatheringSoft
  - type: MiningGatheringHard
  - type: TargetSeeking
    acceleration: 30
    detectionRange: 1000
    scanArc: 45
    launchSpeed: 25
    maxSpeed: 100
    trackDelay: 2
  - type: EmpOnTrigger
    range: 7
    energyConsumption: 2900000
    disableDuration: 10
  # destructible components below
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Meteor
    damageTypes:
      types:
        Blunt: 0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
