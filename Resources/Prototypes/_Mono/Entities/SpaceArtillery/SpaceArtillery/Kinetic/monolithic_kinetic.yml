# Monolithic weapons - Strange anomalous shuttle wepaons of all types

# Initiate

- type: entity
  id: WeaponTurretInitiate
  name: Anomalous Repeater - Initiate
  parent: BallisticArtilleryUnanchorable
  description: A small, strange shard of monolith energy, firing a spray of crytals not unlike the valuable shards that are often hunted for. Sometimes
  components:
  - type: StaticPrice
    price: 50000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/initiate.rsi
    layers:
    - state: space_artillery
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: ExaminableBattery
  - type: Appearance
  - type: FireControlRotate
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 700
  - type: DeviceLinkSink
    ports:
    - Toggle
  - type: Gun
    fireRate: 15
    recoil: 15 # 3/5x
    projectileSpeed: 200
    minAngle: 0
    maxAngle: 5
    shootThermalSignature: 10000 # relatively low for a shipgun, ~693m signature if firing continuously
    soundGunshot:
      path: /Audio/Magic/blink.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 550
  - type: SpaceArtillery
    powerChargeRate: 100
    powerUsePassive: 100
  - type: Actions
  - type: CombatMode
    isInCombatMode: true
  - type: Airtight
  - type: ProjectileBatteryAmmoProvider
    proto: ShipInitiateShot
    fireCost: 15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadiationBlocker
    resistance: 8
  - type: RadarBlip
    radarColor: "#9112e0"
    scale: 1
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Light

# Acolyte

- type: entity
  id: WeaponTurretAcolyte
  name: Anomalous Blaster - Acolyte
  parent: BallisticArtilleryUnanchorable
  description: A larger construct, this one fires globs of energy that tend to corrupt anything they impact with, spreading a crystaline cancer known for crippling even the largest of shuttles.
  components:
  - type: StaticPrice
    price: 70000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/acolyte.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 2
    recoil: 10 # 2/5x
    projectileSpeed: 170
    minAngle: 0
    maxAngle: 6
    selectedMode: SemiAuto
    shootThermalSignature: 2000000 # ~4.5km signature if firing continuously
    soundGunshot:
      path: /Audio/Magic/forcewall.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 125
  - type: SpaceArtillery
    powerChargeRate: 125
    powerUsePassive: 600
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipAcolyteShot
    fireCost: 50
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadarBlip
    radarColor: "#9112e0"
    scale: 1.5
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium

