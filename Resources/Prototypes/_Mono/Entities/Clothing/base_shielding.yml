- type: entity
  abstract: true
  id: MonoEnergyShieldClothing
  components:
  - type: PersonalShield
    shield:
      maxCharge: 300
      regenRate: 3
      spinupTime: 1
      breakCooldown: 15
      powerDraw: 0.5
  - type: ItemToggle
    onUse: false
    onAltUse: true
    onActivate: false
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 4
  - type: ActionGrant
    actions:
    - ActionActivatePersonalShield
  - type: ItemActionGrant
    actions:
    - ActionActivatePersonalShield
    
# If a shield is powerful enough, you can remove plates as a balance option by replacing ClothingOuterHardsuitBase
- type: entity
  abstract: true
  parent: [RecyclableItemClothHardsuit, ClothingOuterBase, GeigerCounterClothing, AllowSuitStorageClothing] # Frontier: added RecyclableItemClothHardsuit # Mono - armor plates.
  id: ClothingOuterHardsuitBaseNoPlateholder
  name: base hardsuit no plateholder
  components:
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.4
    sprintModifier: 0.6
  - type: HeldSpeedModifier
  - type: Item
    size: Ginormous
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.90
        Radiation: 0.25
  - type: ToggleableClothing
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: GroupExamine
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # the average lightbulb only does around four damage!
    slots: OUTERCLOTHING
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/backpack_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/backpack_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/backpack_drop.ogg
      params:
        volume: -4
  # Goobstation edit end
  - type: HarpyHideWings # Frontier, needed for Harpies
  - type: StaticPrice # Frontier
    price: 20 # Frontier
    vendPrice: 4000 # Frontier
  - type: Storage #No armor plates for shield hardsuits
    maxItemSize: Normal
    grid:
    - 0,0,1,1
    blacklist:
      components:
      - ArmorPlateItem
