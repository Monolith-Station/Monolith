# NVGs and thermals

- type: entity
  parent: ClothingHelmetAttachmentBase
  id: ClothingHelmetAttachmentNVGsBasic
  name: basic night vision goggles
  description: A pair of basic optoelectronics night vision goggles with high sensibility to flashes, worn in the helmet attachment slot.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/HelmetAttachment/basic_optoelectronics_nvgs.rsi
  - type: Clothing
    sprite: _Mono/Clothing/HelmetAttachment/basic_optoelectronics_nvgs.rsi
    clothingVisuals:
      helmetattachment:
      - state: equipped-HELMETATTACHMENT
  - type: NightVision # Gen 1 monotube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 600 # Forge-Change 350 to 600 // это радиус обзора
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#a6ffa6" # Forge-Change #00FF00 to #c2ffc2 // сам фосфорный цвет, он так же может давать пересвет // замена на #a6ffa6
    lightingColor: "#FFFFFFFF" # Forge-Change #FFFFFF32 to #0EFFFFFF // Это главный рычаг яркости в темноте // ещё прибавлена яркость
    amplification: 1.2 #Forge-Change 32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: ClothingHelmetAttachmentBase
  id: ClothingHelmetAttachmentInfraredBasic
  name: basic thermal vision goggles
  description: A pair of basic thermal vision goggles with high sensibility to flashes, worn in the helmet attachment slot.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/HelmetAttachment/basic_optoelectronics_infrared.rsi
  - type: Clothing
    sprite: _Mono/Clothing/HelmetAttachment/basic_optoelectronics_infrared.rsi
    clothingVisuals:
      helmetattachment:
      - state: equipped-HELMETATTACHMENT
  - type: ThermalVision
    flashDurationMultiplier: 3
    pulseTime: 4
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: IdentityBlocker
    coverage: EYES
