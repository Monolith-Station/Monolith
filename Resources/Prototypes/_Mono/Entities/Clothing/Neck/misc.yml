- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: ClothingNeckStorageBase
  components:
  - type: Storage
    grid:
    - 0,0,0,1
    - 2,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

