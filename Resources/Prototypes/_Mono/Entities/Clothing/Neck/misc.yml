- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: ClothingNeckStorageBase
  components:
  - type: Storage
    grid: # 2x 1x2
    - 0,0,0,1
    - 2,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

# Nova Sharks

- type: entity
  parent: ClothingNeckStorageBase # You're telling me a leather jacket has no pockets?
  id: ClothingNeckNovaSharksLeatherJacket
  name: Nova Sharks leather jacket
  description: A leather jacket for any affiliated members of The Nova Sharks. Fits comfortably over most suits and rough enough to never bend to authority.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/NS-leather-jacket.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/NS-leather-jacket.rsi
  - type: Item
    size: Normal

# Generic

- type: entity
  parent: ClothingNeckStorageBase
  id: ClothingNeckOvercoat
  name: lucrative overcoat
  description: A speciallly made overcoat, able to fit over most hardsuits & made purely for style.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/overcoat.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/overcoat.rsi
  - type: Item
    size: Normal
  - type: TemperatureProtection
    heatingCoefficient: 1.0 # deliberately not changed
    coolingCoefficient: 0.5

- type: entity
  parent: ClothingNeckOvercoat
  id: ClothingNeckHeavyOvercoat
  name: heavy overcoat
  description: A thick & heavy overcoat. The synthetic fur gives it some light armour, but it won't stop a bullet.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/heavyovercoat.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/heavyovercoat.rsi
  - type: TemperatureProtection
    heatingCoefficient: 1.05 # shouldn't be as thick as a winter coat...
    coolingCoefficient: 0.2 # it's thicker than the normal one
  - type: Storage
    grid: # 2x 2x2
    - 0,0,1,1
    - 3,0,4,1
  - type: ClothingSpeedModifier # it's two whole extra big ammo boxes
    sprintModifier: 0.95
  - type: Armor
    modifiers: # Just for flavour. No piercing reduction.
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Heat: 0.95

# Bomb Collars

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBombCollar
  name: bomb collar
  suffix: Unremovable
  description: A hardened, explosive collar that locks tight around the neck. When signaled, detonates after a delay of 5 seconds. Useful to keep people in line.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/bomb-collar.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/bomb-collar.rsi
    stripDelay: 15
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
    unequipDelay: 30
  - type: UnremovableClothing
  - type: TimerStartOnSignal
  - type: AutomatedTimer
  - type: OnUseTimerTrigger
    delay: 5
    initialBeepDelay: 0
    beepSound: /Audio/Machines/timer.ogg
  - type: DeviceLinkSink
    ports:
      - Timer
  - type: Explosive
    explosionType: Minibomb #you may survive with a bombsuit lol
    totalIntensity: 50
    intensitySlope: 40
    maxIntensity: 50
    canCreateVacuum: false
  - type: ExplodeOnTrigger
  - type: SpamEmitSound
    minInterval: 360
    maxInterval: 1800
    sound: /Audio/Machines/timer.ogg
  - type: Tag
    tags:
      - BombCollar

- type: entity
  parent: ClothingNeckBombCollar
  id: ClothingNeckNukeCollar
  name: nuke collar
  suffix: Unremovable, Admin, Admeme
  description: A hardened, explosive collar with a mini-nuke attached. Mildly radioactive.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/nuke-collar.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/nuke-collar.rsi
  - type: Explosive
    explosionType: Minibomb # uh oh
    totalIntensity: 75000
    intensitySlope: 20
    maxIntensity: 500
  - type: RadiationSource
    intensity: 0.2
