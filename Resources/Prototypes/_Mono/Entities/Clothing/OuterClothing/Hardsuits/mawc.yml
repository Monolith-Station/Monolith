  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/weaver.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/weaver.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: ItemToggle
    onActivate: false
    onUse: false
    predictable: false
  - type: PersonalShield
    shield:
      maxCharge: 20
      spinupTime: 0.75
    visuals:
      color: "#ffc759"
      scale: 2
  - type: ShieldLinkSource
    linkId: MAWC
    shieldBonusPerLink: 20
  - type: ShieldLinkReceiver
    linkId: MAWC
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitMAWCWeaver
