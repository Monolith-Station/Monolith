- type: entity
  parent: [ClothingOuterHardsuitBase, MonoEnergyShieldClothing]
  id: ClothingOuterHardsuitMAWCWidowmaker
  name: M-WC E-767 Widowmaker hardsuit
  description: A Corporate warfare suit designed with support in mind. Designed with a specialty shield generation and projection system, when paired with nearby compatible reciever suits it grows stronger than before. Fitted with a boatload of heavy sensors on the head too, for information, or just overcompensation. Tailored to the specifics of field officers for maximum battlefield control.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/widowmaker.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/widowmaker.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.55
        Heat: 0.55
        Radiation: 0.6
        Caustic: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: PersonalShield
    shield:
      maxCharge: 65
      spinupTime: 2
    visuals:
      color: "#ffc759"
      brightness: 1.15
      pixelGrid: 128
      hexDensity: 3
      scale: 2.5
      coreFade: 0.65
      fillLevel: 0.22
      lineLevel: 0.75
      rimLevel: 1
      alphaBands: 4
      breathDepth: 0.04
      shardScale: 3
  - type: ShieldLinkSource
    linkId: MAWC
    shieldBonusPerLink: 35
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: ItemToggle
    predictable: false
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitMAWCWidowmaker
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitMAWCWeaver
  name: M-WC CS-8W Weaver hardsuit
  description: The corporation's ideal corporate warfare suit. Packed with sensors and electronic doodads, this suit projects a protective shield around itself which grows in power with access to supply suits. Seemingly a modernization of the termite, and a serious step up in protection, developed following specific needs after an unlabeled planetary disaster to upgrade archaic models for frontline soldiers.
