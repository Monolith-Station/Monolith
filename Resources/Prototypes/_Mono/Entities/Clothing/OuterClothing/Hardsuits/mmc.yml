- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitMieyoMining
  name: MMC mining suit
  description: A basic EVA suit for MMC employees and non-combat use.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/mmc_mining.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/mmc_mining.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.4
        Piercing: 0.8
        Heat: 0.8
        Radiation: 0.4
        Caustic: 0.4
        Poison: 0.4
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitMieyoMining
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaminaDamageResistance
    coefficient: 0.4
  - type: FireProtection
    reduction: 0.7

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitMieyoCombat
  name: MMC kurogane tacsuit
  description: A tactical combat suit for MMC asset protection & corporate security. It's very light, but not too defensive.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/mmc_combat.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/mmc_combat.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.55
        Heat: 0.7
        Radiation: 0.8
        Caustic: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitMieyoCombat
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: PirateBountyItem
    id: ClothingOuterHardsuitTacsuit
  - type: StaminaDamageResistance
    coefficient: 0.2
  - type: FireProtection
    reduction: 0.7
