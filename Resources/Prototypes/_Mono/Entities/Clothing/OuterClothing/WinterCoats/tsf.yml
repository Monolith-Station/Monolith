- type: entity
  parent: [ClothingOuterArmorHoS, ClothingOuterWinterCoatToggleable]
  id: ClothingOuterWinterTSF
  name: TSF Armored Winter Coat
  description: A thick durathread coat with an armor vest sewn into its chest, provides protection from the elements and combat. This one has the ranking of a TSF worker.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/WinterCoats/wintertsf.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/WinterCoats/wintertsf.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHatHoodWinterTSF
  - type: StaticPrice
    price: 0
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.7
        Piercing: 0.35
        Heat: 0.75
        Caustic: 0.9
  - type: Tag
    tags:
    - Kevlar
  - type: StaminaDamageResistance
    coefficient: 0.65
  - type: ClothingSpeedModifier
    sprintModifier: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.80

- type: entity
  parent: ClothingOuterWinterTSF
  id: ClothingOuterWinterTSFColonel
  name: Colonel's Armored Winter Coat
  description: A thick winter coat for the Colonel, made from the silk of darwin bark spiders to provide a flexible cloth thats ten times stronger than kevlar, this is accompanied by a plastitium alloy plate.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/WinterCoats/wintertsfcolonel.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/WinterCoats/wintertsfcolonel.rsi
  - type: Armor
    modifiers:
      coefficients: #5% better than the hardsuit at armor in turn for not being spaceproof
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.40
        Radiation: 0.35
        Caustic: 0.45
  - type: StaminaDamageResistance
    coefficient: 0.35
  - type: ClothingSpeedModifier
    sprintModifier: 1
  - type: FireProtection # Mono
    reduction: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.3

