# DME
- type: entity
  parent: NFClothingOuterEVASuitBase
  id: ClothingOuterEVASuitDME
  name: DME EVA Suit
  description: An EVA suit with a built-in helmet commonly issued to wealthy traders.
  components:
  - type: Sprite
    sprite: _NF/Clothing/OuterClothing/Suits/eva_color.rsi
    layers:
    - state: icon-base
      color: "#403642"
    - state: icon-decals-01
      color: "#be42c9"
    - state: icon-reinforced-points
      color: "#75122e"
    - state: icon-breathing-gear
    - state: icon-unshaded
      shader: unshaded
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        color: "#403642"
      - state: inhand-left-decals-01
        color: "#be42c9"
      - state: inhand-left-reinforced-points
        color: "#75122e"
      - state: inhand-left-breathing-gear
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-base
        color: "#403642"
      - state: inhand-right-decals-01
        color: "#be42c9"
      - state: inhand-right-reinforced-points
        color: "#75122e"
      - state: inhand-right-breathing-gear
      - state: inhand-right-unshaded
        shader: unshaded
  - type: Clothing
    sprite: _NF/Clothing/OuterClothing/Suits/eva_color.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-base
        color: "#403642"
      - state: equipped-decals-01
        color: "#be42c9"
      - state: equipped-reinforced-points
        color: "#75122e"
      - state: equipped-breathing-gear
      - state: equipped-unshaded
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients: # Mono
        Caustic: 0.75
  - type: ToggleableClothing
    clothingPrototypes:
      head:  ClothingHeadEVAHelmetDME

# TSF
- type: entity
  parent: NFClothingOuterEVASuitBase
  id: ClothingOuterVoidsuitTSFColonel
  name: Colonel's Ceramonal Voidsuit
  description: A highly advanced voidsuit made to look like a ceremonial outfit of the Colonel, features a state-of-the-art force field projector around the neck not just letting you show your face but it can also visually transform into a wide range of helmets or hats.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Suits/colonel.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Suits/colonel.rsi
  - type: Armor
    modifiers:
      coefficients: #Most protections are 10% worse than the hardsuit, lose some protection for the drip
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Shock: 0.8
        Heat: 0.6
        Radiation: 0.5
        Caustic: 0.6
  - type: PressureProtection
    highPressureMultiplier: 0.03
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetVoidsuitColonel
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaminaDamageResistance
    coefficient: 0.4
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Magboots
