#Before changing anything, it helps to read the summaries describing what each field does at Content.Shared/_Mono/ArmorPlate/ArmorPlateItemComponent.cs

#Shared repair stat base
- type: entity
  id: ArmorPlateRepairableBase
  name: armor repairable base
  abstract: true
  components:
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 7
    qualities:
    - Applicating

#Blunt/Slash
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlateBlunt_Slash
  name: trauma armor plate
  description: A slashproof plasteel plate backed with crumpling plastic foam-cells. Reduces blunt and slash damage, but useless against heat and piercing.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: blunt_slash
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 150
    walkSpeedModifier: 0.90
    sprintSpeedModifier: 0.90
    staminaDamageMultipliers:
      Absorbed: 0.5
    damageToPlate:
      Blunt: 1
      Slash: 1
      Piercing: 1
      Heat: 1
    absorptionRatios:
      Blunt: 1
      Slash: 1
      Piercing: 0
      Heat: 0
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Pierce
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlatePierce
  name: ballistic armor plate
  description: A robust slab of homogenous high-grain plastitanium. Stops piercing damage dead in its tracks, but spoils under heat.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: pierce
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 150
    walkSpeedModifier: 0.90
    sprintSpeedModifier: 0.90
    staminaDamageMultipliers:
      Absorbed: 0.5
    damageToPlate:
      Piercing: 1
      Heat: 1.5
    absorptionRatios:
      Piercing: 1
      Heat: 0
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
