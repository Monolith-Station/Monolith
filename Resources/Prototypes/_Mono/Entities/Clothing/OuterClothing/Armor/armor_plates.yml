# Blunt and Slash
#READ THIS BEFORE EDITING THE ABSORPTION RATIOS
# The maths for how the damage is calculated is "damage - [Multiplyer*damage]" so if the value is set to over 1, it removes all damage but if its set to a negative it adds damage
# e.g. heat plate before fix: 24-[24*1.2] = 24-26.4 = -2.4 (which does no damage)
# after fix it would be: 24-[24*-0.2] = 24+2.4 = 26.4 (which does more damage)
- type: entity
  parent: BaseItem
  id: ArmorPlateBlunt_Slash
  name: blunt/slash armor plate
  description: An armor module consisting of additional protective plasteel plating and shock absorbant plastic. Protects against blunt force and slash attacks. Vulnerable to heat.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: blunt_slash
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 50
    walkSpeedModifier: 0.95
    sprintSpeedModifier: 0.95
    staminaDamageMultiplier: 1.0
    absorptionRatios:
      Blunt: 0.3
      Slash: 0.3
      Heat: -0.2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

