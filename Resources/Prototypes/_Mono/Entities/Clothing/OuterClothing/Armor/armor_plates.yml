      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Heat
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlateHeat
  name: diffusion armor plate
  description: A plate comprising a sandwich of iridite shielding and copper heat diffusers. Absorbs weapons energy-band emissions, but fails under kinetic impact.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: heat
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 150
    walkSpeedModifier: 0.90
    sprintSpeedModifier: 0.90
    staminaDamageMultipliers:
      Absorbed: 0.5
    damageToPlate:
      Piercing: 1.5
      Heat: 1
      Radiation: 0.5
      Shock: 0.5
    absorptionRatios:
      Heat: 1
      Radiation: 0.5
      Shock: 0.5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Speed
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlateSpeed
  name: speed armor plate
  description: An experimental brass-bluespace alloy plate exhibiting novel kinesthetic effects. Amplifies speed, but also oncoming kinetic and thermal impacts.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: speed
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 250
    walkSpeedModifier: 1.1
    sprintSpeedModifier: 1.1
    staminaDamageMultipliers:
      Raw: 0.5
    damageToPlate:
      Heat: 1
      Blunt: 1
      Slash: 1
      Piercing: 1
    absorptionRatios:
      Heat: -0.1
      Blunt: -0.1
      Slash: -0.1
      Piercing: -0.1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250 # Bet you wish it broke faster before it ruined your day
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
