#Blunt/Slash
- type: entity
  parent: BaseItem
  id: ArmorPlateBlunt_Slash
  name: trauma armor plate
  description: A slashproof plasteel plate backed with crumpling plastic foam-cells. Reduces blunt and slash damage, but melts and spalls under heat and piercing.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: blunt_slash
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 125
    walkSpeedModifier: 0.92
    sprintSpeedModifier: 0.92
    staminaDamageMultiplier: 0.5
    staminaDamageSource: Absorbed, Amplified
    damageToPlate:
      Blunt: 0.5
      Slash: 0.5
      Piercing: 0.15
      Heat: 0.15
    absorptionRatios:
      Blunt: 0.5
      Slash: 0.5
      Piercing: -0.15
      Heat: -0.15
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Pierce
- type: entity
  parent: BaseItem
  id: ArmorPlatePierce
  name: ballistic armor plate
  description: A robust slab of homogenous high-grain plastitanium. Stops piercing damage dead in its tracks, but is highly conductive to heat.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: pierce
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 100
    walkSpeedModifier: 0.92
    sprintSpeedModifier: 0.92
    staminaDamageMultiplier: 0.75
    staminaDamageSource: Absorbed, Amplified
    damageToPlate:
      Piercing: 1
      Heat: 0.5
    absorptionRatios:
      Piercing: 1
      Heat: -0.2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Heat
- type: entity
  parent: BaseItem
  id: ArmorPlateHeat
  name: diffusion armor plate
  description: A plate comprising a sandwich of iridite shielding and copper heat diffusers. Absorbs heat and radiation, but fails catastrophically under kinetic impact.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: heat
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 100
    walkSpeedModifier: 0.92
    sprintSpeedModifier: 0.92
    staminaDamageMultiplier: 3 # Since you're betting against a damagetype already stacked against by other countermeasures, the punishment for wrong prep is even worse
    staminaDamageSource: Amplified
    damageToPlate:
      Piercing: 0.5
      Heat: 1
      Radiation: 1
    absorptionRatios:
      Piercing: -0.2
      Heat: 1
      Radiation: 0.5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Speed
- type: entity
  parent: BaseItem
  id: ArmorPlateSpeed
  name: speed armor kit
  description: An experimental brass-bluespace alloy plate that exhibits novel kinesthetic influence. Amplifies speed, but also oncoming kinetic and thermal impacts.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: speed
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 200
    walkSpeedModifier: 1.1
    sprintSpeedModifier: 1.1
    staminaDamageMultiplier: 0.6
    staminaDamageSource: Raw
    damageToPlate:
      Heat: 1
      Blunt: 1
      Slash: 1
      Piercing: 1
    absorptionRatios:
      Heat: -0.15
      Blunt: -0.15
      Slash: -0.15
      Piercing: -0.15
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 # Bet you wish it broke faster before it ruined your day
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
