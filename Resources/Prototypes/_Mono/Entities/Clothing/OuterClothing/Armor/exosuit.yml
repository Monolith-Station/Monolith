- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing ]
  id: ClothingOuterExosuitAurora
  name: M-320X AURORA exosuit
  suffix: SelfUnremovable
  description: An experimental exosuit designed for the future of warfare. Despite not having any head covering, the utilization of new nanomachine technology allows it to protect the wearer from the pressure and cold of space.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Armor/aurora.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Armor/aurora.rsi
    stripDelay: 35
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
  - type: SelfUnremovableClothing
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55 # nanomachines are brittle
        Slash: 0.2
        Piercing: 0.6
        Heat: 0.35
        Cold: 0.35
        Shock: 0.15
        Caustic: 0.5
        Radiation: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: ClothingSpeedModifier
    walkModifier: 1.35
    sprintModifier: 1.35
  - type: StaminaDamageResistance
    coefficient: 0.1 # high shock resist, why shouldnt it block a batong?
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: FireProtection # raiden is actively lit on fire like 5 times ingame
    reduction: 0.4
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # the average lightbulb only does around four damage!
    slots: OUTERCLOTHING
  - type: HarpyHideWings # Frontier, needed for Harpies
  - type: StaticPrice
    price: 10000
    vendPrice: 150000
  - type: ClothingGrantComponent
    component:
     - type: PressureImmunity

#VICT Hardsuit
- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing, EnergyShieldClothing ]
  id: ClothingOuterHardsuitVICT
  name: VICT exosuit
  description: An improved version of the outdated CBURN Exo Suit, comes with better mobility and protection.
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02 #2%
    lowPressureMultiplier: 1000 # 100,000%
  - type: TemperatureProtection
    heatingCoefficient: 0.001 # 0.1%
    coolingCoefficient: 0.001 #0.1%
  - type: ExplosionResistance
    damageCoefficient: 0.7 # 30%
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.35 #65%
        Slash: 0.40 #60%
        Piercing: 0.35 #65%
        Heat: 0.1 #90%
        Cold: 0.5 #50%
        Shock: 0.1 #90%
        Radiation: 0.1 #90%
        Caustic: 0.1 #90%
        Poison: 0.1 #90%
  - type: ClothingSpeedModifier
    walkModifier: 1.2 # 20% faster
    sprintModifier: 1.2 # 20% faster
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.1 #90%
  - type: FireProtection # STOP FUCKING FRIENDLY FIRING
    reduction: 0.2
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetCBURN
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 250000
    vendPrice: 300000
  #- type: ClothingGrantComponent
    #component:
     #- type: PressureImmunity
# Shielding
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.1 #90%
        Slash: 0.1 #90%
        Piercing: 0.1 #90%
        Heat: 0.1 #90%
    activeBlockModifier:
      coefficients:
        Blunt: 0.1 #90%
        Slash: 0.1 #90%
        Piercing: 0.1 #90%
        Heat: 0.1 #90%
      flatReductions:
        Heat: 5
    passiveBlockFraction: 1.0
    activeBlockFraction: 1.0
    isClothing: true
  - type: Damageable
    damageContainer: Shield
  - type: Battery
    maxCharge: 50
    startingCharge: 50
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 5
  - type: RechargeableBlocking
    chargedRechargeRate: 0
    dischargedRechargeRate: 0.3 #70%
  - type: UseDelay
    delay: 5
  - type: PointLight
    enabled: false
    radius: 1.4
    energy: 2
    color: "#5e652c"

