- type: entity
  parent: NFClothingHeadHardsuitWithLightBaseNfsd
  id: ClothingHeadHelmetHardsuitM82
  name: M82 helmet
  description: The interchangeable helmet system for the majority of M82 hardsuits. Outfitted with a basic NVG system.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/m82.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/m82.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision # Gen 1 dualtube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 800 #Forge-Change 350 to 800 // это радиус обзора (максимальный радиус для ТСФ)
    viewCircleCount: 4
    viewCircleSpacing: 100 #Forge-change 280 to 100
    phosphorColor: "#4ee293" #Forge-Change #2E8B57 to #4ee293
    lightingColor: "#FFFFFFFF" #Forge-Change #FFFFFF32 to #FFFFFFFF
    amplification: 1.2 #Forge-Change 32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

