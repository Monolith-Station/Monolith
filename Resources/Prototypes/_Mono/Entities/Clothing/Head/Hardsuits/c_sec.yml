- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHelmetHardsuitCCTCMedium
  name: MP-EVA CSW-19 "Century" tacsuit helmet
  description: Heavy all-environment sealed helmet. Outfitted with basic NVD equipment.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/cctc_lstar.rsi
    state: "icon-helmet"
  - type: Icon
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/cctc_lstar.rsi
    state: "icon-helmet"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: NightVision # Gen 4 dual tube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 2
    viewCircleSpacing: 260
    phosphorColor: "#41D7D9"
    lightingColor: "#FFFFFF32"

