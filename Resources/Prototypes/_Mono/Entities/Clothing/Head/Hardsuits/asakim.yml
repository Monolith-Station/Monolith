- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons]
  id: ClothingHelmetHardsuitAsakim
  name: kasature-pattern combat harness helmet
  description: Part of an advanced pre-fracture combat harness.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/asakim.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/asakim.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 15
  - type: NightVision # Gen 4 wide-quadtube // Добавлено так как в родителе ПНВ гражданского типа (не работает!!!)
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 1000 #Forge-changed 400 to 1000
    viewCircleCount: 3 #Forge-changed 2 to 3
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#c2ffc2" # Forge-Change #00FF00 to #c2ffc2 // сам фосфорный цвет, он так же может давать пересвет
    lightingColor: "#0EFFFFFF" # Forge-Change #FFFFFF32 to #0EFFFFFF // Это главный рычаг яркости в темноте
    amplification: 1.0 #Forge-Change 32 to 1.0 // параметр Усиление влияет на то как сильно слепят источники света
  - type: ThermalVision
    pulseTime: 1
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: RadarConsole
    followEntity: true
    noRotate: true
  - type: DetectionRangeMultiplier # upgraded thermal sensors
    infraredMultiplier: 1.5
    visualMultiplier: 2
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
