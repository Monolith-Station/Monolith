- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitM86
  name: M86 helmet
  description: Modified from M82 series helmets, outfitted with night-vision equipment and refined gel-layers.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/m86.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/m86.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision # Gen 3 quadtube-wide
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 450
    viewCircleCount: 4
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#00FF00"
    lightingColor: "#FFFFFF32"
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
