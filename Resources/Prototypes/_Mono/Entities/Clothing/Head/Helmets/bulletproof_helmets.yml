- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadBPHelmetLight
  name: light ballistic helmet
  description: A light ballistic helmet to protect against small arms.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Helmets/security.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Helmets/security.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: StaticPrice
    price: 2000
    vendPrice: 5000

- type: entity
  parent: ClothingHeadHelmetBase
  id: ClothingHeadHelmetCombatPDV
  name: PD-VI STZ-H helmet
  description: Part of the STZ armor system for PD infantry. Keeps your crunchy head safe.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Helmets/pdv.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Helmets/pdv.rsi

- type: entity
  parent: ClothingHeadBPHelmetLight
  id: ClothingHeadBPHelmetMammoth
  name: light ballistic helmet
  description: A light ballistic helmet to protect against small arms.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Helmets/mammoth.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Helmets/mammoth.rsi
  - type: ClothingAutoInject
    reagents:
      PolypyryliumOligomers: 15
      Puncturase: 10
    autoInjectOnAbility: true
    autoInjectInterval: 180
