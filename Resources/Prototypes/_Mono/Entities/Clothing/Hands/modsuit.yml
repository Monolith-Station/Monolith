# Gallóglach
- type: entity
  parent: ClothingHandsBase
  id: ClothingModsuitGauntletsMercenary
  name: mercenary modsuit gauntlets
  description: The knuckle guards glow when you seal the suit...for no apparent reason. Doubles as literal Finger Guns chambered in .45, so they literally pack a punch and then some.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Clothing/Hands/Modsuits/mercenary.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ gloves ]
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-modular
    fiberColor: fibers-black
  - type: FingerprintMask
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-gauntlets
    sealDownPopup: sealable-clothing-seal-down-gauntlets
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
      gloves-resomi:
      - state: equipped-HAND-sealed-resomi
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
    projectileSpeed: 65 # Mono
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Cartridge45_magnumFMJ
    capacity: 6
    proto: Cartridge45_magnumFMJ
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

# Glóthach
- type: entity
  parent: ClothingHandsBase
  id: ClothingModsuitGauntletsIceMercenary
  name: mercenary glóthach modsuit gauntlets
  description: These mits keep your fingers warm while you put your targets on ice. An actuator in the glove when squeezed tight will trigger the shoulder mounted cryo lance.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Clothing/Hands/Modsuits/mercenaryice.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ gloves ]
