            Contractor: [ -1, -1 ]
            # Pilot: [ -1, -1 ]
            # Mercenary: [ -1, -1 ]
            Borg: [ -1, -1 ]
            StationRepresentative: [ 1, 1 ]
            #StationTrafficController: [ 2, 2 ]
            SecurityGuard: [ 3, 3 ]
            #CCServiceWorker: [ 2, 2 ]
            #NFJanitor: [ 2, 2 ]
            #MailCarrier: [ 2, 2 ]
            DirectorOfCare: [ 1, 1 ]
            MdMedic: [ -1, -1 ]
