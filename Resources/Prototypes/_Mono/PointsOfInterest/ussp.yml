- type: pointOfInterest
  id: USSPCamelot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Camelot Station'
  minimumDistance: 40000
  maximumDistance: 40001
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueUSSP, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce ]
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/camelot.yml
  addComponents:
  - type: IFF
    color: "#ccaa55"

- type: gameMap
  id: USSPCamelot
  mapName: 'Camelot Station'
  mapPath: /Maps/_Mono/POI/camelot.yml
  minPlayers: 0
  stations:
    USSPCamelot:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
        - type: VesselMusic
          ambientMusicPrototype: CamelotMusic
        - type: VesselInfo
          description: "A rickety old station now owned by a group of commie larpers, drones appear to have taken offense to their existence."
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Camelot Station'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-camelot-subtext'
          stationDescription: 'frontier-lobby-camelot-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
             USSPCommissar: [1, 1]
             USSPSergeant: [4, 4]
             USSPCorporal: [6, 6]
             USSPMedic: [4, 4]
             USSPRifleman: [-1, -1]
             Contractor: [-1, -1]
             Pilot: [0, -1]
             Mercenary: [0, -1]
          tags:
          - USSPCommand
        - type: StationDeadDrop
          maxDeadDrops: 2 # Fewer here, players start here.
