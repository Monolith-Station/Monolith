- type: pointOfInterest
  id: Hokkaido
  parent: [BasePOI, BaseRepairablePOI]
  name: 'MMC Hokkaido'
  minimumDistance: 2000
  maximumDistance: 8000
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/hokkaido.yml
  addComponents:
  - type: IFF
    color: "#EEEEEE"
    readOnly: true # mono
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: Hokkaido
  mapName: 'MMC Hokkaido'
  mapPath: /Maps/_Mono/POI/hokkaido.yml
  minPlayers: 0
  stations:
    Hokkaido:
      stationProto: RecordsFrontierOutpostCargo
      components:
        - type: StationNameSetup
          mapNameTemplate: 'MMC Hokkaido'
        - type: ExtraStationInformation
          icon: /Textures/_Mono/Interface/Misc/LateJoin/lathe.png
          stationSubtext: 'frontier-lobby-hokkaido-subtext'
          stationDescription: 'frontier-lobby-hokkaido-description'
        - type: StationJobs
          availableJobs:
            MMCLiason: [ 1, 1 ]
            MMCSecurity: [ 5, 5 ]
            MMCEmployee: [ -1, -1 ]
          tags:
          - MieyoLiason
        - type: StationDeadDropHintExempt
