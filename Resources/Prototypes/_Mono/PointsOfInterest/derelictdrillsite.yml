# Notes:
- type: pointOfInterest
  id: Mining
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Derelict Drillsite'
  minimumDistance: 1500
  maximumDistance: 2800
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/derelictdrillsite.yml
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 400
      prob: 0.0
    - maxDistance: 750
      prob: 0.3

- type: gameMap
  id: Mining
  mapName: 'Derelict Drillsite'
  mapPath: /Maps/_Mono/POI/derelictdrillsite.yml
  minPlayers: 0
  stations:
    Mining:
      stationProto: RecordsFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Derelict Drillsite'
        - type: StationDeadDrop
          maxDeadDrops: 6

