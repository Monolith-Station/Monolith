- type: gameMap
  id: CrocusJianghuiIndustrial
  mapName: Jianghui Industrial
  minPlayers: 0
  maxPlayers: 650 # Mango
  mapPath: /Maps/_Mono/Crocus/jianghui_industrial_1.yml
  stations:
    Jianghui:
      stationProto: RecordsFrontierOutpost
      components:
      - type: StationNameSetup
        mapNameTemplate: "Jianghui Industrial"
      - type: StationJobs
        availableJobs:
          CrocusDockworker: [ 0, 12 ]
          PdvInfantry: [ 0, -1 ]
          TsfInfantry: [ 0, -1 ]
      - type: ExtraStationInformation
        icon: /Textures/_Mono/Logo/icon/icon-256x256.png
        stationSubtext: 'frontier-lobby-crocus-subtext'
        stationDescription: 'frontier-lobby-crocus-description'
      - type: CEStationZLevels
        mapsBelow:
        - /Maps/_Mono/Crocus/jianghui_industrial_0.yml
        mapsAbove:
        - /Maps/_Mono/Crocus/jianghui_industrial_2.yml
        - /Maps/_Mono/Crocus/jianghui_industrial_3.yml
        - /Maps/_Mono/Crocus/jianghui_industrial_4.yml
        - /Maps/_Mono/Crocus/jianghui_industrial_5.yml
        zLevelsComponentOverrides:
        - type: MapAtmosphere
          space: False
          mixture:
            volume: 2500
            immutable: True
            temperature: 274.6 # May have to change later if it's too impossible for lizards.
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: Parallax
          parallax: bedrock
        - type: MapLight #BEFORE Light Cycle
          ambientLightColor: "#adcfd8"
        - type: LightCycle #BEFORE Sun shadow cycle!
          minLightLevel: 0.15
          initialOffset: false
        - type: SunShadowCycle
        - type: CEZLevelRoof
        - type: SunShadow
