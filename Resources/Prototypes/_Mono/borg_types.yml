#Xenoborg Cyborgs
- type: borgType
  id: xenoborgengineer
  dummyPrototype: XenoborgChassisEngineer
  extraModuleCount: 2
  moduleWhitelist:
    tags:
    - BorgModuleXenoborgBase
    - BorgModuleXenoborgEngineer
  defaultModules:
  - XenoborgModuleBasic
  - XenoborgModuleToolBasic
  - BorgModuleCable
  - XenoborgModuleDefense
  - XenoborgModuleAccessBreaker
  addComponents:
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Mono/Effects/Footsteps/borgwalk3.ogg
  inventoryTemplateId: borgShort
  spriteBodyState: xenoborg_engi
  spriteHasMindState: xenoborg_engi_l
  spriteNoMindState: xenoborg_engi_l
  spriteToggleLightState: xenoborg_engi_l
  petSuccessString: petting-success-engineer-cyborg
  petFailureString: petting-failure-engineer-cyborg

- type: borgType
  id: xenoborgheavy
  dummyPrototype: XenoborgChassisHeavy
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleXenoborgBase
    - BorgModuleXenoborgHeavy
  defaultModules:
  - XenoborgModuleBasic
  - XenoborgModuleTool
  - XenoborgModuleDefense
  - XenoborgModuleJammer
  addComponents:
  - type: MobThresholds # tankier
    thresholds:
      0: Alive
      350: Critical
      750: Dead # Same as destruction threshold. Borgs act exactly like crit when dead, except for ghosting on move
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Mono/Effects/Footsteps/borgwalk3.ogg
  - type: MovementSpeedModifier # slower
    baseWalkSpeed : 1.2
    baseSprintSpeed : 2.2
  inventoryTemplateId: borgShort
  spriteBodyState: xenoborg_heavy
  spriteHasMindState: xenoborg_heavy_l
  spriteNoMindState: xenoborg_heavy_l
  spriteToggleLightState: xenoborg_heavy_l
  petSuccessString: petting-success-engineer-cyborg
  petFailureString: petting-failure-engineer-cyborg

