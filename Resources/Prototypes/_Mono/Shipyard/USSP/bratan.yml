# Author notes: Adapted from Ratgore's Harrier. https://github.com/ss14-art/ratgore/blob/master/Resources/Prototypes/_Crescent/Maps/Ships/NCSP/harrier.yml . Creator's github tag might be Ilikeships?

- type: vessel
  id: Bratan
  parent: BaseVessel
  name: GS Bratan
  description: The GS QJ-799/A Bratan is a long range patrol craft whose blueprints were supposedly won at a poker game and was adapted for Naval Infantry use. Comes with an AK-800 and two AK-570s
  price: 90000 # appraised at 71K + 25%~
  minPriceMarkup: 0.1 # Manually confirmed price.
  category: Small
  group: Ussp
  access: USSP
  shuttlePath: /SharedMaps/_Mono/Shuttles/CSec/pegasus.yml
  guidebookPage: Null
  class:
  - Patrol
  - Escort
  engine:
  - Uranium

- type: gameMap
  id: Bratan
  mapName: 'Bratan'
  mapPath: /SharedMaps/_Mono/Shuttles/CSec/pegasus.yml
  minPlayers: 0
  stations:
    Bratan:
      stationProto: StandardFrontierVessel
      gridComponents:
      - type: GridModifier
        modifications:
        - Bratan
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Bratan USSP{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          USSPSergeant: [ 0, 0 ]
          USSPRifleman: [ 0, 0 ]

