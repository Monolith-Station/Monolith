- type: vessel
  id: Mock
  parent: BaseVessel
  # Andromeda start: Localize ship name and desc
  name: vessel-Mock-name
  description: vessel-Mock-desc
  # Andromeda end
  limit: 4
  price: 22618
  purchasable: false #voucher only
  category: Small
  group: Custom
  mapchecker_group_override: Shipyard  # Treat this as a Shipyard vessel for mapchecker purposes
  shuttlePath: /SharedMaps/_Mono/Shuttles/Carrier/mock.yml
