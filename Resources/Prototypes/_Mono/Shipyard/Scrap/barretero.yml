- type: vessel
  id: Barretero
  parent: BaseVessel
  name: RSC-Barretero
  description: The Barretero wasn't always a rig fitted for the art of piracy. Its humble origins lay in the dusty, metallic rings of the system that Vivaldi occupies. The design mimicked nature, much like blue whales skim thousands of liters of ocean water to filter out nutritious krill, the Barretero's original design on Theseus shipyard followed a similar principle, breaking apart massive asteroids and scooping up the valuable minerals. It allowed the shipyard to bridge the gaps in resources that they can't get from simple salvage, and quickly so. 
