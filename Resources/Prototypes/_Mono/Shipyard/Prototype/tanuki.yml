- type: vessel
  id: Tanuki
  parent: BaseVessel
  name: MI-COR Tanuki
  description: A militarised cargo shuttle initially designed and produced by Militia Ironworks featuring an easily modifiable cargo bay and heavy-duty armor. It was designed to be the ultimate framework (and drone hunter) for Militia and Independent operators. It carried a healthy amount of energy weapons reverse-engineered from the wrecks of TSFMC vessels, sporting 2 Prometheus Laser Cannons for long-range effective fire and 3 Cerberus Plasma Scattercannons for melting hostiles in close range. When the Trans-Solarian Federation began cracking down on the illegal use of their weaponry, all existing Tanukis were hunted down and eventually destroyed. Militia Ironworks destroyed the blueprints in order to avoid prosecution, but they likely still remain somewhere in deep space from one of the wrecks of the MI vessels.
  limit: 1
  price: 151250 # 131250 base + 20K for medical/galley.
  purchasable: false
  category: medium
  group: Prototype
  access: Mercenary
  shuttlePath: /SharedMaps/_Mono/Shuttles/tanuki.yml
  guidebookPage: Null
  class:
  - Pursuit
  engine:
  - Plasma

