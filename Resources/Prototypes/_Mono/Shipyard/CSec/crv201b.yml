#Based off of @Fleshangel(Discord)'s Archon for Ratgore

- type: vessel
  id: CRV201Ballistic
  parent: BaseVessel
  name: GS CRV-201/B 'Huginn'
  description: A relatively light corvette produced by GS for the defense market. Comes with a shield, reinforced cockpit and an elite radar. Compared to it's energy based twin, this brings a pair of BOFORs, AC-35s and 4 Dravons to work.
  price: 180000 # Appraisal was at 150K
  category: Medium
  group: Sr
  access: Caelestinus
  shuttlePath: /SharedMaps/_Mono/Shuttles/CSec/crv201.yml
  guidebookPage: Null
  class:
  - Corvette
  - EarlyWarning
  engine:
  - Plasma

- type: gameMap
  id: CRV201Ballistic
  mapName: 'CRV201/B'
  mapPath: /SharedMaps/_Mono/Shuttles/CSec/crv201.yml
  minPlayers: 0
  stations:
    CRV201Ballistic:
      stationProto: StandardFrontierVessel
      gridComponents:
      - type: GridModifier
        modifications:
        - CRV201Ballistic
      components:
      - type: StationNameSetup
        mapNameTemplate: 'HUGINN CSEC{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs: {}

- type: gridModifier
  id: CRV201Ballistic
  modifiers:
  - !type:GridModEntityReplace
    comp: Hardpoint
    data:
    - chance: 1
      toReplace: HardpointEnergyMedium
      replaceWith: HardpointBallisticMedium
    - chance: 1
      toReplace: HardpointEnergySuperlight
      replaceWith: RailingRound
    - chance: 1
      toReplace: HardpointBallisticSuperlight
      replaceWith: HardpointBallisticMedium
    - chance: 1
      toReplace: HardpointMissileSuperlight
      replaceWith: HardpointBallisticMedium
  - !type:GridModEntityReplace
    comp: Gun
    data:
    - chance: 1
      toReplace: WeaponTurretPinhole
      replaceWith: WeaponTurretDravon
    - chance: 1
      toReplace: WeaponTurretFragment
      replaceWith: Catwalk
    - chance: 1
      toReplace: WeaponTurretShard
      replaceWith: WeaponTurretDravon
    - chance: 1
      toReplace: WeaponLaserTurretPrometheus
      replaceWith: WeaponTurretAC-35
  - !type:GridModEntityReplace
    comp: FireControlServer
    data:
    - chance: 1
      toReplace: GunneryServerMedium
      replaceWith: GunneryServerHigh
