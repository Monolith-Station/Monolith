- type: job
  id: Fugitive
  name: job-name-fugitive
  description: job-description-fugitive
  playTimeTracker: JobFugitive
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10800 # 3 hours # mono
  - !type:TraitsRequirement # already a heretic by default
    inverted: true
    traits:
    - Heretic
  startingGear: FugitiveGear
  icon: JobIconFugitive
  supervisors: job-supervisors-nobody
  displayWeight: 100
  accessGroups:
  - GeneralAccess
  access:
  - Underground
  guides:
  - Underground
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  - !type:AddComponentSpecial
    components:
    - type: Contraband
      hideValues: true
      turnInValues:
        FederationMilitaryCredit: 150 # bounty on your head
    - type: RadioOnCryosleep
      radioChannel: Syndicate # Syndicate = Underground
    - type: AddComponentsAfterTime # heresy
      addComponentsOnSelection:
      - type: Contraband
        hideValues: true
        turnInValues:
          FederationMilitaryCredit: 150 # heresy
          Doubloon: 250
      - type: Heretic
  - !type:AddImplantSpecial
    implants: [ DeathRattleImplant, RadioImplant ]
  - !type:AddLanguageSpecial
    languagesSpoken:
    - UndergroundCodespeak
    languagesUnderstood:
    - UndergroundCodespeak
  alwaysUseSpawner: true

- type: startingGear
  id: FugitiveGear
  storage:
    back:
    - Telecrystal25
    - ContractorIDCard
