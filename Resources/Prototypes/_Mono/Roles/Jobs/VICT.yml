# Start base CBURN (Rifleman)
- type: job
  id: CBURN-ASSAULT
  name: job-name-vict
  description: job-description-vict
  playTimeTracker: JobCBURN
  setPreference: false
  startingGear: VICTGear
  icon: "JobIconCBURNSpecialist"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  accessGroups:
  - AllAccess
  access:
  - CentralCommand

- type: startingGear
  id: VICTGear
  equipment:
    jumpsuit: ClothingUniformCcVICT
