    suitStorage: AirTankFilled
  inhand:
    - WeaponRifleNtsfLtr # Takes 5.556x45mm or 6.8x52mm
  storage:
    back:
    - GrenadeFlashBang
    - MedkitCombatFilled
    - MedkitCombatFilled
    - ShipVoucherFrontierGuard
    - GrenadeIncendiaryNfsd
