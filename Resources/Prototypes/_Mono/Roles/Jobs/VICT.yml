    - PillCanisterMesotaxinide # Bottle of 10 15u Mesotaxinide pills
    - AmmoBox556x45mmIncendiary
    - AmmoBox556x45mmIncendiary
    - AmmoBox556x45mmIncendiary
    - AmmoBox556x45mmIncendiary
    - AmmoBox556x45mmPlasteelAP
