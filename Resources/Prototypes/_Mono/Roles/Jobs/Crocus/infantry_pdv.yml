- type: job
  id: PdvInfantry
  name: job-name-pdv-infantry
  description: job-description-pdv-infantry
  playTimeTracker: JobPDVInfantry
  requirements:
  - !type:TraitsRequirement
    inverted: true
    traits:
    # Free upgrades; Crocus has no bionics.
    - PrybarProsthetics
    - BionicLegs
  startingGear: PDVInfantryGear
  alwaysUseSpawner: true # cuz like, planets are 1 mapgrid, u cant use latejoins bro!!
  icon: JobIconPirate
  supervisors: job-supervisors-pirate
  weight: 150
  displayWeight: 5
  assignedCompany: PDV
  canBeAntag: false
  setPreference: true # just to config loadout
  accessGroups:
  - GeneralAccess
  access:
  - Pirate
  - Mercenary
  guides:
  - PDV_Entry
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - PirateNF
    # It doesn't need to be a implant, because it's not meant to be removed.
    - type: FakeMindShield # mindshield overlay is too dogshit to just use the comp
      isEnabled: true
      mindShieldStatusIcon: MindShieldIconPDV
    - type: CMVendorUser
      id: PdvInfantry
      points: 4
      extraPoints:
        CrocusPoints: 2
  - !type:AddLanguageSpecial # Monolith - Languages
    languagesSpoken:
    - Freespeak
    languagesUnderstood:
    - Freespeak

# Starts unarmed to gear up at vendor
- type: startingGear
  id: PDVInfantryGear
  equipment:
    ears: ClothingHeadsetAltFreelancer
    neck: ClothingNeckIFFOrange
  storage:
    belt:
    - RadioHandheldNF
