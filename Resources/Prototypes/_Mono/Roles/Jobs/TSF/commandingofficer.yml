- type: job
  id: TsfCommander
  name: job-name-tsf-commandingofficer
  description: job-description-tsf-commandingofficer
  playTimeTracker: JobTsfCommander
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 144000 # 40 hours - mono
    - !type:DepartmentTimeRequirement
      department: Tsf
      time: 90000 # 25 hours - mono
    - !type:RoleTimeRequirement
      role: JobTsfOfficer
      time: 18000 # 5 hours - mono
  alternateRequirementSets:
    longerPlaytimeLessSec:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 90000 # 25 hours - mono
    - !type:RoleTimeRequirement
      role: JobWarden #old tsf officer id
      time: 18000 #5 hours
  whitelisted: true
  startingGear: TsfCommanderGear
  alwaysUseSpawner: true
  icon: JobIconTSFCommander
  requireAdminNotify: true
  supervisors: job-supervisors-centcom
  weight: 180
  displayWeight: 70
  assignedCompany: TSF
  canBeAntag: false
  access:
  - TsfmcEngineering
  - TsfCommander
  - TsfOfficer
  - TsfFtl
  - TsfGeneral
  accessGroups:
  - GeneralAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - TSFMC
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
  - !type:AddLanguageSpecial # Monolith - Languages
    languagesSpoken:
    - SolCommon
    languagesUnderstood:
    - SolCommon
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift

- type: startingGear
  id: TsfCommanderGear
  equipment:
    pocket1: WeaponEnergyGunMultiphase # DeltaV gun
    pocket2: EnergySwordNfsd
  storage:
    back:
    - Multitool
    - DoorRemoteNfsd
    - BaseSecurityUplinkRadioSheriff
    - PhoneInstrumentHigh
    - RubberStampTSFColonel #Mono. Look, it had comments on the Bailiff/Captain file.
