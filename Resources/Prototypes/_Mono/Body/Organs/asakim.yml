- type: entity
  id: OrganAsakimBrain
  parent: [ OrganHumanBrain ]
  name: asakim brain
  description: A mess of flesh and silicon, veins interlaced with unknown implants and cybernetics.
  components:
  - type: Tag
    tags:
    - AsakimBrain

- type: entity
  id: OrganAsakimEyes
  parent: [ OrganHumanEyes ]
  name: asakim eyes
  description: They reflect off the darkness.
  components:
  - type: Organ
    onAdd:
    - type: NightVision # Gen 3 wide-quadtube
      relayOverlay: false
      goggleEffect: true
      viewCircleRadius: 1000 #Forge-changed 400 to 1000
      viewCircleCount: 3 #Forge-changed 2 to 3
      viewCircleSpacing: 280
      action: ActionToggleNightVision
      phosphorColor: "#c2ffc2" # Forge-Change #00FF00 to #c2ffc2 // сам фосфорный цвет, он так же может давать пересвет
      lightingColor: "#0EFFFFFF" # Forge-Change #FFFFFF32 to #0EFFFFFF // Это главный рычаг яркости в темноте
      amplification: 1.2 #Forge-Change 32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света

- type: entity
  id: OrganAsakimHeart
  parent: [ OrganAnimalHeart ]
  name: asakim heart
  description: A large heart, capable of metabolizing more chemicals at once.
  components:
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Animal ]
    groups:
    - id: Medicine
    - id: Cryogenic # Frontier
    - id: Poison
    - id: Narcotic

- type: entity
  id: OrganAsakimLungs
  parent: [ OrganHumanLungs ]
  name: asakim lungs
  description: Heavy, huge lungs, genetically engineered to assist in energizing the body's raw strength in melee.
  components:
  - type: Organ
    onAdd:
    - type: BonusMeleeDamage
      damageModifierSet:
        coefficients:
          Blunt: 1.1
          Slash: 1.1
          Piercing: 1.1
          Asphyxiation: 1
