# Anything human specific (e.g. UI, input) goes under MobHuman
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobHuman
  name: Urist McHands
  abstract: true
  components:
  - type: Hunger
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - Sign # BF14
    understands:
    - Sign # BF14
    - TauCetiBasic # BF14
  - type: HumanoidAppearance
    species: Human
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Carriable # Frontier: Carrying system from nyanotrasen.
  - type: Speech # Frontier
    allowedEmotes: ['Belch'] # Frontier
  - type: Destructible # BF14 pain screams
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GruntUSPainClean
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GruntUSHitClean
          params:
            volume: 5
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500 # BF14 welcome back ashing
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
#  - type: TriggerOnMobstateChange # BF14
#    mobState:
#    - Critical
#  - type: EmitSoundOnTrigger
#    sound:
#      collection: SadTrombone
#      params:
#        variation: 0.125
  - type: BarricadeBlock # BF14
    bidirectional: false
    omnidirectional: true
    passthroughdistance: 1
    blocking: 100
  - type: ExtendDescription # BF14
    descriptionList:
      - description: Firing a weapon within half a tile will fire over their shoulder.
        color: "#4f94ad"
        requireDetailRange: true
  - type: JumpAbility # BF14
    jumpDistance: 2.75
    jumpSound: /Audio/Effects/Footsteps/suitstep2.ogg
  - type: ActionGrant # BF14
    actions:
    - ActionGravityJump 

- type: entity
  parent: BaseSpeciesDummy
  id: MobHumanDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
