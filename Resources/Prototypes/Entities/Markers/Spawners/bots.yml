- type: entity
  name: medibot spawner
  id: SpawnMobMedibot
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: Mobs/Silicon/Bots/medibot.rsi
        state: medibot
  - type: ConditionalSpawner
    prototypes:
      - MobMedibot

