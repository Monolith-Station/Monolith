- type: entity
  name: BaseWeaponRevolver
  parent: BaseItem
  id: BaseWeaponRevolver
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
    projectileSpeed: 45 # Mono
  - type: UseDelay
    delay: 0.66
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
        - SpeedLoader357_magnumFMJ
    mayTransfer: true # Frontier
    proto: Cartridge357_magnumFMJ
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: StaticPrice
    price: 50
  - type: ItemTax # Mono
    taxAccounts:
      nfsd: 0.2
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/pistol_mouse.rsi
      state: all
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: RevolversPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RevolversDrop
  - type: EmitSoundOnLand
    sound:
      collection: RevolversDrop
  # Goobstation edit end

- type: entity
  name: Garter (.357 magnum)
  parent: BaseWeaponRevolver
  id: WeaponRevolverInspector
  description: A robust and simple revolver, still effective even in space. Uses .357 magnum ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]

- type: entity
  name: Mateba (.357 magnum)
  parent: [ BaseWeaponRevolver, BaseFactionGearTSFT1 ]
  id: WeaponRevolverMateba
  description: A legendary revolver from an era long past. Originally used by corporate kill-teams, its design has become widespread. Uses .357 magnum ammo. Slow firing, but due to enhanced components it punches like a superfreighter. Excellent for putting down problems.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Gun
    fireRate: 0.5
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/bigshot.ogg
    damageModifier: 3

- type: entity
  parent: WeaponRevolverMateba
  id: WeaponRevolverMatebaAP # For deathsquad
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    proto: Cartridge357_magnumAP

- type: entity
  name: LWC Python (.357 magnum)
  parent: [ BaseWeaponRevolver, BaseFactionGearPDVT1 ]
  id: WeaponRevolverPython
  description: A rugged, advanced .357 magnum revolver design that has stood the test of time. It has recieved an upgrade allowing for a double-tap burst firing pattern.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Gun
    selectedMode: Burst
    fireRate: 2
    burstCooldown: 0.2
    burstFireRate: 10
    shotsPerBurst: 2
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/python_fire.ogg
      params:
        volume: 2.25
    damageModifier: 0.8
  - type: StaticPrice
    price: 1

# Mono: Gatfruit revolver variant, little FMC worth
- type: entity
  name: LWC Python (.357 magnum)
  parent: [ BaseFactionGearPDVT1, WeaponRevolverPython ]
  id: WeaponRevolverPythonGatfruit
  suffix: Low Value
  description: A revolver that is commonly found around Phaethon Dynasty space, it's typically used by high-ranking imperials. Uses .357 magnum ammo. It seems to be made of fragile plant matter, and isn't as valuable for contraband recycling.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: StaticPrice
    price: 1

- type: entity
  parent: WeaponRevolverPython
  id: WeaponRevolverPythonAP # For the uplink.
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
        - SpeedLoader357_magnumFMJ
    proto: Cartridge357_magnumAP

