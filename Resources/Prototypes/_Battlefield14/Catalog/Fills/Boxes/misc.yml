- type: entity
  parent: BoxMagazine
  id: BoxIPOCK
  name: IPOCK
  description: Individual Point Of Capture Kit. Contains everything you need to safely capture a person for transport to a secondary location.
  components:
  - type: Storage
    grid:
    - 0,0,3,3
  - type: StorageFill
    contents:
      - id: ClothingNeckHeadphones
      - id: ClothingEyesBlindfold
      - id: Handcuffs
      - id: DrinkWaterBottleFull
      - id: Zipties
  - type: Sprite
    layers:
      - state: box_security

- type: entity
  parent: BoxMagazine
  id: BoxPinpointerUniversalNATO
  name: box of GPS trackers
  description: A box full of GPS trackers, for re-locating anything you've scanned beforehand.
  suffix: NATO
  components:
  - type: StorageFill
    contents:
      - id: PinpointerUniversalNATO
        amount: 4
  - type: Sprite
    layers:
      - state: box_security

