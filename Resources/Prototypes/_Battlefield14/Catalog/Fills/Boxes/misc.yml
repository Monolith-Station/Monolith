    grid:
    - 0,0,3,3
  - type: StorageFill
    contents:
      - id: EncryptionKeyBravo
        amount: 4
      - id: ClothingNeckIFFtapeYellow
        amount: 4
  - type: Sprite
    layers:
      - state: box_security

- type: entity
