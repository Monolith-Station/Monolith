- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltUS
  name: US over-ear headset
  components:
    - type: Headset
    - type: EncryptionKeyHolder
      keySlots: 5
    - type: ContainerFill
      containers:
        key_slots:
          - EncryptionKeyUS
          - EncryptionKeyCommon
