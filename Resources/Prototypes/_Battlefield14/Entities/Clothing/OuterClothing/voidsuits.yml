- type: entity
  parent: [ ClothingOuterHardsuitBase , BaseIntegratedManeuveringThrusters , ClothingArmorPlateMedium ]
  id: BaseClothingOuterVoidsuitCombat
  abstract: true
  components:
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - FitsInVoidsuitKit
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Shock: 0.5
        Caustic: 0.5
        Radiation: 0.3
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: StaminaDamageResistance
    coefficient: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.85
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetVoidsuitAmericanCombatMarine
      helmetcover: ClothingHeadHelmetCoverBlock
  - type: StaticPrice
    price: 4500

