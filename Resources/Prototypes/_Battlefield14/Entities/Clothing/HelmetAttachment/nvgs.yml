- type: entity
  parent: ClothingHelmetAttachmentBase
  id: ClothingHelmetAttachmentNVGsBasicPACT
  suffix: PACT
  name: Dedal-S750R biocular night vision goggles
  description: 3rd generation bioculars made from commercial manufacture for mass mobilised soldiers.
  components:
  - type: Sprite
    sprite: _Battlefield14/Clothing/HelmetAttachment/nvg.rsi
  - type: Clothing
    sprite: _Mono/Clothing/HelmetAttachment/basic_optoelectronics_nvgs.rsi
    clothingVisuals:
      helmetattachment:
      - state: equipped-HELMETATTACHMENT
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 450
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
  - type: IdentityBlocker
    coverage: EYES

