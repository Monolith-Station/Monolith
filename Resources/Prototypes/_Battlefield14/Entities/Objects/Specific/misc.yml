- type: entity
  parent: BasePetRock
  id: RockOrSomething
  name: rock or something
  description: i guess you could toss it at someone?
  components:
  - type: Sprite
    sprite: _NF/Objects/Fun/petrock.rsi
    layers:
    - state: rock

- type: entity
  parent: BaseItem
  id: JustFuckingDirt
  name: dirt
  description: i guess you could toss it at someone?
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    layers:
    - state: ash
      color: "#635231"
  - type: Tag
    tags:
    - SandbagFillable

- type: entity
  parent: [BaseItem, RecyclableItemClothSmall]
  name: lit rag
  id: RagItemLit
  description: It's on fire!.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/rag.rsi
    layers:
    - state: fire
      sprite: Effects/fire.rsi
    - state: rag
  - type: Appearance
  - type: Item
    size: Small
    sprite: Objects/Specific/Janitorial/rag.rsi
  - type: PointLight
    enabled: true
    netsync: false
    radius: 1.5
    color: orange
  - type: IgnitionSource
    ignited: true
  - type: ActiveTimerTrigger
    timeRemaining: 5
  - type: DeleteOnTrigger
