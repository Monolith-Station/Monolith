#region Base
- type: entity
  parent: BaseItem
  name: autoinjector
  description: A mechanical, single use syringe.
  id: BF14AutoInjectorBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/injector.rsi
    layers:
    - state: injector
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
  - type: ExaminableSolution
    solution: pen
  - type: Hypospray
    solutionName: pen
    transferAmount: 15
    onlyAffectsMobs: false
    injectOnly: true
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: injector_e
  - type: UseDelay
    delay: 0.2
  - type: Appearance
  - type: TrashOnSolutionEmpty
    solution: pen

- type: entity
  parent: BF14SyretteCappedBase
  id: BF14AutoInjectorCappedBase
  name: autoinjector
  description: A mechanical, single use syringe. This one has a cap on it.
  abstract: true
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/injector.rsi
    layers:
    - state: injector
    - state: cap_red
  - type: SpawnItemsOnUse
    items:
    - id: BF14SyretteCapRed
    - id: BF14SyretteInaprovaline
    sound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
      params:
        variation: 0.125
  - type: Item
    size: Small
  - type: ExtendDescription
    descriptionList:
      - description: Use in hand to remove cap.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  parent: BF14SyretteCapBase
  id: BF14AutoInjectorCapBase
  name: autoinjector cap
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/injector.rsi
    layers:
    - state: cap_red

