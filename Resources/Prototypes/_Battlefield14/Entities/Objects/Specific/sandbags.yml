#region base
- type: entity
  parent: BaseItem
  id: SandbagEmpty
  name: sandbags
  description: It's a burlap bag to hold sand or dirt.
  suffix: Empty
  components:
  - type: Item
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    inhandVisuals:
      left:
      - state: stack-inhand-left
      right:
      - state: stack-inhand-right
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    layers:
    - state: sandbag_stack
    size: Normal
#  - type: Stack
#    stackType: SandbagEmpty
#    count: 1
  - type: Construction
    graph: FillSandbag
    node: start
    deconstructionTarget: start

- type: entity
  parent: SandbagEmpty
  id: SandbagFull
  name: sandbags
  description: Full sandbags, can be used to create highly bullet-resistant barricades.
  suffix: Full
  components:
  - type: Item
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    inhandVisuals:
      left:
      - state: pile-inhand-left
      right:
      - state: pile-inhand-right
    size: Large
  - type: Sprite
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    layers:
    - state: sandbag_pile
  - type: Stack
    stackType: SandbagFull
    count: 1

