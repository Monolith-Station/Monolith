- type: entity
  id: SupplyBoxMedical
  parent: BaseItem
  name: medical supply bag
  description: Heres your medkit.
  suffix: Standard
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Misc/medbox.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
  - type: Storage
    grid:
    - 0,0,5,3
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    whitelist: # BF14
      tags:
        - Bottle
        - Spray
        - Brutepack
        - Bloodpack
        - Gauze
        - Ointment
        - CigPack
        - PillCanister
        - Radio
        - DiscreteHealthAnalyzer
        - SurgeryTool
        - Dropper
        - GlassBeaker
        - Tourniquet
        - Packet
        - GasTank
        - Syrette
        - MedicationBox
        - BlisterPack
        - BoxCardboard
        - LimbTreatmentKit
      components:
        - Hypospray
        - Injector
        - Pill
        - HandLabeler
        - SurgeryTool
        - BreathMask
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0

- type: entity
