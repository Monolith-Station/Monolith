- type: entity
  parent: BaseItem
  id: Boombox
  name: boombox
  description: A handheld machine capable of playing a wide variety of tunes. Enjoyment not guaranteed.
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    state: old-radio
  - type: Jukebox
    onState: old-radio
    offState: old-radio
    selectState: old-radio
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - suitStorage
    - SUITSTORAGE2
  - type: StaticPrice
    price: 200
  - type: ActivatableUI
    key: enum.JukeboxUiKey.Key
  - type: UserInterface
    interfaces:
       enum.JukeboxUiKey.Key:
         type: JukeboxBoundUserInterface
  - type: ExtendDescription
    descriptionList:
      - description: This item can be worn on your auxillary suit storare slot.
        color: "#4f94ad"
        requireDetailRange: true
