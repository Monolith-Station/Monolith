#region NATO
- type: entity
  parent: BaseMagazineRifle
  id: MagazineSniperM107
  name: "M107 magazine (.50 BMG)"
  description: A 5 round magazine for the M107, made to disable engine blocks on lightly armoured vehicles.
  components:
  - type: Tag
    tags:
      - MagazineSniperM107
      - Magazine
  - type: BallisticAmmoProvider
    proto: Cartridge127mmAP
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge127mmAP
    capacity: 5
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Sniper/M107.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

