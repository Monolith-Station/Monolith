- type: entity
  parent: MagazineBox762x51Big
  id: MagazineBox9x19mmBig
  name: bulk ammunition box (9x19mm)
  components:
  - type: BallisticAmmoProvider
    capacity: 300 # uhh 9 > 5.56? It's fine its like half as long lol
    proto: BF_CartridgePistol9x19
    whitelist:
      tags:
        - BF_CartridgePistol9x19
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/9x19mm.rsi
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: magb
    steps: 4
    zeroVisible: false
  - type: Item
    size: Large
    shape:
      - 0,0,2,1 # 3 wide, basically 3 magazines wide
  - type: Appearance

