## NATO
#region US

- type: entity
  name: MP5
  parent: BaseWeaponSubMachineGun
  id: WeaponSubmachinegunUSMP5
  description: Feather-light recoil, swag, and a high rate of fire; everything you need in a submachine gun, except for a massive flashlight mounted on top.
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/SMGs/MP5.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/SMGs/MP5.rsi
    clothingVisuals:
      suitstorage2:
      - state: equipped-BACKPACK
  - type: Gun
    minAngle: 0
    maxAngle: 10
    fireRate: 8
    angleIncrease: 1.5
    angleDecay: 15
    projectileSpeed: 35 # pistol caliber
    availableModes:
    - SemiAuto
    - Burst
    selectedMode: Burst
    burstCooldown: 0
    shotsPerBurst: 5
    soundGunshot:
      collection: BF_MP5_Gunshots
      params:
        volume: -5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_rack.ogg
      params:
        volume: -3
    soundBoltClosed:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_slap.ogg
      params:
        volume: -3
    soundBoltOpened:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_chlock.ogg
      params:
        volume: -3
        variation: 0.125
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineSubmachinegunMP5
        insertSound: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_magin.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolMP5
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF_CartridgePistol9x19
        priority: 1
        whitelist:
          tags:
            - BF_CartridgePistol9x19
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

