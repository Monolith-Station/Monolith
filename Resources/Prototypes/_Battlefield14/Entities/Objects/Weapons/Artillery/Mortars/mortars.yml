#region NATO

- type: entity
  id: MortarNATOUS81mmM252
  parent: BaseStructure # no moving once placed, disassemble with wrench
  name: M252 81mm mortar
  suffix: 81mm
  description: An 81mm battalion mortar. It offers a fairly moderate rate of fire, tolerable accuracy, and fires a wide variety of relatively inexpensive ammunition. Dont shoot straight up.
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: _VXS14/Structures/mortar.rsi
    state: mortar
  - type: Mortar
    baseAccuracy: 1.6
    accuracyDegradation: 0.02
    maxSpread: 10
    minOffsetX: -100
    maxOffsetX: 100
    minOffsetY: -100
    maxOffsetY: 100
    minSafeDistance: 15
  - type: ContainerContainer
    containers:
      mortar_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      mortar_chamber:
        name: Chamber
        priority: 1
        insertSound: null
        whitelist:
          tags:
            - ShellMortar81M252
  - type: Construction
    graph: MortarNATOUS81mmM252
    node: MortarM252Deployed
    deconstructionTarget: start
  - type: DisassembleOnAltVerb
    prototype: MortarNATOUS81mmM252Assembly
    doAfter: 3
  - type: ExtendDescription
    descriptionList:
      - description: Maximum range 100 meters.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  parent: BaseItem
  id: MortarNATOUS81mmM252Assembly
  name: M252 81mm mortar assembly
  description: A folded up mortar, assemble with a wrench.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Objects/Devices/flatpack.rsi
    layers:
    - state: base
    - state: overlay
      color: "#cec8ac"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: Appearance
    price: 250
  - type: Rotatable
  - type: Construction
    graph: MortarNATOUS81mmM252
    node: MortarM252Assembly
    deconstructionTarget: start
  - type: SpawnAfterInteract
    prototype: MortarNATOUS81mmM252
    doAfter: 3
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: Click a tile to place in the world.
        color: "#4f94ad"
        requireDetailRange: true

