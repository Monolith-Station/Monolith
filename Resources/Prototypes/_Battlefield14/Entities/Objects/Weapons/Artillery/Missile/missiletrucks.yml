    slots:
      mortar_chamber:
        name: Chamber
        priority: 1
        insertSound: /Audio/_Battlefield14/Weapons/BattlefieldArtillery/reload2.ogg
        whitelist:
          tags:
            - ShellMissileIskander
  - type: ExtendDescription
    descriptionList:
      - description: Minimum range 50 meters, maximum range 300 meters.
        color: "#4f94ad"
        requireDetailRange: true
