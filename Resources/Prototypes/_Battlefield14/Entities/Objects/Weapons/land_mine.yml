- type: entity
  name: PFM-1
  description: An anti-personnel mine, based off the german bouncing betty. Shares a designation with the rifle you're holding in your hands.
  parent: BaseLandMine
  id: LandMinePFM1
  suffix: Armed, Placed
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _Battlefield14/Objects/Weapons/Landmines/PFM1.rsi
    state: base
  - type: Physics
    bodyType: Dynamic
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: HandGrenade
    maxIntensity: 5
    intensitySlope: 3
    totalIntensity: 25
    canCreateVacuum: false
  - type: StepTrigger
    requiredTriggeredSpeed: 2.5 # lets you crawl but not walk over it
    stepOn: false
