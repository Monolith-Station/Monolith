- type: entity
  name: TM-62
  description: FUCK CQB, SLAVIC USE TM-62.
  parent: BaseLandMine
  id: LandMineTM62
  suffix: Armed, Placed
  components:
#  - type: Item # Lets you pick it up and toss it, but also detonates instantly when it touches any entity
#    size: Large
  - type: Sprite
    drawdepth: Items
    sprite: _Battlefield14/Objects/Weapons/Landmines/TM62.rsi
    state: icon
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120 # about a 4-5 tile radius
    canCreateVacuum: true
  - type: StepTrigger
    requiredTriggeredSpeed: 2.5 # lets you crawl but not walk over it
#    stepOn: false
#  - type: DamageOtherOnHit # Only for if you can pick it up
#    damage:
#      types:
#        Blunt: 12
#    soundHit:
#      collection: MetalThud
#    staminaCost: 60
#  - type: Tool
#    qualities:
#    - Hammering # hammering shit with a fucking anti-tank mine lololol unknown technology blyat
#    useSound:
#      path: /Audio/Items/wirecutter.ogg # placeholder
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger
  - type: Construction
    graph: TM62Disarm
    node: start
    deconstructionTarget: start
  - type: ExtendDescription
    descriptionList:
      - description: It is ARMED. Use a multitool to disarm, or use the context menu to link it to a device.
        color: red
        requireDetailRange: true

- type: entity
  parent: BaseItem
  id: TM62Item
  name: TM-62
  description: FUCK CQB, SLAVIC USE TM-62.
  suffix: Disarmed, Placeable
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _Battlefield14/Objects/Weapons/Landmines/TM62.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SpawnAfterInteract
    prototype: LandMineTM62
    doAfter: 3
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: It is disarmed, left click on a tile to place and arm it.
        color: green
        requireDetailRange: true

