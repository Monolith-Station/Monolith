# longer times due to large map size

- type: entity
  id: CapturePointInterchangeDorms
  parent: BaseCapturePoint
  name: Parking lot control point
  suffix: Interchange, 240s / 4m
  components:
  - type: POICapture
    poiName: "Inside parking lot"
    timeToCapture: 240
  - type: NavMapBeacon
    defaultText: "Inside parking lot"
    color: "#FFFF00"
  - type: WarpPoint
    location: "Inside parking"

