# Base capture point
- type: entity
  id: BaseCapturePoint
  name: capture point
  description: A strategic location that can be captured and controlled by factions.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Civ14/Objects/obj32x64.rsi
    layers:
      - state: fob_flipped
        offset: 0, 0.5
        map: [ "enum.DamageStateVisualLayers.Base" ]
    drawdepth: OverMobs
    noRot: true
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        fob: ""
        fob_flipped: ""
  - type: Appearance
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - TableLayer
        - LowImpassable
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 2.5
    color: "#43a20d"
    netsync: false
  - type: SpamEmitSound
    minInterval: 30
    maxInterval: 60
    sound:
      path: /Audio/_HaloSSE/Ambience/signal.ogg
      params:
        volume: -6
        maxDistance: 5
  - type: NavMapBeacon
    defaultText: objective-beacon-general
    color: "#FFFF00"
  - type: POICapture
    poiName: "Control Point Alpha"
    timeToCapture: 60 # 1 minute to capture
    gracePeriod: 0
    doAfterDelay: 3
    controllingFaction: null
    isBeingCaptured: false
    capturingFaction: null
    currentCaptureProgress: 0
  - type: WarpPoint
    location: "capture point"

- type: entity
  parent: BaseCapturePoint
  id: BaseCapturePointGracePeriod600
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: POICapture
    gracePeriod: 600 # 10 minutes until open

# Specific Control points for map locations | these ones listed are all for stations
- type: entity
  id: CapturePointEngineering
  parent: BaseCapturePointGracePeriod600
  name: engineering control point
  suffix: 120s / 2m
  components:
  - type: POICapture
