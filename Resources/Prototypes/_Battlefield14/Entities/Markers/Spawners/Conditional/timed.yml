#region All

- type: entity
  name: TDM Timed spawner, Pistol
  id: BF14TimedSpawnerWeaponPistol
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: blue
        - sprite: Mobs/Species/Human/parts.rsi
          state: full
        - state: ai
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - BF14WeaponCaseShortUSM1911
        - BF14WeaponCaseShortDEUSP9
        - BF14WeaponCaseShortDEUSPMatch
        - BF14WeaponCaseShortDEUSP45
        - BF14WeaponCaseShortBEFiveSeven
        - BF14WeaponCaseShortRUSR1MP
        - BF14WeaponCaseShortRUTT33
      chance: 1
      intervalSeconds: 60
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1

