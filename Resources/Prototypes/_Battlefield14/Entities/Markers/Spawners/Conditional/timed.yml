#region All

- type: entity
  name: TDM Timed spawner, Pistol
  id: BF14TimedSpawnerWeaponPistol
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: blue
        - sprite: Mobs/Species/Human/parts.rsi
          state: full
        - state: ai
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - WeaponCaseShortUSM1911
        - WeaponCaseShortDEUSP9
        - WeaponCaseShortDEUSPMatch
        - WeaponCaseShortDEUSP45
        - WeaponCaseShortFiveSeven
        - WeaponCaseShortSR1MP
        - WeaponCaseShortRUTT33
      chance: 1
      intervalSeconds: 60
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1

