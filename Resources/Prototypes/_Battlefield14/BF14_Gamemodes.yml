- type: gamePreset
  id: BF14_TeamDeathMatch
  alias:
    - teamdeathmatch
    - tdm
  name: Team DeathMatch
  description: Match to the death with your team.
  maxPlayers: 10
  showInVote: true
  supportedMaps: BF14MapPoolTDM
  rules:
    - TeamDeathMatch

- type: entity
  id: TeamDeathMatch
  parent: BaseGameRule
  components:
  - type: KillCalloutRule
  - type: PointManager
  - type: RespawnDeadRule
    alwaysRespawnDead: true
  - type: RespawnTracker
    respawnDelay: 5
    deleteBody: true
  - type: MaxTimeRestartRule
    roundMaxTime: 600 # 10 minutes
    roundEndDelay: 30 # 30 seconds
