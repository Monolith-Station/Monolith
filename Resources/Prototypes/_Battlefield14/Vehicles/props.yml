- type: entity
  parent: BaseStructure
  id: BF14VehicleHMMWVProp
  name: HMMWV
  description: High Mobility Multipurpose Wheeled Vehicle, the famous humvee.
  suffix: humvee
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Battlefield14/Structures/Vehicles/humvee.rsi
    state: vehicle
#    drawdepth: OverMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-1.2,0.8,1.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: BF_ArmouredCar
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          BF14VehicleHMMWVPropDestroyed:
            min: 1
            max: 1
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Appearance

- type: entity
  parent: BF14VehicleHMMWVProp
  id: BF14VehicleHMMWVPropDestroyed
  name: destroyed HMMWV
  description: High Mobility Multipurpose Wheeled Vehicle, the famous humvee.
  suffix: humvee
  components:
  - type: Sprite
    sprite: _Battlefield14/Structures/Vehicles/humvee.rsi
    layers:
    - state: vehicle
    - state: destroyed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
