#region machines

- type: entity
  parent: [ ColMarTechBase , CMVendSharedWarVendorMedicalInventory ]
  id: CMVendSharedWarVendorMedical
  name: medical war vendor
  description: Please sir, may I have a little more?
  suffix: ColMarTech
  components:
  - type: Sprite
    sprite: _Battlefield14/Structures/armoury.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
#      shader: unshaded
#    - state: panel
#      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["NATOMedical"],["PACTMedical"]]

- type: entity
  parent: [ BaseItem , CMVendSharedWarVendorMedicalInventory ]
  id: CMVendSharedWarVendorMedicalTablet
  name: medical war vendor tablet
  description: Please sir, may I have a little more?
  suffix: ColMarTech, DO NOT MAP
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
      - state: tablet
      - state: generic
        shader: unshaded
  - type: UserInterface
    interfaces:
      enum.CMAutomatedVendorUI.Key:
        type: CMAutomatedVendorBui
  - type: ActivatableUI
    key: enum.CMAutomatedVendorUI.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["NATOMedical"],["PACTMedical"]]
