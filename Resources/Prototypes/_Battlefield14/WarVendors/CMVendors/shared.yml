#region inventory
- type: entity
  id: CMVendSharedWarVendorMedicalInventory
  abstract: true
  components:
  - type: CMAutomatedVendor
    access:
    - "NATOMedical"
    - "PACTMedical"
    sections:
    - name: syringe case
      choices: { BF14SyringeCase: 1 }
      entries:
      - id: SyringeCaseFilledBF14
        name: syringe case (filled)
        recommended: true
    - name: pills
      choices: { BF14PersonalMedicine: 4 }
      entries:
      - id: MedicationBoxPillsMeralyne
        name: meralyne pills
        recommended: true
      - id: MedicationBoxPillsDermaline
        name: dermaline pills
        recommended: true
      - id: MedicationBoxPillsBicaridine
        name: bicaridine pills
      - id: MedicationBoxPillsKelotane
        name: kelotane pills
      - id: MedicationBoxPillsTricordrazine
        name: tricordrazine pills
      - id: MedicationBoxPillsDexalin
        name: dexalin pills
      - id: MedicationBoxPillsDylovene
        name: dylovene pills
      - id: MedicationBoxPillsIron
        name: iron pills
    - name: syrettes
      choices: { BF14PersonalMedicine: 4 }
      entries:
      - id: MedicationBoxSyrettesMeralyne
        name: meralyne syrettes
        recommended: true
      - id: MedicationBoxSyrettesDermaline
        name: dermaline syrettes
        recommended: true
      - id: MedicationBoxSyrettesBicaridine
        name: bicaridine syrettes
      - id: MedicationBoxSyrettesKelotane
        name: kelotane syrettes
      - id: MedicationBoxSyrettesTricordrazine
        name: tricordrazine syrettes
      - id: MedicationBoxSyrettesInaprovaline
        name: inaprovaline syrettes
      - id: MedicationBoxSyrettesDexalin
        name: dexalin syrettes
      - id: MedicationBoxSyrettesSaline
        name: saline syrettes
      - id: MedicationBoxSyrettesEpinephrine
        name: epinephrine syrettes
      - id: MedicationBoxSyrettesHypervene
        name: hypervene syrettes
        recommended: true
      - id: MedicationBoxSyrettesNanoblood
        name: nanoblood syrettes
        recommended: true
      - id: MedicationBoxSyrettesFentanyl
        name: fentanyl syrettes
    - name: Topicals
      choices: { BF14Topicals: 2 }
      entries:
      - id: BF14AdvancedTraumaKit
      - id: AU14HemostaticGauzePacket
      - id: BF14AdvancedBurnKit
    - name: Misc
      entries:
      - id: Syringe
      - id: Tourniquet
      - id: Medkit
        name: empty medkit
    - name: Sustainment
      entries:
      - id: BoxMRE
        amount: 50
      - id: FoodSnackNutribrick
        amount: 50
      - id: DrinkMREFlask
        amount: 50
      - id: OxygenTankFilled
        amount: 50

