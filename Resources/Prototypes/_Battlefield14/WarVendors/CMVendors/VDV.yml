    - name: Weapons
      entries:
      - id: WeaponRifleRUAK12
        amount: 50
      - id: WeaponRifleRUAK203
        amount: 5
      - id: WeaponRifleRUAKS74U
        amount: 5
      - id: WeaponSubmachinegunRUVityaz
        amount: 5
      - id: WeaponPistolMP443
        amount: 2
    - name: Utility
      entries:
      - id: RiotBulletShield
        amount: 3
      - id: CombatKnife
        amount: 10
      - id: JetpackBlackFilled
        amount: 10
      - id: HandHeldMassScanner
        amount: 50
      - id: Crowbar
        amount: 50
    - name: Sustainment
      entries:
      - id: BoxMRE
        amount: 50
      - id: FoodSnackNutribrick
        amount: 50
      - id: DrinkMREFlask
        amount: 50
      - id: OxygenTankFilled
