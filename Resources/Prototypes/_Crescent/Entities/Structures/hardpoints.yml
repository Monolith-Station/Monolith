- type: entity
  id: BaseHardpoint
  name: Hardpoint
  abstract: true
  description: A point for ship weapons to anchor into a ship's various systems such as pneumatic ammo loaders or fire control systems.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Crescent/Structures/hardpoints.rsi
    state: medium
    drawdepth: HighFloorObjects
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: GravityAffected
  - type: InteractionOutline
  - type: Clickable
  - type: Transform
    noRot: false
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: RequiresGrid # Mono
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
    qualities:
    - Applicating
  - type: Appearance
  - type: Hardpoint
    class: Ballistic
    size: Medium
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        # very not dense to make it easy to pull
        density: 600
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
  - type: CollideOnAnchor
  - type: ShipRepairable
    repairTime: 15
    repairCost: 50 # Main cost is in the guns.
  - type: Pullable
  - type: Tag
    tags:
    - Structure

- type: entity
  id: HardpointDebugSuperlight
  parent: BaseHardpoint
  name: debug hardpoint superlight universal
  suffix: DO NOT MAP
  components:
  - type: Hardpoint
    class: Universal
    size: Superlight
  - type: ApcPowerReceiver
