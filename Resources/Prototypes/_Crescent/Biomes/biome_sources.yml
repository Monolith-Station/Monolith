# these are what actually decides a biome's spread.
# as of 8/1/2026, these have all been placed on top of the station anchor on Colossus Central.
# TODO: make an exped prototype & autoplace it on expeditions with a higher priority than 2k
# 0-5000: inner ring
# 5000-9500: middle ring
# 9500-18000: outer ring
# 18000+: uncharted space (fallback)

- type: entity
  id: FallbackBiomeSource
  name: fallback (uncharted space) biome source
  components:
  - type: SpaceBiomeSource
    biome: default
    swapDistance: 25000
    priority: 500

- type: entity
  id: OuterRingBiomeSource
  name: outer ring biome source
  components:
  - type: SpaceBiomeSource
    biome: outer_ring
    swapDistance: 18000
    priority: 1000

- type: entity
  id: MiddleRingBiomeSource
  name: middle ring biome source
  components:
  - type: SpaceBiomeSource
    biome: middle_ring
    swapDistance: 9500
    priority: 1500

- type: entity
  id: InnerRingBiomeSource
  name: inner ring biome source
  components:
  - type: SpaceBiomeSource
    biome: inner_ring
    swapDistance: 5000
    priority: 2000
