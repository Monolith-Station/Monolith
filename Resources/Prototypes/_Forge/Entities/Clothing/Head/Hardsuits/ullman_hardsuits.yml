- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitUllmanMedical
  name: ullman medical hardsuit helmet
  description: The medical hardsuit helmet is used by the Ullman Industries medical staff.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/ui_med_hardsuit_helm.rsi
  - type: Clothing
    sprite: Forge/Clothing/Head/Hardsuits/ui_med_hardsuit_helm.rsi
  - type: PointLight
    color: "#4e88a6"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 600 # 350 to 600 // это радиус обзора
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#c2ffc2" # #00FF00 to #c2ffc2 // сам фосфорный цвет, он так же может давать пересвет
    lightingColor: "#0EFFFFFF" # #FFFFFF32 to #0EFFFFFF // Это главный рычаг яркости в темноте
    amplification: 1.2 # 32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света

  - type: RadarConsole
    followEntity: true
    noRotate: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Special
    - FacialHair
    - Snout
    - Head
    - HeadTop
    - HeadSide
