- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitNexusMilT3
  categories: [ HideSpawnMenu ]
  suffix: Нексус
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/nexus_t3_mil_hardsuit_helm.rsi
    state: icon
  - type: Clothing
    sprite: Forge/Clothing/Head/Hardsuits/nexus_t3_mil_hardsuit_helm.rsi
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: EyeProtection
    protectionTime: 15
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 600 #Forge-change 400 to 600 // это радиус обзора
    viewCircleCount: 4
    viewCircleSpacing: 180 #Forge-change 260 to 180
    phosphorColor: "#41D7D9" #Forge-change #41D7D9 to #6bffff
    lightingColor: "#FFFFFF32" #Forge-change #FFFFFF32 to #FFFFFFFF
    amplification: 1.2 #Forge-change 32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
