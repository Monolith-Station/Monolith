- type: entity
  parent: [ ClothingHeadHardsuitBase, ShowSecurityIcons ]
  id: ClothingHeadHelmetHardsuitRenegatebsii20
  name: BSII-20 "Requiem" helmet
  description: The interchangeable helmet system for the majority of BSII-20 hardsuits.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/renegatelight.rsi
  - type: Clothing
    sprite: Forge/Clothing/Head/Hardsuits/renegatelight.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 750 #400 to 750 // это радиус обзора (максимальный радиус для ТСФ(800))
    viewCircleCount: 4
    viewCircleSpacing: 280
    phosphorColor: "#d9ff00" #Forge-change Сделал как у ДСН // Слишком темно #aa9c00 увеличено #d9ff00
    lightingColor: "#FFFFFFFF" #Forge-change Сделал как у ДСН // Слишком темно #FFFFFF32 увеличено #FFFFFFFF
    amplification: 1.2 #32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света

  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

