#region Empire
- type: entity
  parent: [ ClothingEyesGlassesMeson, ShowSecurityIcons ]
  id: ClothingEyesGlassesEmpireOperator
  name: empire operator goggles
  description: Imperial Operator visor that allows for ID card identification, rapid equipment diagnostics, and drone control within a two-kilometer radius.
  components:
  - type: Sprite
    sprite: Forge/Clothing/Eyes/Goggles/operator.rsi
  - type: Clothing
    sprite: Forge/Clothing/Eyes/Goggles/operator.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: HandheldGPS
  - type: VisionCorrection
  # Drone-control
  - type: DroneControlConsole
    maxOrderRadius: 2000
  - type: ActivatableUI
    key: enum.DroneConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DroneConsoleUiKey.Key:
        type: DroneConsoleBoundUserInterface
  - type: RadarConsole
    noRotate: true
  - type: WorldLoader
    radius: 256
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: DroneControl
  - type: WirelessNetworkConnection
    range: 100000
  - type: DeviceList
    deviceLimit: 2

#region Company
- type: entity
  parent: [ClothingEyesNightVisionGogglesForge, ShowSecurityIcons, BaseFactionGearOtherFactionT1]
  id: NFClothingEyesNightVisionGoggleTL
  name: night vision TL
  suffix: TechnicLogistic
  description: There is an incomprehensible engraving on the glasses; all I can make out is the word "Nian"
  components:
  - type: Sprite
    sprite: Forge/Clothing/Eyes/Goggles/diagnostic_nightvision_techniclogistic.rsi
  - type: Clothing
    sprite: Forge/Clothing/Eyes/Goggles/diagnostic_nightvision_techniclogistic.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: StaticPrice
    price: 600
    vendPrice: 8900
  - type: ShowHealthBars
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 600 #400 to 600 // это радиус обзора
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#ba8207" #Forge-change #ba8207 to #ffc83b
    lightingColor: "#0FFFFFFF" #Forge-change #FFFFFF32 to #0FFFFFFF
    amplification: 1.2 #32 to 1.2 // параметр Усиление влияет на то как сильно слепят источники света

