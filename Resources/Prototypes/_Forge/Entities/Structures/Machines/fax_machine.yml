#region Blue
- type: entity
  parent: FaxMachineBase
  id: FaxMachineBlue
  name: long range fax machine
  suffix: Forge, Blue
  components:
  - type: Sprite
    layers:
      - state: icon
        map: [ "base" ]
    color: "#bfe3ff"
  - type: PowerSwitch

- type: entity
  parent: FaxMachineBlue
  id: FaxMachineBlueShuttle
  name: long range fax machine
  suffix: Forge, Blue, Shuttle
  components:
  - type: FaxMachine
    useStationName: true

- type: entity
  parent: FaxMachineBlue
  id: FaxMachineBlueAdminNotify
  name: long range fax machine
  suffix: Forge, Blue, AdminNotify
  components:
  - type: FaxMachine
    notifyAdmins: true

