# Empire
- type: entity
  parent: AirlockShuttleSyndicate
  id: AirlockShuttleEmpire
  suffix: Empire, Docking
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsEmpire ]

- type: entity
  parent: AirlockGlassShuttleSyndicate
  id: AirlockGlassShuttleEmpire
