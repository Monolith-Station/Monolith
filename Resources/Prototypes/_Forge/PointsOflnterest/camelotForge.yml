- type: pointOfInterest
  id: USSPCamelot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Станция «Камелот»'
  minimumDistance: 10650
  maximumDistance: 12400
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueUSSP, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed ]
  spawnGroup: Required
  gridPath: /Maps/_Forge/POI/camelotForge.yml # Forge-change
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: ProtectedGrid
    preventTeleportation: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: USSPCamelot
  mapName: 'Станция «Камелот»'
  mapPath: /Maps/_Forge/POI/camelotForge.yml # Forge-change
  minPlayers: 0
  stations:
    USSPCamelot:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
        - type: VesselMusic
          ambientMusicPrototype: CamelotMusic
        - type: VesselInfo
          description: "Хлипкая старая станция, когда-то принадлежавшая межзвёздной державе. Холодно и темно."
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Станция «Камелот»'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-camelot-subtext'
          stationDescription: 'frontier-lobby-camelot-description'
          lobbySortOrder: 4
        # - type: StationJobs # Forge-change
        #   availableJobs:
        #     # USSPCommissar: [1, 1]
        #     # USSPSergeant: [4, 4]
        #     # USSPCorporal: [6, 6]
        #     # USSPMedic: [4, 4]
        #     # USSPRifleman: [-1, -1]
        #     # Contractor: [-1, -1] # Forge-change
        #     Pilot: [0, -1] # Forge-change
        #     Mercenary: [0, -1] # Forge-change
        #   tags:
        #   - USSPCommand
        - type: StationDeadDrop
          maxDeadDrops: 2 # Fewer here, players start here.
