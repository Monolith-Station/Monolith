# Extra-hard expedition: one hive world. Cost keeps it out of the normal columns.

- type: salvageFaction
  id: ForgeXenoCM
  desc: salvage-faction-forge-xeno
  cost: 100
  groups:
  - entries:
    - id: MobXenoCMLesserDrone
      amount: 2
      maxAmount: 3
    - id: MobXenoCMDrone
      amount: 1
      maxAmount: 2
  - entries:
    - id: MobXenoCMRunner
      amount: 2
      maxAmount: 3
    prob: 0.8
  - entries:
    - id: MobXenoCMSentinel
      amount: 1
      maxAmount: 2
    - id: MobXenoCMSpitter
      amount: 1
    prob: 0.7
  - entries:
    - id: MobXenoCMWarrior
      amount: 1
      maxAmount: 2
    - id: MobXenoCMLurker
      amount: 1
    prob: 0.55
  - entries:
    - id: MobXenoCMDefender
      amount: 1
    - id: MobXenoCMPraetorian
      amount: 1
    prob: 0.35
  - entries:
    - id: MobXenoCMRavager
      amount: 1
    - id: MobXenoCMCrusher
      amount: 1
    prob: 0.25
  - entries:
    - id: MobXenoCMBoiler
      amount: 1
    - id: MobXenoCMHivelord
      amount: 1
    prob: 0.2
  - entries:
    - id: MobXenoCMCarrier
      amount: 1
    - id: MobXenoCMBurrower
      amount: 1
    prob: 0.15
  configs:
    DefenseStructure: XenoHiveCore
    Mining: Xenos
    Megafauna: MobXenoCMQueen
  maxMobsPerRoom: 5

- type: salvageBiomeMod
  id: ForgeXenoHive
  desc: salvage-biome-mod-hive
  cost: 100
  biome: ForgeXenoHive

- type: salvageDungeonMod
  id: ForgeXenoHiveDungeon
  desc: salvage-dungeon-mod-hive
  cost: 100
  proto: ForgeXenoHiveDungeon
  biomes:
  - ForgeXenoHive

- type: salvageLightMod
  id: HiveGloom
  desc: salvage-light-mod-hive
  color: "#3F6B2A"
  biomes:
  - ForgeXenoHive

# Hive world. Later layers win, so the cave wall is checked before floor growth.
# Dungeon rooms and corridors are FloorXeno, which none of these layers allow,
# so the rock cannot spawn on top of the hive layout.
- type: biomeTemplate
  id: ForgeXenoHive
  layers:
  - !type:BiomeEntityLayer
    threshold: -1
    allowedTiles:
    - FloorCaveDrought
    entities:
    - XenoWeeds
  - !type:BiomeEntityLayer
    threshold: 0.2
    noise:
      seed: 3
      frequency: 0.08
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorCaveDrought
    entities:
    - XenoWeedsChoke
  - !type:BiomeEntityLayer
    threshold: 0.78
    noise:
      seed: 5
      frequency: 0.05
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorCaveDrought
    entities:
    - XenoWeedNode
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise:
      seed: 11
      frequency: 0.06
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorCaveDrought
    entities:
    - SpawnForgeXenoEggCluster
    - SpawnForgeXenoExpeditionWreck
  - !type:BiomeEntityLayer
    threshold: -0.5
    invert: true
    noise:
      seed: 0
      noiseType: Perlin
      fractalType: Ridged
      octaves: 1
      frequency: 0.1
      gain: 0.5
    allowedTiles:
    - FloorCaveDrought
    entities:
    - WallRock
    - WallRock
    - WallRockBasalt
    - WallXenoResin
  - !type:BiomeDummyLayer
    id: Loot
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorCaveDrought

- type: dungeonConfig
  id: ForgeXenoHiveDungeon
  data:
    colors:
      Decals: "#3F6B2A96"
    entities:
      Cabling: CableApcExtension
      CornerWalls: WallXenoResin
      Walls: WallXenoResin
    spawnGroups:
      CornerClutter: ForgeXenoHiveClutter
      Entrance: ForgeXenoHiveDoor
      EntranceFlank: ForgeXenoHiveWindow
      Junction: ForgeXenoHiveDoor
      WallMounts: ForgeXenoHiveWalls
      Window: ForgeXenoHiveWindow
    tiles:
      FallbackTile: FloorXeno
      WidenTile: FloorXeno
    whitelists:
      Rooms:
        tags:
        - NFSalvageOutpost
  layers:
  - !type:PrefabDunGen
    presets:
    - Bucket
    - Wow
    - SpaceShip
    - Tall
  - !type:CorridorDunGen
    width: 3
  - !type:DungeonEntranceDunGen
    count: 2
  - !type:RoomEntranceDunGen
  - !type:EntranceFlankDunGen
  - !type:ExternalWindowDunGen
  - !type:WallMountDunGen
  - !type:BoundaryWallDunGen
  - !type:JunctionDunGen
    width: 1
  - !type:JunctionDunGen
  - !type:AutoCablingDunGen
  - !type:CornerClutterDunGen
  - !type:EntityReplaceDunGen
    tile: FloorXeno
    corridorEntity: XenoWeedsChoke
    removals:
    - GrilleDungeon
    replacements:
      WallMining: WallXenoResin
      WallPlastitanium: WallXenoResin
      WindowDungeon: WallXenoMembrane
      WindowDirectionalDungeon: WallXenoMembrane
      WindowReinforcedDirectionalDungeon: WallXenoMembrane
      PlasmaWindowDirectionalDungeon: WallXenoMembrane
      PlasmaReinforcedWindowDirectionalDungeon: WallXenoMembrane

- type: entitySpawnEntry
  id: ForgeXenoHiveDoor
  entries:
  - id: DoorXenoResin

- type: entitySpawnEntry
  id: ForgeXenoHiveWindow
  entries:
  - id: WallXenoMembrane

- type: entitySpawnEntry
  id: ForgeXenoHiveClutter
  entries:
  - id: XenoWeeds
    orGroup: clutter
  - id: XenoEgg
    prob: 0.15
    orGroup: clutter
  - id: Crowbar
    prob: 0.05
    orGroup: clutter
  - id: SpawnDungeonRandomHumanCorpse
    prob: 0.04
    orGroup: clutter

- type: entitySpawnEntry
  id: ForgeXenoHiveWalls
  entries:
  - id: ExtinguisherCabinetFilled
    orGroup: content
  - id: IntercomCommon
    prob: 0.4
    orGroup: content
  - id: DefibrillatorCabinetFilled
    prob: 0.25
    orGroup: content

- type: entity
  id: SpawnForgeXenoResinHut
  name: resin hut
  suffix: Forge, Xeno, Expedition
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ForgeXenoCampSpawner
    pieces:
    - proto: WallXenoResin
      offset: -1, 1
    - proto: WallXenoResin
      offset: 0, 1
    - proto: WallXenoResin
      offset: 1, 1
    - proto: WallXenoResin
      offset: -1, 0
    - proto: WallXenoResin
      offset: 1, 0
    - proto: WallXenoResin
      offset: -1, -1
    - proto: DoorXenoResin
      offset: 0, -1
    - proto: WallXenoResin
      offset: 1, -1
    - proto: XenoWeeds
      offset: 0, 0
    - proto: XenoEgg
      offset: 0, 0

- type: entity
  id: SpawnForgeXenoExpeditionWreck
  name: expedition wreck
  suffix: Forge, Xeno, Expedition
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ForgeXenoCampSpawner
    pieces:
    - proto: SpawnDungeonRandomHumanCorpse
      offset: 0, 0
    - proto: XenoWeeds
      offset: 1, 0
    - proto: Crowbar
      offset: 0, 1

- type: entity
  id: SpawnForgeXenoEggCluster
  name: egg cluster
  suffix: Forge, Xeno, Expedition
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ForgeXenoCampSpawner
    pieces:
    - proto: XenoEgg
      offset: 0, 0
    - proto: XenoWeeds
      offset: 1, 0

- type: weightedRandomEntity
  id: ExpeditionRewardT6
  weights:
    SpaceCashExpeditionT6: 1

- type: entity
  parent: SpaceCashExpedition
  id: SpaceCashExpeditionT6
  name: credits (300,000)
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnItemsOnUse
    items:
    - id: SpaceCash100000
      amount: 3
    sound:
      collection: storageRustle
  - type: StaticPrice
    price: 300000
