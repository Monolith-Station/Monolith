- type: metabolizerType
  id: Plasma
  name: metabolizer-type-plasma

# thanks goobstation!

- type: entity
  id: BasePlasmamanOrgan
  abstract: true
  components:
  - type: Sprite
    sprite: _Mono/Mobs/organs.rsi
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5 # Not very nutritious
        - ReagentId: Plasma
          Quantity: 2.5
      food:
        maxVol: 5
        reagents:
        - ReagentId: Plasma
          Quantity: 5
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Plasma
        Quantity: 5
  - type: FlavorProfile
    flavors:
      - plasma

- type: entity
  id: OrganMonolithcorrucptedLungs
  parent: [ BasePlasmamanOrgan, OrganHumanLungs, BaseMonolithContrabandT1 ]
  name: Strange lungs
  description: A blackened pair of lungs covered in cancerous monolithic crystal growths. They are capable of metabolizing plasma and oxygen.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: base_unshaded
      shader: unshaded
  - type: Metabolizer
    metabolizerTypes: [ Plasma ]
  - type: Lung
    alert: LowOxygen
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Plasma
          Quantity: 2.5
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: Plasma
          Quantity: 5
  - type: Organ
    onAdd:
    - type: PointLight
      color: "#7e009e"
      radius: 1.7
      energy: 2
      enabled: true
    - type: CollectiveMind
      channels:
      - MonolithicMind
      defaultChannel: MonolithicMind