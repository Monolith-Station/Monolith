- type: entity
  parent: BasePDA
  id: ServantPDA
  name: servant PDA
  description: A generic mercenary PDA. Unlike its owner.
  components:
  - type: Pda
    id: ServantIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-mercenary
  - type: PdaBorderColor
    borderColor: "#48484b"
    accentVColor: "#424d2c"
  - type: Icon
    state: pda-mercenary
  
- type: entity
  parent: IDCardStandard
  id: ServantIDCard
  name: servant ID card
  components:
  - type: IdCard
    job: MonolithServant
  - type: Sprite
    sprite: _Meh/id_cards.rsi
    layers:
    - state: default
    - state: idservant
  - type: Clothing
    sprite: _NF/Objects/Misc/id_cards.rsi