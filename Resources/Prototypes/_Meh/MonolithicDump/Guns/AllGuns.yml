# guns

- type: entity
  name: FC-AS Avalanche (7.62x39mm subsonic)
  parent: [BaseWeaponRifle, BaseGunWieldable]
  id: WeaponRifleASAvalanche
  description: A limited-production special smartgun made as a self-defense weapon for untrained ship crew.
  components:
  - type: Sprite
    sprite: _Meh/Guns/FC-SA.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -5
  - type: Gun
    minAngle: 24
    maxAngle: 32
    angleIncrease: 12
    angleDecay: 20
    cameraRecoilScalar: 0
    fireRate: 8
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/FC-ASShot1.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: Clothing
    sprite: _Meh/Guns/FC-SA.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x39mmSubsonicLowCap
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine762x39mmSubsonic
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x39mmSubsonic
        priority: 1
        whitelist:
          tags:
          - Cartridge762x39mmSubsonic
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 10000
    vendPrice: 25000
  - type: PirateBountyItem
    id: ExperimentalFactionWeapon
  - type: EyeCursorOffset
    maxOffset: 1.5
    pvsIncrease: 0.5
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95


