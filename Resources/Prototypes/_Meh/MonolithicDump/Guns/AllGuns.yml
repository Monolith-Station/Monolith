#Bullet

- type: entity
  id: Cartridge566mmFlechette
  name: rifle bullet (5.66mm Flechette)
  parent: BaseCartridge
  description: Large shotgun round. Kicks like a mule, and will tear a chunk out of anything that doesnt have the armor to protect it.
  components:
  - type: Tag
    tags:
    - Cartridge
    - Cartridge566mmFlechette
  - type: CartridgeAmmo
    proto: Bullet566mmFlechette
    soundEject:
      collection: ShellEject
      params:
        variation: 0.06
  - type: EmitSoundOnLand
    sound:
      collection: ShellEject
      params:
        variation: 0.06
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/556Flechette.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
    scale: 0.8, 0.8
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

