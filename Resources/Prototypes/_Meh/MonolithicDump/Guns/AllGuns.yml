# T1
- type: entity
  name: FC-23 pity (9x19mm)
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable]
  id: WeaponSubMachineGunPity
  description: Midnight Arms Co. Streamlined SMG that's commonly found use among uprisings and criminals. Uses 5.7x28mm ammo.
  components:
  - type: Sprite
    sprite: _Meh/Guns/FC-23.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    maxAngle: 50
    minAngle: 25
    fireRate: 8.5
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/atreides_fire.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice # Mono
    price: 2000
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -15
  - type: Clothing
    sprite: _Meh/Guns/FC-23.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine9x19mmSubMachineGunFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge9x19mmFMJ

- type: entity
  name: FC-47 Frenzy (12 gauge)
  parent: BaseWeaponShotgun
  id: WeaponShotgunFrenzy
  description: Groovy! Uses 12 gauge shotgun shells.
  components: # needs to be super inaccurate because you don't need to wield it
  - type: Sprite
    sprite: _Meh/Guns/FC-47.rsi # Delta-V: add _DV prefix
  - type: Clothing
    sprite: _Meh/Guns/FC-47.rsi # Delta-V: add _DV prefix
  - type: Item
    size: Normal
    sprite: _Meh/Guns/FC-47.rsi # Delta-V: add _DV prefix, sawn_inhands_64x<sawn
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BallisticAmmoProvider
    soundRack: /Audio/Weapons/Guns/Cock/smg_cock.ogg #Mono
    capacity: 6
  - type: Construction
    graph: ShotgunSawn
    node: shotgunsawn
    deconstructionTarget: null
  - type: StaticPrice # Mono
    price: 300

