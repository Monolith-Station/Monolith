- type: entity
  parent: BaseStructure
  id: CEHellpodHatch
  name: hellpod boarding hatch
  description: This looks familiar. But you can't put your finger on why...
  components:
  - type: CEHellpodHatch
  - type: ExaminableDamage
    messages: null
  - type: Physics
    canCollide: false
  - type: Sprite
    sprite: _Mono/Structures/Machines/hellpod_hatch.rsi
    drawdepth: FloorObjects
    layers:
    - state: closed
      map: ["hatch"]
  - type: Appearance
  - type: CEHellpodHatchVisuals
  - type: ContainerContainer
    containers:
      occupant: !type:ContainerSlot {}

- type: entity
  parent: BaseComputer
  id: CEHellpodConsole
  name: hellpod targeting console
  description: There's a golden skull and the words "FREEDOM NEVER SLEEPS" engraved on the side.
  components:
  - type: CEHellpodConsole
  - type: OreSiloClient
  - type: MaterialStorage
    storageLimit: 0
    insertOnInteract: false
    canEjectStoredMaterials: false
  - type: ActivatableUI
    key: enum.CEHellpodConsoleKey.Key
  - type: UserInterface
    interfaces:
      enum.CEHellpodConsoleKey.Key:
        type: CEHellpodConsoleBoundUserInterface

- type: ceHellpodType
  id: CEHellpodDefault
  pod: CEHellpod
  materials:
    Steel: 2500

- type: entity
  parent: BaseStructure
  id: CEHellpod
  name: hellpod
  description: Freedom never sleeps, does it?
  components:
  - type: CEHellpod
  - type: ExaminableDamage
    messages: null
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: CEZPhysics
    autoStep: false
  - type: Sprite
    sprite: _Mono/Objects/hellpod.rsi
    state: pod
    offset: 0, 0.5
    noRot: true
  - type: ContainerContainer
    containers:
      occupant: !type:ContainerSlot {}

- type: alert
  id: CEHellpodHatch
  icons:
  - sprite: /Textures/_Crescent/Interface/Alerts/buckled.rsi
    state: buckled
  name: ce-hellpod-hatch-alert-name
  description: ce-hellpod-hatch-alert-desc
  clickEvent: !type:CEHellpodExitAlertEvent
