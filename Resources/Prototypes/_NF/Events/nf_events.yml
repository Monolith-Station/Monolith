- type: entity
  id: BaseStationEventNFModerateDelay
  parent: BaseGameRule
  abstract: true
  components:
    - type: GameRule
      delay:
        min:  30
        max:  40

- type: entity
  id: BluespaceCargoCrate
  parent: BaseStationEventNFModerateDelay
  components:
  - type: StationEvent
    startAnnouncement: bluespace-cargo-event-announcement
    weight: 5
    duration: 35
    reoccurrenceDelay: 120 # Andromeda: CHEGA
  - type: BluespaceCargoRule
    spawnerPrototype: RandomCargoSpawner
    requireSafeAtmosphere: true
    # Andromeda start: CHEGA. also coloca flash pras caixas normais também, porque porquê não?
    flashPrototype: EffectFlashMcBluespace
    minimumSpawns: 1
    maximumSpawns: 3
    # Andromeda end

- type: entity
  id: BluespaceMcCargoCrate
  parent: BaseStationEventNFModerateDelay
  components:
  - type: StationEvent
    startAnnouncement: bluespace-cargo-event-announcement
    earliestStart: 20
    weight: 5
    duration: 35
    maximumPlayers: 20
    reoccurrenceDelay: 240 # Andromeda: CHEGA
  - type: BluespaceCargoRule
    spawnerPrototype: CrateFoodMcCargo
    flashPrototype: EffectFlashMcBluespace
    requireSafeAtmosphere: true

- type: entity
  id: BluespaceSyndicateCrate
  parent: BaseStationEventNFModerateDelay
  components:
  - type: StationEvent
    startAnnouncement: bluespace-syndicate-crate-event-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 1
    duration: 35
    earliestStart: 60 # Mono
    #minimumPlayers: 20 # Mono
    reoccurrenceDelay: 300 # Andromeda: (Frontier) 480 > (Mono) 180 > (Andromeda) 300
  - type: BluespaceCargoRule
    spawnerPrototype: CrateSyndicateSurplusBundle
    maximumSpawns: 1

- type: entity
  id: SmugglingFax
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 8 # Fairly common.
    duration: 35
    earliestStart: 50
    minimumPlayers: 2
    reoccurrenceDelay: 240 # Andromeda: 50 > 240
  - type: RandomFaxRule
    minFaxes: 2 # Mono
    maxFaxes: 3 # Mono
    name: deaddrop-faxed-hint-name
    prototypeId: PaperDeadDropFax
    content: deaddrop-faxed-hint-content # Default contents, will be edited.
    stampedBy:
    - stampedName: deaddrop-faxed-hint-signature
      stampedColor: "#850000"
    stampState: paper_stamp-syndicate
    preFaxActions:
    - !type:GetRandomDeadDropAction

- type: entity
  id: SmugglingFaxBig
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 100 # Fairly common.
    minimumPlayers: 10
    duration: 35
    reoccurrenceDelay: 240 # Andromeda: Adiciona variavel em 240
  - type: RandomFaxRule
    minFaxes: 4 # Mono
    maxFaxes: 5 # Mono
    name: deaddrop-faxed-hint-name
    prototypeId: PaperDeadDropFax
    content: deaddrop-faxed-hint-content # Default contents, will be edited.
    stampedBy:
    - stampedName: deaddrop-faxed-hint-signature
      stampedColor: "#850000"
    stampState: paper_stamp-syndicate
    preFaxActions:
    - !type:GetRandomDeadDropAction
