- type: entity
  parent: BaseStructureDynamic
  id: CrateTradeBaseSecure
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: TradeCrate
    valueAtDestination: 1500
    valueElsewhere: 400
  - type: IgnoreMarketModifier
  - type: Icon
    sprite: Structures/Storage/Crates/secure.rsi
    state: icon
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/Crates/secure.rsi
    layers:
    - state: icon
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
    - sprite: _NF/Interface/Misc/cargo_destination_icons.rsi
      state: cargo_other
      offset: 0.275,-0.265
      map: ["enum.TradeCrateVisualLayers.Icon"]
      visible: false
    - sprite: _NF/Interface/Misc/cargo_destination_icons.rsi
      state: cargo_priority_inactive
      offset: 0.025,-0.265
      map: ["enum.TradeCrateVisualLayers.Priority"]
      visible: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Reflect
    reflects:
    - Energy
    reflectProb: 0.2
    spread: 90
  - type: StaticPrice
    price: 0
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.01 # 100 trade crates = 1 animal
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper }
          Bounty: { state: bounty }
          CaptainsPaper: { state: captains_paper }
          Invoice: { state: invoice }
  - type: PaperLabel
    labelSlot:
      insertVerbText: Attach Label
      ejectVerbText: Remove Label
      whitelist:
        components:
        - Paper
      blacklist:
        tags:
        - Book
  - type: ContainerContainer
    containers:
      paper_label: !type:ContainerSlot
  - type: ItemSlots
  - type: RequireProjectileTarget
  - type: ItemTax # Mono
    taxAccounts:
      Frontier: 0.3

- type: entity
  parent:
  - CrateTradeBaseSecure
  id: CrateTradeBaseSecureContraband
  name: phaethon dynasty supply crate
  description: Contains a small batch of supplies for the Phaethon Dynasty Vanguard, which will be shipped to them upon sale at a cargo depot. The courier will be paid handsomely. A tamper-lock will acidify the crate's contents upon its destruction.
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 400 # Very heavy
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
  - type: Contraband
    turnInValues:
      FederationMilitaryCredit: 30 # Mono 12 -> 30 (on par with small monolithic crystal)
      Doubloon: 30 # Mono 12 -> 30
  - type: ShipyardSellCondition
    blockSale: true
    reason: shipyard-console-contraband-onboard
    allowedShipyardTypes:
    - Syndicate
    - BlackMarket
  - type: PirateBountyItem
    id: ContrabandCrate
  - type: ItemTax # Mono
    taxAccounts:
      BlackMarket: 0.3
      nfsd: -0.075
  - type: RadarBlip
    radarColor: "#cc4e0e"
    scale: 1.5
    shape: hexagon
    visibleFromOtherGrids: true
  - type: CurrencyInjectionOnSell # Mono: smuggling directly funds the PDV
    company: PDV
    amount:
      Doubloon: 10
