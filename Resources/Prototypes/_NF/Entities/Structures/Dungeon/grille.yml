# Special grilles for dungeons that block lasers
- type: entity
  id: GrilleDungeon
  parent: Grille
  suffix: Dungeon only
  # categories: [ DoNotMap ] # FIXME - shouldn't be mapped on shuttles/POIs, bluespace events might be fine
  description: A grille covered in soot and grime.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
    - type: Sprite
      drawdepth: Walls
      sprite: Structures/Walls/grille-new.rsi
      layers:
      - state: electrified
        sprite: Effects/electricity.rsi
        map: ["enum.ElectrifiedLayers.Sparks"]
        shader: unshaded
        visible: false
      - state: rust
        sprite: Decals/dirty.rsi
      - state: dirtheavy-mono
        sprite: Decals/dirty.rsi
      - state: dirtheavy
        sprite: Decals/dirty.rsi
    - type: Icon
      layers:
      - sprite: Structures/Walls/grille-new.rsi
        state: full
      - sprite: Decals/dirty.rsi
        state: rust
