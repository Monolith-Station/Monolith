# Materials
- type: entity
  id: LockerMaterials
  parent: NFLockerBaseSecure
  name: materials locker
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: secure
    stateDoorOpen: secure_open
    stateDoorClosed: secure_door
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        decal1:
          True: { visible: false }
          False: { visible: true }
        decal2:
          True: { visible: false }
          False: { visible: true }
  - type: Sprite
    layers:
    - state: secure
      map: ["enum.StorageVisualLayers.Base"]
    - state: secure_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: door-decal-engi-01
      map: [ decal1 ]
      color: "#ad8c27"
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]

# Wooden Cabinet
- type: entity
  id: LockerWoodenGeneric
  parent: LockerBooze
  name: wooden cabinet
  description: Dusty old wooden cabinet. Smells like grandparents.
  components:
  - type: Construction
    graph: StorageFurnitureGraph
    node: LockerWoodenGenericNode
  - type: StaticPrice
    price: 75 # Frontier: 75

