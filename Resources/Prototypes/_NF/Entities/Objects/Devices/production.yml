- type: entity
  id: ShredderMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: shredder machine board
  description: A machine printed circuit board for a shredder.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: Shredder # Would add economy mats to this but it's literally just for paper
      requirements:
        MatterBin: 1
      stackRequirements:
        Glass: 1

