- type: entity
  id: PortableGeneratorDKMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: D-K-type portable generator machine board
  description: A machine printed circuit board for a D-K-type portable generator.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: PortableGeneratorDK
      requirements:
        Capacitor: 2
      stackRequirements:
        CableHV: 10
      tagRequirements:
        MotorEconomy1: # Stator!
          amount: 1
          defaultPrototype: MotorEconomy1
        MicroprocessorEconomy1:
          amount: 1
          defaultPrototype: MicroprocessorEconomy1
    - type: PhysicalComposition
      materialComposition:
        Glass: 200
      chemicalComposition:
        Silicon: 20
    - type: StaticPrice
      price: 40

