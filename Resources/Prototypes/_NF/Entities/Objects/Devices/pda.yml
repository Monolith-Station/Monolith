- type: entity
  id: MusicBasePDA
  abstract: true
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    respectMidiLimits: false
    handheld: true

- type: entity
  parent: [MusicBasePDA, AdminPDA]
  id: NFAdminPDA
  components:
  - type: CartridgeLoader
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NewsReaderCartridge
      - BountyContractsCartridge
      - AstroNavCartridge
      - WantedListCartridge
      - LedgerCartridge
      - LogProbeCartridge
      - MailMetricsCartridge
      - AppraisalCartridge
      - NetProbeCartridge
      - MedTekCartridge # Mono

- type: entity
  parent: BasePDA
  id: MercenaryPDA
  name: mercenary PDA
  description: This PDA smells of war.
  components:
  - type: Pda
    id: MercenaryIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-mercenary
  - type: PdaBorderColor
    borderColor: "#48484b"
    accentVColor: "#424d2c"
  - type: Icon
    state: pda-mercenary

- type: entity
