# Mineral tables for asteroids
# region Rock Spawner
- type: entityTable
  id: NFRockMineralSoft
  table: !type:GroupSelector
    children:
    - id: AsteroidRock
      weight: 0.4
    - id: AsteroidRockCoal
      weight: 0.1
    - id: AsteroidRockTin
      weight: 0.16
    - id: AsteroidRockQuartz
      weight: 0.06
    - id: AsteroidRockSalt
      weight: 0.06
    - id: AsteroidRockGold
      weight: 0.01
    - id: AsteroidRockSilver
      weight: 0.04
    - id: AsteroidRockPlasma
      weight: 0.07
    - id: AsteroidRockUranium
      weight: 0.04
    - id: AsteroidRockLithium # Mono
      weight: 0.04
    - id: AsteroidRockCopper # Mono
      weight: 0.06
    - id: AsteroidRockBananium
      weight: 0.01
    - id: AsteroidRockArtifactFragment
      weight: 0.01
    - id: AsteroidRockDiamond
      weight: 0.002
    - id: AsteroidRockBluespace
      weight: 0.003
    - id: AsteroidRockElementalSpawner
      weight: 0.06

- type: entity
  id: NFRockMineralSoft
  parent: MarkerBase
  name: rock mineral spawner
  suffix: Soft
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Walls/rock.rsi
      state: rock
    - state: green
    - sprite: Objects/Weapons/Melee/pickaxe.rsi
      state: pickaxe
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: NFRockMineralSoft
# endregion Rock Spawners

