- type: entity
  name: salvage t2 machine parts spawner
  id: SalvagePartsT2Spawner
  parent: MarkerBase
  suffix: Spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _NF/Objects/Misc/stock_parts.rsi # Frontier
      state: advanced_matter_bin
  - type: RandomSpawner
    prototypes:
    - AdvancedCapacitorStockPart
    - NanoManipulatorStockPart
    - AdvancedMatterBinStockPart
    - ComponentBrickEconomy1 # Mono
    - ElectromagnetEconomy1 # Mono
    - RadioEconomy1 # Mono
    - OpticsEconomy1 # Mono
    - CameraEconomy1 # Mono
    - MotorEconomy1 # Mono
    - MatterBinEconomy1 # Mono
    - MicroprocessorEconomy1 # Mono
    - CapacitorEconomy1 # Mono
    - ArmorPlateEconomy1 # Mono
    chance: 0.95
    rarePrototypes:
    - SalvagePartsT3Spawner # Mono
    rareChance: 0.05
    offset: 0.5

