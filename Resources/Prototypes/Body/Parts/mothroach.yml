- type: entity
  id: PartMothroach
  parent: [BaseItem, BasePart]
  name: "moth body part"
  abstract: true
  components:
  - type: Icon # Shitmed Change
    sprite: Mobs/Species/Moth/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Mothroach
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: InsectBlood
        Quantity: 10
    
- type: entity
  id: TorsoMothRoach
  name: "mothroach torso"
  parent: [ PartMothroach, BaseTorsoAnimal ]
  components:
