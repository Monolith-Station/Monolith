- type: body
  id: Animal
  name: "animal"
  root: torso
  slots:
    head:
      part: HeadAnimal
      connections:
      - torso
      organs:
        brain: OrganAnimalBrain
        eyes: OrganAnimalEyes
    torso:
      part: TorsoAnimal
      organs:
        lungs: OrganAnimalLungs
        stomach: OrganAnimalStomach
        liver: OrganAnimalLiver
        heart: OrganAnimalHeart
        kidneys: OrganAnimalKidneys
      connections:
      - right leg
      - left leg
    right leg:
      part: RightLegAnimal
    left leg:
      part: LeftLegAnimal


