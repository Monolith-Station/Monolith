#chrono/future soldier hardsuit

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitChronolegioneer
  name: futuristic hardsuit
  description: A hardsuit covered in an unknown material that protects against most material and temporal damage
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/chronolegioneer.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/chronolegioneer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.05
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.05
        Slash: 0.05
        Piercing: 0.05
        Heat: 0.05
        Cold: 0.05
        Radiation: 0.05
        Caustic: 0.05
  - type: ClothingSpeedModifier
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: HeldSpeedModifier
  - type: StasisProtection
  - type: StasisBlinkProvider
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitChronolegioneer
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock

- type: entity
  parent: ClothingOuterHardsuitChronolegioneer
  id: ClothingOuterHardsuitChronolegioneerUnremoveable
  suffix: Unremoveable
  components:
  - type: Unremoveable

# cybersun stealth

- type: entity
  parent: [ClothingOuterHardsuitBase, BaseToggleClothing] # Mono - toggle
  id: ClothingOuterHardsuitCybersunStealth
  suffix: stealth
  name: stealth hardsuit
  description: A hardsuit with stealth plating for operations, the shielding doesn't work while you're moving though! # Mono - no longer needs helmet
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/cybersunstealth.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/cybersunstealth.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: PowerCellDraw # Mono start: It needs power now
    drawRate: 20
  - type: ToggleCellDraw
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
        whitelist:
          tags:
            - PowerCell
        blacklist:
          tags:
            - PowerCage # balance
          components:
            - BatterySelfRecharger # Mono end
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.5
        Radiation: 0.2
        Caustic: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitCybersunStealth
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: ToggleClothing # Mono: Swapped this around
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      enabledOnDeath: false
      enabledOnCrit: false
    - type: StealthOnMove
      passiveVisibilityRate: -0.4
      movementVisibilityRate: 0.4
    - type: RevealOnDamage # Mono end
