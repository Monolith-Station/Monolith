- type: entity
  parent: [ BaseMobSpeciesOrganic ]
  id: BaseMobAriral
  name: Urist McAriral
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Ariral
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: Carriable
  - type: Hunger
  - type: Puller
    needsHands: false
  - type: Thirst
  - type: Body
    prototype: Ariral
    requiredLegs: 2
  - type: Icon
    sprite: _Wega/Mobs/Species/Ariral/parts.rsi
    state: full_m
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 6
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Ariral
  - type: Bloodstream
    bloodMaxVolume: 200
    bloodReagent: AriralBlood
    bloodlossDamage:
      types:
        Bloodloss: 1.5
    bloodlossHealDamage:
      types:
        Bloodloss: -2
    bleedReductionAmount: 0.2
  - type: Temperature
    heatDamageThreshold: 326 # ~ 52 °C
    coldDamageThreshold: 280 # ~ 7 °C
    currentTemperature: 310.15
    specificHeat: 46
    coldDamage:
      types:
        Cold: 0.25
    heatDamage:
      types:
        Heat: 0.35
  - type: NightVision
    relayOverlay: false
    goggleEffect: true
    viewCircleRadius: 1000 #Forge-changed 450 to 1000
    viewCircleCount: 2 #Forge-changed 4 to 2 (у феленидов не 4 глаза)
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#c2ffc2" # Forge-Change #808080 to #c2ffc2 // сам фосфорный цвет, он так же может давать пересвет
    lightingColor: "#0EFFFFFF" # Forge-Change #FFFFFF32 to #0EFFFFFF // Это главный рычаг яркости в темноте
    amplification: 1.0 #Forge-Change 32 to 1.0 // параметр Усиление влияет на то как сильно слепят источники света
  - type: TemperatureSpeed
    thresholds:
      280: 0.9
      270: 0.7
      260: 0.5
      240: 0.3
  - type: Speech
    speechSounds: Ariral
  - type: Vocal
    sounds:
      Male: MaleAriral
      Female: FemaleAriral
      Unsexed: MaleAriral
  - type: LanguageKnowledge
    speaks:
    - Ilasir
    - TauCetiBasic
    understands:
    - Draconic
    - Ilasir
    - TauCetiBasic
  - type: Wagging
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: jumpsuit-female
      outerClothing:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: outerclothing
      shoes:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: outerclothing
      shoes:
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Ariral/displacement.rsi
            state: shoes
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: petting-success-generic-others

