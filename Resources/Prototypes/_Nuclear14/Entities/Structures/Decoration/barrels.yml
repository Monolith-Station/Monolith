# Barrels
# Base
- type: entity
  parent: BaseStructureDynamic
  id: N14BaseBarrel
  name: barrel
  description: This barrel looks like it could contain something.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/barrels.rsi
    state: blue-closed
    netsync: false
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.35"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Base Open
- type: entity
  parent: N14BaseBarrel
  id: N14BaseBarrelOpen
  suffix: open
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      barrel:
        maxVol: 500
  - type: DrainableSolution
    solution: barrel
  - type: ReagentTank

# Closed
- type: entity
  parent: N14BaseBarrel
  id: N14BlackBarrel
  name: black barrel
  description: A worn out black barrel. The label is torn off.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/barrels.rsi
    state: black-closed

- type: entity
  parent: N14BaseBarrel
  id: N14BlueBarrel
  name: blue barrel
  description: A blue barrel with a warning sign of. Maybe it contains water?
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/barrels.rsi
    state: blue-closed

- type: entity
  parent: N14BaseBarrel
  id: N14RedBarrel
  name: red barrel
  description: A red barrel with an explosive warning sign on. Better be careful.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/barrels.rsi
    state: red-closed
  - type: SolutionContainerManager
    solutions:
      barrel:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 10
  - type: Explosive
    explosionType: Default
    totalIntensity: 90

- type: entity
  parent: N14BaseBarrel
  id: N14YellowBarrel
  name: yellow barrel
  description: A yellow barrel with a radiation warning sign on. Better be careful.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/barrels.rsi
    state: yellow-closed
  - type: RadiationSource
    intensity: 2
    slope: 1

