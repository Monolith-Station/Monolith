- type: entity
  id: OrganResomiEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Resomi
  description: "Resomi eyes have great nightvision for hunting prey in maintenance tunnels."
  components:
  - type: Organ
    onAdd:
    - type: NightVision
      flashDurationMultiplier: 2

- type: entity # Starlight
  id: OrganResomiHeart
  parent: OrganHumanHeart
  suffix: Resomi
  description: "The heart of a resomi."
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Resomi]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity # Goobstation - resomi stomach
  id: OrganResomiStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
