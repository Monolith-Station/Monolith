  - uid: 380
    components:
    - type: MetaData
      desc: An automated message faxed onto your ship, written in corporate text. Specifies how to use your ship and what its capabilities are.
      name: MAWC Shipyard Dossier
    - type: Transform
      pos: 2.678959,4.476126
      parent: 1
    - type: Paper
      content: >-
        NOTICE///


        You are in posession of a Wisp-Class from the Shipyards. Shy but mean-tempered, a respectable frigate, with some room for improvement. Your advice and specifics are as follows below.


        [---------------------------------(FEATURES)-----------------------]

        ///Button 1 bolts exterior access doors.

        ///Button 2 closes the doors if they are open.

        ///Button 3 closes the blast doors. You will have to manually reopen them using the buttons nearby them.

        ///Button 4 initiates a "Stealth" mode. Reduces thermal signature at the cost of functionality.


        [---------------------------------(SPECIFICS)-----------------------]

        ///As a standard-rate combat frigate, the vessel is front-loaded in armor profile and designed with forwards attack angles in mind.

        ///Flexibility in firing arcs is a key strength here. Though be wary your rear is a large blindspot.

        ///If so desired, the Dravon hardpoints enable flexible weapon swapping whenever desired. You have four medium hardpoints, with upgrade room allocated by the gunnery server.

        -RANGE

        AK800: 2.2km, Fast

        DRAVON: 1.2km, Moderate

        SUGGESTIONS:

        AK820: 2.2km, Ultra Fast

        AK570: 900m, Fast, Burst

        L85: 480m, Ultra Fast

        DRAVON (FLAK): Locked to 900m, Moderate


        [---------------------------------(TACTICS)-----------------------]

        ///If you have flown a Mote, you will understand the lessons learned from Wolfpack advantages. Treat a wisp similarly, and engage in active wolfpacks.

        ///Like a Mote, a Wisp is capable of long range chip damage and harassment. Unlike a Mote, it can actually afford to go more aggressive and up-front if needed be.

        ///Large vessels may still manage to shred the hull if they are able to focus you. Reverse thrust is concentrated at the front, and engineering as well. Avoid prolonged frontal engagements up close if possible.


        [----------------------------------------------------------------------]

        ///A Cunning hunter, swift with a dagger with the bite of a wolf. Always on the prowl for potential prey.


        ///Make it count.


        ///Carpenter Shipyard Division
