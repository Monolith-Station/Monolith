    - type: Paper
      content: >-
        ///NOTICE


        ///You are in posession of a Wind-Class Missile Fighter. Below is a list of outlined advice and specifics, as this is a very fragile vessel. Compared to a Mote, mobility is not the same.


        [----------------------------|FEATURES|-------------------------]

        ///Button 1 will close all external doors. Button 2 will bolt them. This is your basic anti-boarder defense.

        ///Button 3 disables lights and thrusters, and turns off your generator. This is your stealth mode.


        [---------------------------|SPECIFICS|--------------------------]

        ///Ammo reserve is admittedly low. Purchase or fabricate additional Vanyk and Paladin ammo if you are planning any serious engagements.

        ENGAGEMENT RANGES:

        PALADIN (HE): 6km, slow

        PALADIN (EMPHE) 6km, slow

        PALADIN (HV): 8km, fast

        VANYK (HE): 2.8km, medium

        Keep these in mind. You have no PD.


        [-------------------------|TACTICS|---------------------------]

        ///Your ideal strategy will be to scoot-and-shoot, firing once on a target, and then moving out of position to fire at another angle. Move fast, and you will hopefully succeed.


        [-------------------------------------------------------------------]

        ///Like a Wind of Destruction, Freedom will come to those who bend their will. With no compass, the soldier feels no disgrace.


        Make it Count.


        ///Carpenter Shipyard Division
