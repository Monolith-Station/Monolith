- proto: PaperOffice
  entities:
  - uid: 209
    components:
    - type: Transform
      pos: 3.3922882,7.45133
      parent: 1
    - type: Paper
      content: >-
        ///NOTICE


        You are in posession of a Spark-Class. This is a parasitic mining vessel, a quick and frail one. The specifications and capabilities are as listed below.


        [----------------------------------(FEATURES)----------------------------]

        ///Button 1 bolts external access doors.

        ///Button 2 closes the external doors.

        ///Button 3 shuts external access blast doors. They will need to be manually reopened from their buttons.

        ///Button 4 activates a "Stealth" mode, sacrificing speed and functionality for lower a thermal signature.


        [----------------------------------(SPECIFICS)----------------------------]

        ///Paper thin. Extremely fast. Practically a laser strapped onto some engines.

        ///There is light industrial capability, specifically ore refining and ore collection. An ore magnet makes ore acquisition convenient

        ///Apollo's can be treated like a tempo. Emptying the ore magnet with each burst recharge creates a consistent pacing.

        -RANGE

        APOLLO: 600m, Laser.

        SUGGESTIONS:

        Are you expecting to throw a shitbox into combat? Get a Mote or a Wind. Maniac.


        [----------------------------------(TACTICS)----------------------------]

        ///Combat is completely nonviable for a vessel such as this.

        ///If another ship takes hostile interest, your only choice is to flee.

        ///Excersize paranoia and persistent attention to radar whilst in flight. One misstep and you disappear before you get to say your goodbyes.


        [----------------------------------------------------------------------------]

        ///Like fairies, little wisps and embers of flame would dance around the ruins. Among the dancing fires, stragglers sought solid, cold footing.


        ///Fuel the Nest.


        ///Carpenter Shipyard Division
    - type: UserInterface
      actors:
        enum.PaperUiKey.Key:
        - invalid
    - type: ActiveUserInterface
