- proto: PaperOffice
  entities:
  - uid: 145
    components:
    - type: MetaData
      desc: An automated message faxed onto your ship, written in corporate text. Specifies how to use your ship and what its capabilities are.
      name: MAWC Shipyard Dossier
    - type: Transform
      pos: 1.4722519,1.5198011
      parent: 1
    - type: Paper
      content: >-
        ///NOTICE


        You are in posession of a Mote-Class from the shipyard. A small, parasitic fighter craft designed purely to harass. Because its so risky to fly, your general advice and specifics are below as follows.


        [--------------------------(FEATURES)--------------------------]

        ///Button 1 bolts exterior doors.

        ///Button 2 closes exterior doors.

        ///Button 3 engages a low-power "Stealth" mode. Reduces thermal signature at the cost of functionality.


        [--------------------------(SPECIFICS)--------------------------]

        ///The vessel posesses three whole hardpoints, two medium and one heavy.

        ///It is advisable to swap out the L85's for a larger weapon as early as possible if you intend to use Motes for assault, as otherwise they fulfill a PD niche.

        ///The AK800 can be upgraded immediately to an AK820 if you get the opportunity.

        -RANGE

        AK800: 2.2km, Fast

        L85: 480m, Ultra Fast

        -SUGGESTIONS

        AK820: 900m, Fast, Burst

        DRAVON: 1.2KM, Moderate

        AC-35: 700m, Ultra Fast


        [--------------------------(TACTICS)--------------------------]

        ///Motes are extremely frail and their firepower may be lacking. With sufficient upgrades however, and enough piloting skill, a Mote wolfpack can shred all but the toughest of warships.

        ///Motes are extremely cheap and ubiqutous, about as disposable as a flying gun can get. Try and coordinate wolfpacks if possible, never send one Mote on its own.

        ///Even if they cant do much harm, a Mote is capable of long range chip damage on a distracted target. Pick off stragglers and avoid big ships if they are able to focus you.


        [-------------------------------------------------------------------]

        ///Like a shard of glass. Quick and Jagged. Strength in numbers.


        ///Make it count.


        ///Carpenter Shipyard Division
