- proto: PaperOffice
  entities:
  - uid: 442
    components:
    - type: Transform
      pos: -2.4746919,-6.388854
      parent: 1
    - type: Paper
      content: >-
        ///NOTICE


        You are in posession of an Icarus-Class artillery frigate. Rudimentary and rugged, there isnt too much going for the vessel beyond range and speed, which you should take advantage of. Below is a list of advisory details and specifics for you to know.


        [-----------------------(FEATURES)--------------------]

        ///Button 1 will bolt all external doors.

        ///Button 2 will close the doors incase any are open.

        ///You have extremely high forwards thrust. Take note.


        [-----------------------(SPECIFICS)--------------------]

        ///Your vessel carries plentiful surplus ammunition. Four Vanyks and two Paladins are equipped onto the front hull.

        ///There are four light hardpoint slots to allow for point defense upgrades, with a high-power gunnery to accomodate room for such. The Vanyk mounts lay under medium hardpoints for missiles.

        ///In spite of the effective armament, your only PD is a Sunny Flare dispenser, and the MS-100 at the center.

        ///The hull is equipped with reinforced plastitanium only at the vitals.

        -RANGE

        PALADIN (HE): 6km, slow

        PALADIN (EMPHE): 6km, slow

        PALADIN (HV, Reccomended): 8km, fast

